<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SNAI Study Dashboard</title>
<meta name="description" content="Interactive study dashboard for the SNAI course — all 22 modules, CPU scheduling calculator, chmod calculator, terminal reference, flashcards, quiz and exam mode.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F3F5FA;--surface:#FFFFFF;--surface2:#EAEEF7;--ink:#152036;--muted:#56637B;--line:#D9DFEC;
  --acc:#2453D6;--acc-ink:#FFFFFF;--acc-soft:#E3EAFD;
  --p1:#0B8A7E;--p1s:#DDF3F0;--p2:#5745D6;--p2s:#E7E4FB;--p3:#BF5F12;--p3s:#FBE9D9;
  --ok:#13835A;--oks:#DDF3E9;--bad:#C23A3A;--bads:#FBE3E3;--warn:#8A5A00;--warns:#FFF1CC;
  --code-bg:#0C1322;--code-ink:#D8E3F7;--code-dim:#7F8EAB;--code-prompt:#5EE6A8;
  --pop:0 10px 30px rgba(15,25,50,.18);
  --fh:"Bricolage Grotesque","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --fb:"Figtree","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --fm:"JetBrains Mono","SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1424;--surface:#151D31;--surface2:#1D2740;--ink:#E6EBF6;--muted:#9BA8C1;--line:#2A3654;
    --acc:#7EA4FF;--acc-ink:#0E1424;--acc-soft:#1E2C52;
    --p1:#46D3C1;--p1s:#12332F;--p2:#9A8EFF;--p2s:#262250;--p3:#F3A25E;--p3s:#3B2716;
    --ok:#4CD39A;--oks:#123528;--bad:#FF8080;--bads:#3C1A1A;--warn:#F3C15B;--warns:#3A2E0F;
    --code-bg:#080D18;--pop:0 10px 30px rgba(0,0,0,.5);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1424;--surface:#151D31;--surface2:#1D2740;--ink:#E6EBF6;--muted:#9BA8C1;--line:#2A3654;
  --acc:#7EA4FF;--acc-ink:#0E1424;--acc-soft:#1E2C52;
  --p1:#46D3C1;--p1s:#12332F;--p2:#9A8EFF;--p2s:#262250;--p3:#F3A25E;--p3s:#3B2716;
  --ok:#4CD39A;--oks:#123528;--bad:#FF8080;--bads:#3C1A1A;--warn:#F3C15B;--warns:#3A2E0F;
  --code-bg:#080D18;--pop:0 10px 30px rgba(0,0,0,.5);color-scheme:dark;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.6;min-height:100%}
h1,h2,h3,h4{font-family:var(--fh);line-height:1.2;margin:0 0 .5em;letter-spacing:-.01em}
h1{font-size:clamp(1.9rem,4vw,2.7rem);font-weight:800}
h2{font-size:1.45rem;font-weight:700}
h3{font-size:1.12rem;font-weight:700}
h4{font-size:1rem;font-weight:700}
p{margin:0 0 .8em}
a{color:var(--acc)}
code{font-family:var(--fm);font-size:.88em;background:var(--surface2);padding:.1em .38em;border-radius:5px;border:1px solid var(--line)}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:.5em .7em;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
mark{background:var(--warns);color:var(--ink);border-radius:3px;padding:0 2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* layout */
.app{display:grid;grid-template-columns:288px minmax(0,1fr);min-height:100dvh}
.sidebar{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;background:var(--surface);border-right:1px solid var(--line);padding:18px 14px 28px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);padding:4px 6px 14px}
.brand-mark{font-family:var(--fm);font-weight:700;background:var(--code-bg);color:var(--code-prompt);border-radius:9px;padding:6px 9px;font-size:.9rem}
.brand b{font-family:var(--fh);font-size:1.15rem}
.brand small{display:block;color:var(--muted);font-size:.78rem;line-height:1.2}
.nav a{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:9px;color:var(--ink);text-decoration:none;font-size:.94rem}
.nav a:hover{background:var(--surface2)}
.nav a.on{background:var(--acc-soft);font-weight:700}
.nav details{margin:2px 0}
.nav summary{cursor:pointer;list-style:none;padding:8px 10px;font-weight:700;font-family:var(--fh);border-radius:9px;display:flex;justify-content:space-between;align-items:center}
.nav summary::-webkit-details-marker{display:none}
.nav summary::after{content:"+";color:var(--muted);font-weight:500}
.nav details[open]>summary::after{content:"–"}
.nav summary:hover{background:var(--surface2)}
.nav .grp{margin:14px 10px 4px;color:var(--muted);font-size:.82rem;font-weight:600}
.mnum{flex:0 0 auto;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:.76rem;font-weight:700;font-family:var(--fm)}
.p1 .mnum,.mnum.p1{background:var(--p1s);color:var(--p1)}
.p2 .mnum,.mnum.p2{background:var(--p2s);color:var(--p2)}
.p3 .mnum,.mnum.p3{background:var(--p3s);color:var(--p3)}
.nav a.done .mnum{background:var(--ok);color:var(--surface)}
.nav a.done .mnum::before{content:"✓"}
.nav a.done .mnum span{display:none}
.mt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.main{min-width:0}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;gap:10px;align-items:center;padding:10px clamp(12px,3vw,32px);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.search{flex:1;position:relative;max-width:640px}
.search input{width:100%;padding:.62em .9em .62em 2.3em;border-radius:12px}
.search svg{position:absolute;left:.75em;top:50%;transform:translateY(-50%);color:var(--muted)}
.search kbd{position:absolute;right:.6em;top:50%;transform:translateY(-50%);font-family:var(--fm);font-size:.75rem;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 .4em;background:var(--surface2)}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:40px;height:40px;display:grid;place-items:center;flex:0 0 auto}
.icon-btn:hover{background:var(--surface2)}
#menuBtn{display:none}
.view{max-width:1120px;margin:0 auto;padding:clamp(16px,3vw,34px) clamp(12px,3vw,32px) 80px}
.overlay{display:none}
@media (max-width:920px){
  .app{grid-template-columns:minmax(0,1fr)}
  .sidebar{position:fixed;z-index:40;top:0;bottom:0;left:0;width:min(86vw,320px);height:auto;padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-102%);transition:transform .22s ease;box-shadow:var(--pop)}
  .sidebar.open{transform:none}
  .overlay.show{display:block;position:fixed;inset:0;z-index:30;background:rgba(5,10,25,.5)}
  #menuBtn{display:grid}
  .search kbd{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* generic components */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:16px}
.card.flat{background:var(--surface2);border-color:transparent}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.btn{display:inline-flex;align-items:center;gap:.4em;padding:.55em 1em;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;text-decoration:none;color:var(--ink);line-height:1.2}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:.35em .7em;font-size:.88rem;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.3em .85em;font-size:.9rem;text-decoration:none;color:var(--ink);cursor:pointer}
.chip:hover{background:var(--surface2)}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.badge{display:inline-block;border-radius:7px;padding:.05em .55em;font-size:.8rem;font-weight:700;background:var(--surface2);color:var(--muted)}
.badge.p1{background:var(--p1s);color:var(--p1)}.badge.p2{background:var(--p2s);color:var(--p2)}.badge.p3{background:var(--p3s);color:var(--p3)}
.badge.ok{background:var(--oks);color:var(--ok)}.badge.bad{background:var(--bads);color:var(--bad)}.badge.warn{background:var(--warns);color:var(--warn)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:16px}
.tab{border:0;background:none;padding:.6em 1em;border-radius:10px 10px 0 0;font-weight:600;color:var(--muted);border-bottom:3px solid transparent}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--acc)}
.progress{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.progress>i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .4s}
.progress.p1>i{background:var(--p1)}.progress.p2>i{background:var(--p2)}.progress.p3>i{background:var(--p3)}
.np{border:1.5px dashed var(--warn);background:var(--warns);color:var(--ink);border-radius:12px;padding:12px 14px;margin:10px 0}
.np b{color:var(--warn)}
.tag-extra{display:inline-block;font-size:.72rem;font-weight:700;background:var(--warns);color:var(--warn);border-radius:6px;padding:0 .45em;margin-left:.4em;vertical-align:middle}
.tag-calc{display:inline-block;font-size:.72rem;font-weight:700;background:var(--acc-soft);color:var(--acc);border-radius:6px;padding:0 .45em;margin-left:.4em;vertical-align:middle}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:14px}
table{border-collapse:collapse;width:100%;font-size:.94rem}
th,td{padding:.6em .8em;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--surface2);font-family:var(--fh);font-weight:700;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.table-wrap table td:first-child{font-weight:600}
ul.clean{margin:0;padding:0;list-style:none}
ul.clean li{position:relative;padding:.35em 0 .35em 1.7em;border-bottom:1px dashed var(--line)}
ul.clean li:last-child{border-bottom:0}
ul.clean li::before{content:"";position:absolute;left:.25em;top:.95em;width:.6em;height:.6em;border-radius:3px;background:var(--acc)}
ul.trap li::before{background:var(--bad);border-radius:50%}
ul.trick li::before{background:var(--p3);transform:rotate(45deg)}
ul.exam li::before{background:var(--ok)}
ul.rev li::before{background:var(--p2)}
.code{background:var(--code-bg);color:var(--code-ink);border-radius:10px;margin:8px 0;overflow:hidden;border:1px solid color-mix(in srgb,var(--code-bg) 70%,#fff 8%)}
.code-h{font-family:var(--fm);font-size:.75rem;color:var(--code-dim);padding:6px 12px;border-bottom:1px solid rgba(255,255,255,.08)}
.code pre{margin:0;padding:12px 14px;overflow-x:auto;font-family:var(--fm);font-size:.86rem;line-height:1.55}
.code code{background:none;border:0;padding:0;font-size:inherit}
.code .pr{color:var(--code-prompt)}.code .cm{color:var(--code-dim)}
.kv{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:6px 14px}
.kv dt{font-weight:700}.kv dd{margin:0}
@media (max-width:620px){.kv{grid-template-columns:1fr}.kv dd{margin-bottom:8px}}
details.sec{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:14px}
details.sec>summary{cursor:pointer;list-style:none;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary h3{margin:0}
details.sec>summary::after{content:"+";font-size:1.3rem;color:var(--muted);font-family:var(--fm)}
details.sec[open]>summary::after{content:"–"}
details.sec>.sec-b{padding:2px 18px 16px}
.page-h{margin-bottom:22px}
.page-h p{max-width:70ch;color:var(--muted);font-size:1.05rem}
.stat{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 16px}
.stat b{display:block;font-family:var(--fh);font-size:1.9rem;line-height:1.1}
.stat span{color:var(--muted);font-size:.9rem}

/* hero + module map */
.hero{background:var(--code-bg);color:var(--code-ink);border-radius:18px;padding:clamp(18px,3vw,30px);margin-bottom:18px;border:1px solid color-mix(in srgb,var(--code-bg) 70%,#fff 8%)}
.hero .ln{font-family:var(--fm);font-size:.95rem;color:var(--code-dim);min-height:1.5em}
.hero .ln .pr{color:var(--code-prompt)}.hero .ln .cmd{color:var(--code-ink)}
.hero .cur{display:inline-block;width:.6em;height:1.05em;background:var(--code-prompt);vertical-align:-.18em;animation:blink 1.1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.hero h1{color:#fff;margin:.35em 0 .3em}
.hero p{color:#B4C0D8;max-width:62ch}
.hero .chip{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.18);color:#E6EBF6}
.hero .chip:hover{background:rgba(255,255,255,.16)}
.map-part{margin-bottom:16px}
.map-part h3{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,196px),1fr));gap:10px}
.tile{position:relative;display:block;text-decoration:none;color:var(--ink);border-radius:12px;padding:11px 12px 11px 12px;border:1px solid var(--line);background:var(--surface);min-height:74px}
.tile:hover{border-color:var(--ink)}
.tile .mnum{margin-bottom:6px;width:auto;padding:0 8px;height:22px}
.tile.p1 .mnum{background:var(--p1s);color:var(--p1)}.tile.p2 .mnum{background:var(--p2s);color:var(--p2)}.tile.p3 .mnum{background:var(--p3s);color:var(--p3)}
.tile b{display:block;font-family:var(--fh);font-size:.95rem;line-height:1.25}
.tile.done{background:var(--oks);border-color:var(--ok)}
.tile.done .mnum{background:var(--ok);color:var(--surface)}
.tile.done .mnum::after{content:" ✓"}

/* module page */
.mod-h{border-radius:16px;padding:20px 22px;margin-bottom:16px;border:1px solid var(--line)}
.mod-h.p1{background:var(--p1s)}.mod-h.p2{background:var(--p2s)}.mod-h.p3{background:var(--p3s)}
.mod-h h1{margin:.2em 0 .3em}
.think{border-left:4px solid var(--acc);padding:6px 0 6px 14px;margin:12px 0;color:var(--muted)}
.think b{color:var(--ink)}
.ex-card{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;background:var(--bg)}
.ex-card h4{margin-bottom:.25em}
.term-key{font-size:.7rem;font-weight:700;background:var(--acc-soft);color:var(--acc);border-radius:6px;padding:0 .4em;margin-left:.4em;vertical-align:middle}
.mod-nav{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}

/* gantt */
.gantt-wrap{overflow-x:auto;padding:6px 2px 4px}
.gantt{position:relative;height:52px;margin-top:4px}
.gb{position:absolute;top:0;height:44px;border-radius:6px;color:#fff;display:grid;place-items:center;font-weight:700;font-family:var(--fm);font-size:.85rem;border:2px solid var(--surface);overflow:hidden}
.gb.idle{background:repeating-linear-gradient(45deg,var(--surface2),var(--surface2) 6px,var(--bg) 6px,var(--bg) 12px);color:var(--muted);border-color:var(--line)}
.gb.cs{background:repeating-linear-gradient(45deg,#7A8399,#7A8399 4px,#5B6479 4px,#5B6479 8px);font-size:.7rem}
.gticks{position:relative;height:22px;font-family:var(--fm);font-size:.78rem;color:var(--muted)}
.gticks span{position:absolute;transform:translateX(-50%)}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.sched-inputs input[type=number]{width:5.2em;text-align:right}
.sched-inputs input.pid{width:5em}
.field{display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--muted)}
.field input,.field select{color:var(--ink)}
.err{color:var(--bad);font-weight:600}
.steps{margin:0;padding-left:1.2em}
.steps li{margin:.25em 0}

/* chmod */
.perm-grid{display:grid;grid-template-columns:110px repeat(3,1fr) 110px;gap:8px;align-items:center}
.perm-grid .h{font-weight:700;font-family:var(--fh);text-align:center}
.perm-cell{border:1.5px solid var(--line);border-radius:12px;padding:12px 6px;text-align:center;cursor:pointer;background:var(--surface);user-select:none}
.perm-cell.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.perm-cell b{display:block;font-family:var(--fm);font-size:1.3rem}
.perm-cell small{opacity:.85}
.big-num{font-family:var(--fm);font-size:2.4rem;font-weight:700;letter-spacing:.1em}
@media (max-width:620px){.perm-grid{grid-template-columns:74px repeat(3,1fr)}.perm-grid .sum{grid-column:1/-1;text-align:left}.perm-grid .sum:not(.h){padding-bottom:8px}}

/* diagrams */
.stack{display:flex;flex-direction:column;align-items:stretch;gap:0;max-width:560px;margin:8px auto}
.layer{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 16px;text-align:center;cursor:pointer;position:relative}
.layer:hover{border-color:var(--ink)}
.layer.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.layer.lit{box-shadow:0 0 0 3px var(--acc)}
.layer b{font-family:var(--fh)}
.layer small{display:block;opacity:.85}
.arrow{height:26px;position:relative;text-align:center;color:var(--muted);font-family:var(--fm)}
.arrow::before{content:"";position:absolute;left:50%;top:0;bottom:8px;width:2px;background:var(--line);transform:translateX(-50%)}
.arrow::after{content:"▼";position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);font-size:.7rem;color:var(--muted)}
.zone{border:2px dashed var(--line);border-radius:16px;padding:8px;position:relative;margin:4px 0}
.zone>.zl{position:absolute;top:-12px;left:14px;background:var(--bg);padding:0 8px;font-weight:700;font-size:.85rem;color:var(--muted);font-family:var(--fh)}
.flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}
.node{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;font-weight:700;font-family:var(--fh);text-align:center}
.node.acc{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.node.p1{background:var(--p1s);border-color:var(--p1)}.node.p2{background:var(--p2s);border-color:var(--p2)}.node.p3{background:var(--p3s);border-color:var(--p3)}
.arr{font-size:1.4rem;color:var(--muted);font-family:var(--fm)}
.proc{display:inline-block;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;margin:4px;min-width:130px;vertical-align:top}
.proc.dead{opacity:.45;text-decoration:line-through}
.proc small{display:block;color:var(--muted)}
.pcb{border:2px solid var(--ink);border-radius:10px;background:var(--surface);padding:10px 12px;font-family:var(--fm);font-size:.85rem;min-width:220px}
.pcb h4{font-family:var(--fh);margin-bottom:6px}
.pcb div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding:3px 0}
.pcb.hot{box-shadow:0 0 0 4px var(--acc-soft);border-color:var(--acc)}
.ramgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;max-width:640px}
.frame{aspect-ratio:1.6;border-radius:8px;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--fm);font-size:.78rem;background:var(--bg);color:var(--muted)}
.frame.A{background:#2F6FEB;color:#fff;border-color:#2F6FEB}.frame.B{background:#1E9E6E;color:#fff;border-color:#1E9E6E}.frame.C{background:#B04AD6;color:#fff;border-color:#B04AD6}.frame.D{background:#C7601F;color:#fff;border-color:#C7601F}
.frame.disk{background:var(--surface2)}
.bar{display:flex;height:44px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--bg)}
.bar>div{display:grid;place-items:center;font-family:var(--fm);font-size:.78rem;color:#fff;border-right:2px solid var(--bg)}
.bar>.gap{background:repeating-linear-gradient(45deg,var(--bads),var(--bads) 5px,var(--bg) 5px,var(--bg) 10px);color:var(--bad)}
.meter{height:14px;border-radius:99px;background:var(--surface2);overflow:hidden}
.meter>i{display:block;height:100%;background:var(--ok);transition:width .3s,background .3s}

/* flashcards + quiz */
.flip{perspective:1200px;max-width:720px;margin:0 auto}
.flip-in{position:relative;min-height:260px;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.flip.f .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;padding:26px;display:flex;flex-direction:column;justify-content:center;border:1px solid var(--line);background:var(--surface);overflow:auto}
.face.back{transform:rotateY(180deg);background:var(--acc-soft)}
.face .q{font-family:var(--fh);font-size:1.35rem;font-weight:700}
.face .hint{color:var(--muted);font-size:.85rem;margin-top:12px}
@media (prefers-reduced-motion:reduce){.flip-in{transition:none}.face{backface-visibility:visible}.flip.f .face.front{display:none}.face.back{transform:none;position:absolute}.flip:not(.f) .face.back{display:none}}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px;margin:8px 0}
.opt:hover{border-color:var(--ink)}
.opt.sel{border-color:var(--acc);background:var(--acc-soft)}
.opt.right{border-color:var(--ok);background:var(--oks)}
.opt.wrong{border-color:var(--bad);background:var(--bads)}
.opt .k{flex:0 0 auto;font-family:var(--fm);font-weight:700;width:1.6em;height:1.6em;border-radius:6px;background:var(--surface2);display:grid;place-items:center;font-size:.85rem}
.qbox{max-width:800px}
.fb{border-radius:12px;padding:14px 16px;margin-top:12px;border:1.5px solid}
.fb.ok{background:var(--oks);border-color:var(--ok)}.fb.bad{background:var(--bads);border-color:var(--bad)}
.palette{display:flex;flex-wrap:wrap;gap:6px}
.pal{width:34px;height:34px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);font-family:var(--fm);font-size:.82rem}
.pal.ans{background:var(--acc-soft);border-color:var(--acc)}
.pal.cur{outline:3px solid var(--acc);outline-offset:1px}
.pal.ok{background:var(--oks);border-color:var(--ok)}.pal.no{background:var(--bads);border-color:var(--bad)}
.q-text{font-size:1.15rem;font-weight:600;margin:.4em 0 .6em}
.bars .b{display:grid;grid-template-columns:160px 1fr 52px;gap:10px;align-items:center;margin:6px 0;font-size:.92rem}
@media (max-width:620px){.bars .b{grid-template-columns:100px 1fr 44px}}
.res{border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:8px 0;background:var(--surface)}
.res .ttl{font-weight:700}
.res .snip{color:var(--muted);font-size:.92rem}
.hide{display:none!important}
.compare-col{outline:0}
th.hl,td.hl{background:var(--acc-soft)}
.cmd-card{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:10px}
.cmd-card>summary{cursor:pointer;list-style:none;padding:10px 14px;display:flex;gap:12px;align-items:center}
.cmd-card>summary::-webkit-details-marker{display:none}
.cmd-card>summary code{font-size:1rem;font-weight:700;background:var(--code-bg);color:var(--code-prompt);border-color:transparent;padding:.2em .6em}
.cmd-card .cmd-b{padding:4px 16px 14px}
.cmd-card[open]>summary{border-bottom:1px solid var(--line)}
.sym{font-family:var(--fm);font-size:1.5rem;font-weight:700;background:var(--code-bg);color:var(--code-prompt);border-radius:10px;min-width:64px;text-align:center;padding:6px 10px;align-self:flex-start}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:10px;padding:.6em 1.1em;z-index:60;box-shadow:var(--pop)}

/* ---- 00_util.js ---- */
"use strict";
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const md = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const PART_RANGE = { 1: [1, 9], 2: [10, 17], 3: [18, 22] };
const PART_TITLE = { 1: "Part 1 · Modules 1–9", 2: "Part 2 · Modules 10–17", 3: "Part 3 · Modules 18–22" };
const PART_SRC = { 1: "SNAI_1C_1", 2: "SNAI_1C_2", 3: "SNAI_1C_3" };
const partOf = n => n <= 9 ? 1 : n <= 17 ? 2 : 3;
const modTitle = n => { const m = MODULES.find(x => x.n === n); return m ? m.title : "Module " + n; };
const NP_TEXT = "Not provided in the source material";

/* ---------- persistent state (browser storage may be empty or blocked) ---------- */
const STORE_KEY = "snai-study-v1";
function defaultState() { return { done: {}, fc: {}, quiz: {}, exams: [], theme: "" }; }
function loadState() {
  try { const r = localStorage.getItem(STORE_KEY); if (r) return Object.assign(defaultState(), JSON.parse(r)); } catch (e) { /* storage unavailable */ }
  return defaultState();
}
let S = loadState();
function saveState() { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) { /* ignore */ } }

/* ---------- html builders ---------- */
function codeBlock(txt, label) {
  const lines = String(txt).split("\n").map(l => {
    const e = esc(l);
    if (/^guest@snai:~\$/.test(l)) return e.replace(/^(guest@snai:~\$)/, '<span class="pr">$1</span>');
    if (/^\s*#/.test(l)) return '<span class="cm">' + e + "</span>";
    return e;
  });
  return '<div class="code">' + (label ? '<div class="code-h">' + esc(label) + "</div>" : "") + "<pre><code>" + lines.join("\n") + "</code></pre></div>";
}
const ul = (arr, cls) => '<ul class="clean ' + (cls || "") + '">' + arr.map(x => "<li>" + md(x) + "</li>").join("") + "</ul>";
const np = (arr) => arr && arr.length ? '<div class="np"><b>' + NP_TEXT + ":</b><ul class=\"clean\">" + arr.map(x => "<li>" + md(x) + "</li>").join("") + "</ul></div>" : "";
const partBadge = n => '<span class="badge p' + partOf(n) + '">Module ' + n + "</span>";
function pct(a, b) { return b ? Math.round(100 * a / b) : 0; }
function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 1800);
}
function normText(s) { return String(s).toLowerCase().replace(/[‘’'"`]/g, "").replace(/\s+/g, " ").trim(); }
function bar(p, cls) { return '<div class="progress ' + (cls || "") + '" role="progressbar" aria-valuenow="' + p + '" aria-valuemin="0" aria-valuemax="100"><i style="width:' + p + '%"></i></div>'; }

/* ---------- action registry (click delegation) ---------- */
const ACTIONS = {};
function rerender() { if (typeof route === "function") route(true); }

{ n: 10, part: 2, title: "Scheduling: FCFS", slides: "SNAI_1C_2 · slides 2–5",
  simple: "Scheduling means deciding which process gets the CPU next. FCFS (First Come First Served) is the simplest rule: whoever lines up first runs first, start to finish, with no interruptions — like a queue at a single shop counter. The catch: a quick customer can get stuck behind a long one.",
  analogy: "A single-counter shop with a queue. Each customer (process) needs a certain amount of time to be served (burst time). The CPU is the one counter. If everyone is served strictly in the order they lined up, some customers with a quick request end up stuck behind someone with a long one.",
  concepts: [

    "Timeslicing example (lecture): Queue: Chrome, VS Code, Spotify, Chrome, Slack, Python. The CPU gives each one a tiny time slice before switching: 0 ms → Chrome · 6 ms → VS Code · 12 ms → Spotify · 18 ms → Chrome · 24 ms → Slack · 30 ms → Python. This rapid switching (thousands of times a second) creates the illusion that everything is running simultaneously.",
    "**The four numbers:** Arrival Time (when the process shows up and is ready to run) · Burst Time (how much CPU time it needs to finish — the 'execution time') · Waiting Time (time spent sitting in the queue, not running yet) · Turnaround Time (total time from arrival to finish = Waiting Time + Burst Time).",
    "**FCFS rule:** whoever arrives first runs first, start to finish, no interruptions. FCFS is **non-preemptive**: once a process starts, nobody can interrupt it until it finishes.",
    "Worked example (like your board): P1 = 10 ms, P2 = 8 ms, P3 = 3 ms, arriving in that order with no gap. Timeline: P1 (0–10), P2 (10–18), P3 (18–21).",
    "**One rule underneath:** a process's waiting time = the sum of every burst time that runs before it. P1: nothing before → 0 ms. P2: waits for P1's 10 ms → 10 ms. P3: waits for P1 (10) and P2 (8) → 18 ms.",
    "Turnaround = Waiting + Burst: P1 0 + 10 = 10 ms · P2 10 + 8 = 18 ms · P3 18 + 3 = 21 ms.",
    "**Convoy effect:** one long job at the front makes all the short ones wait.",
    "FCFS — best at: simplicity. Weak point: convoy effect."
  ],
  terms: [
    ["Scheduling", "Deciding which process gets the CPU next.", 1],

    ["Turnaround Time", "Total time from arrival to finish = Waiting Time + Burst Time.", 1],
    ["Non-preemptive", "Once a process starts, nobody can interrupt it until it finishes (FCFS).", 1],
    ["Convoy effect", "One long job at the front makes all the short ones wait.", 1],

    { t: "Average waiting (calculated)", b: "Average waiting = (0 + 10 + 18) / 3 = 28 / 3 ≈ **9.33** ms. Average turnaround = (10 + 18 + 21) / 3 ≈ **16.33** ms. (Your slide writes the average-waiting formula; the values are calculated here.)" },

{ n: 12, part: 2, title: "Scheduling: Priority", slides: "SNAI_1C_2 · slides 8–9",

{ n: 14, part: 2, title: "PCB & Context Switching", slides: "SNAI_1C_2 · slides 13–15",
  simple: "The OS keeps a small record (the Process Control Block, PCB) in RAM for every process — like a sticky note saying exactly where that process stopped. Switching from one process to another means saving the old one's note and loading the new one's. That save-and-load is pure admin, so it costs real time.",
  analogy: "A teacher helping many students one at a time. Each time she leaves a student she jots down where that student stopped on a sticky note, so when she returns she doesn't ask 'where was I?'. The sticky note is the PCB. Writing and reading the note is the context switch — and it takes a few real seconds each time, on top of the actual helping.",
  concepts: [
    "The **Process Control Block (PCB)** is a small record the OS keeps in RAM for every process it creates.",
    "**It holds:** (1) **PID** (Process ID) — a number so the OS knows exactly which process this is. (2) **What it was doing** — the exact instruction it had reached, so it can resume from that exact spot, not from the start. (3) **What it needed** — the small values the CPU was actively holding for it at that moment. (4) **Its state** — whether it's currently running, waiting for its turn, or ready to go.",
    "The CPU runs one process at a time (Module 4), so the OS keeps swapping: pause P1, run P2, pause P2, run P3. Every swap is a **context switch** and forces two extra jobs: (1) **Save** — write P1's current progress onto its PCB. (2) **Load** — pick up P2's PCB and put its saved progress back into the CPU.",
    "Neither step is your actual program running — they're pure admin. That's why context switching has a real time cost: every switch 'steals' a small slice of time that could've gone to real work.",
    "The PCB is just the bookmark: where it stopped and what the CPU was holding. Not the whole program.",
    "Too many switches = slower: more time on admin, less on real work. (This is Round Robin's weak point.)"
  ],
  terms: [["PCB", "Process Control Block — the sticky note / ID card; a small record kept in RAM, one per process.", 1], ["PID", "Process ID — a number so the OS knows exactly which process this is.", 1], ["Context switch", "SAVE the current process's state to its PCB + LOAD the next process's state from its PCB.", 1], ["Process state", "Whether it's running, waiting for its turn, or ready to go.", 1]],
  examples: [
    { t: "Lecture code", b: "", code: "P1 running → OS pauses it → save P1's state to its PCB → load P2's state from its PCB → P2 running\n# the CPU did zero real 'work' during the save/load — pure overhead" },
    { t: "What's on the card", b: "PID · where it stopped (exact instruction reached) · values the CPU was holding · state (running / waiting for its turn / ready)." }
  ],
  cmds: [["P1 → save to PCB → load P2's PCB → P2", "Say 3 times."]],
  exam: ["Define PCB and list its four contents (PID, where it stopped, values the CPU held, state).", "Context switch = SAVE + LOAD.", "Why frequent context switching slows a system: each switch costs real CPU time on admin, not real work.", "What the OS writes into the PCB right before pausing a process: its current progress."],
  traps: ["Thinking the PCB stores a permanent copy of the entire program file — it holds just the bookmark.", "Thinking the PCB is only created when the process finishes — the OS keeps one for every process it creates.", "Thinking more switching is always faster — each switch is an admin tax."],
  tricks: ["PCB = sticky note / ID card. Context switch = writing and reading the sticky note.", "Four things on the PCB: PID, where it stopped, values held, state."],
  revise: ["PCB = record in RAM, one per process.", "Contents: PID, exact instruction reached, values CPU held, state.", "Context switch = Save + Load = overhead.", "Too many switches = more admin, less real work."],
  np: ["Which state changes happen between running, waiting and ready (a state diagram) is not described.", "How long a switch takes in real machines is not stated (the teacher analogy says 'a few real seconds')."],
  link: { to: "#/process", label: "Try the PCB / context-switch simulator" } },

{ n: 15, part: 2, title: "Real Terminal Toolkit", slides: "SNAI_1C_2 · slides 16–19",
  simple: "Everything in this module is a real, physical tool for something you already learned as theory. Nothing new to understand — just new places to see it happening: multiprocessing, ps aux, parent/child, kill -9, what happens to memory when a process ends, and top/htop.",
  analogy: "Theory you already know, now with real buttons to press.",
  concepts: [
    "**Multiprocessing** — using more than one CPU core. A single process (especially in Python) normally runs on just one CPU core, even if your computer has 8. To use several cores at once, a program creates multiple processes — separate, independent copies — and the OS spreads them across different cores so they genuinely run in parallel, not just switched quickly (Module 4).",
    "**ps aux** — lists every running process: who owns it, its PID, how much CPU it's using and the command that started it. This is the real tool for the PID that lives inside every process's PCB (Module 14). Example: `newtonuser 4821 92.5 python spike.py` (user, PID, %CPU).",
    "**Parent & child processes** — typing a command into your shell (Module 8) doesn't run it directly; the shell creates a new process for it. Shell = parent, new command = child. The OS keeps this family tree, e.g. so closing a terminal can also close everything it started.",
    "**kill -9** — sends a 'stop immediately, no cleanup' signal to a specific PID. The emergency-stop option for a process that's frozen and won't respond normally.",
    "**Memory after a process ends** — the instant a process finishes (normally or via kill -9), the OS takes back all the RAM and the PCB slot it was using, and returns it to the free pool for the next process. Without this, RAM would slowly fill up forever, even as you keep closing apps (Module 2).",
    "**htop / top** — unlike ps aux (a plain list), these actively sort processes: the biggest CPU users float to the top, live and constantly updating. That is why the Python processes appeared near the top during the CPU spike demo."
  ],
  terms: [["Multiprocessing", "Using more than one CPU core by creating multiple separate processes that run truly in parallel.", 1], ["ps aux", "A list (snapshot) of every process: USER, PID, %CPU, COMMAND.", 1], ["kill -9", "Force-stop a process with no cleanup — last resort for a frozen process.", 1], ["top / htop", "Live, constantly updating view sorted by resource usage.", 1], ["Free pool", "Where the OS returns a finished process's RAM and PCB slot.", 0]],
  examples: [
    { t: "ps aux (lecture)", b: "", code: "guest@snai:~$ ps aux\nnewtonuser 4821 92.5 python spike.py   (user, PID, %CPU)" },
    { t: "Try it (Mac/Linux) — from the PPT", b: "", code: "python3 -c 'while True: pass' &\nps aux | grep python\nkill -9 (the PID you see)" }
  ],
  cmds: [["ps aux", "List every process (snapshot)."], ["top / htop", "Live, sorted by resource usage."], ["kill -9 <PID>", "Force-stop, no cleanup."], ["ps aux | grep python", "Find python processes (pipe, Module 17)."]],
  exam: ["Multiprocessing: multiple separate processes → different cores → truly parallel.", "ps aux = every process with USER, PID, %CPU, COMMAND. The PID is the same PID stored in the PCB.", "Shell = parent, command = child.", "After a process ends, the OS takes back its RAM and PCB slot.", "htop sorts by resource usage; ps aux is a plain list."],
  traps: ["Thinking htop 'always lists Python processes first' or that Python processes 'always have the lowest PIDs'. htop sorts by resource usage.", "Thinking the terminal is destroyed and replaced by the new process — the shell is the parent, the command is its child."],
  tricks: ["ps aux = snapshot list. htop = live sorted view.", "Shell = parent. Each command = child."],
  revise: ["Multiprocessing = several processes on several cores.", "ps aux = all processes (USER, PID, %CPU, COMMAND).", "kill -9 = force stop, last resort.", "Ended process → RAM + PCB slot back to the free pool.", "top/htop = live, sorted."],
  np: ["'Feedback at every layer' — this section was collapsed on your college page, so its text was not in the PPT.", "Differences between top and htop beyond 'both live and sorted' are not covered (see Module 22 note)."],
  link: { to: "#/terminal", label: "Open the terminal command reference" } },

{ n: 16, part: 2, title: "Memory Management", slides: "SNAI_1C_2 · slides 20–23",
  simple: "RAM is limited but many processes need it at once. The OS acts like a hostel warden: it hands out RAM fairly, tracks who has what, takes it back when a process ends and — most importantly — stops one process from touching another's memory. It does this with paging, virtual memory and, when RAM runs out, swapping.",
  analogy: "A hostel with numbered rooms. Every guest (process) is handed a room and told 'this is your space'. The warden (OS) keeps a master list of who's in which room, and hands out empty rooms to new guests — nobody wanders into someone else's room.",
  concepts: [
    "**The basic problem:** RAM is limited (Module 2) and many processes need some of it at once. The OS's four jobs: (1) hand out RAM fairly, (2) keep track of who has what, (3) take it back when a process ends (Module 15), (4) most importantly, stop one process from reading or overwriting another process's memory by accident.",
    "**Paging:** instead of giving each process one giant, continuous chunk of RAM (which wastes space when processes don't fit neatly), the OS splits all of RAM into small, fixed-size blocks called **pages** (a common size is **4KB**). A process's memory gets spread across however many pages it needs — not necessarily next to each other physically.",
    "**Why fixed-size?** Uneven, custom-sized chunks leave awkward little gaps of unusable space between them over time — called **fragmentation**. Fixed-size pages fit together like uniform bricks, with no odd gaps left over.",
    "**Virtual memory — the lie every process is told:** every process is told 'you have the whole computer's memory to yourself, starting from address 0.' This isn't true — it's a convenient lie called virtual memory. Behind the scenes, the OS (with help from hardware called the **Memory Management Unit, MMU**) quietly translates each process's fake address into a real, scattered physical location in RAM — one that no other process is allowed to touch.",
    "This is why two different processes can both use 'address 1000' at the same time without any conflict — both lies point to two completely separate real physical locations.",
    "**Swapping:** when RAM truly runs out, pages move to disk. Disk is far slower than RAM, so the computer feels laggy."
  ],
  terms: [["Paging", "Splitting RAM into fixed-size blocks called pages.", 1], ["Page", "A small, fixed-size block of RAM (a common size is 4KB).", 1], ["Fragmentation", "Awkward little gaps of unusable space left by custom-sized chunks.", 1], ["Virtual memory", "The convenient lie: each process is told it has the whole memory from address 0.", 1], ["MMU", "Memory Management Unit — hardware that translates each fake address to a real physical location.", 1], ["Swapping", "When RAM runs out, pages move to disk — much slower, so the computer feels laggy.", 1]],
  examples: [
    { t: "Virtual memory (lecture code)", b: "", code: "Process thinks: 'I own address 0 to the end of memory'\nReality: OS quietly maps that to real, scattered, protected RAM locations" },
    { t: "Two processes, address 1000", b: "Both use 'address 1000' at the same time. Two different lies pointing to two different real places. No conflict." },
    { t: "Uniform bricks", b: "Fixed-size pages fit together like uniform bricks with no odd gaps; custom-sized chunks leave gaps too small to use." }
  ],
  cmds: [["Page size (common): 4KB", "From the lecture."], ["Virtual address (fake) —MMU→ physical address (real, scattered, protected)", "Address translation."]],
  exam: ["List the four jobs of memory management.", "Paging = RAM split into fixed-size pages (e.g. 4KB) to avoid fragmentation.", "Virtual memory = each process is told it owns memory from address 0; the MMU translates to real physical locations.", "Swapping: pages moved to disk when RAM runs out — laggy because disk is far slower than RAM."],
  traps: ["Thinking fixed page sizes are 'required by law' or 'make the CPU faster' — the reason is avoiding fragmentation.", "Thinking a laggy computer is due to overheating CPU or swapping 'deleting files' — it is pages shuffling to the slow disk.", "Thinking a process's pages must be next to each other physically — they need not be."],
  tricks: ["Paging = fixed-size blocks; avoids fragmentation.", "Virtual memory = a convenient lie.", "Swapping = pages to disk = slow = laggy."],
  revise: ["Memory jobs: hand out, track, take back, protect.", "Paging: fixed blocks (4KB), no fragmentation.", "Virtual memory + MMU: fake address → real address.", "Swapping: disk is slow → lag."],
  np: ["The words 'physical address' as a formal term, page tables and frames are not used in your PPT — it says 'a real, scattered physical location in RAM'."],
  link: { to: "#/memory", label: "Open the memory lab" } },

{ n: 17, part: 2, title: "Terminal: Multi-Command & Multi-Process", slides: "SNAI_1C_2 · slides 24–26",
  simple: "Instead of typing one instruction at a time, you can give the shell a to-do list. Depending on the punctuation, you can say 'do these no matter what', 'do this only if the last one worked', or 'start this and don't wait for it to finish'.",
  analogy: "Giving someone a to-do list instead of one instruction at a time.",
  concepts: [
    "`;` — run the next command **no matter what** happened with the one before it.",
    "`&&` — run the next command **only if the previous one succeeded**.",
    "`||` — run the next command **only if the previous one failed**.",
    "`|` (pipe) — take the **output of one command** and feed it in as the **input to the next**.",
    "`&` at the end — run in the **background**: 'start this, but don't make me wait — give me my terminal back right away.'",
    "Launching multiple Python processes at once (the CPU spike demo, Module 15): running several scripts with `&` after each one starts them all as separate processes, each with its own PID, and the OS can schedule them across different CPU cores at the same time (real multiprocessing, not just fast switching).",
    "Redirection (collapsed on your college page; the symbols are in the Module 21 cheat sheet): `>` replaces, `>>` appends, `<` feeds input."
  ],
  terms: [[";", "Then — always runs the next command.", 1], ["&&", "AND THEN, only if the previous one worked.", 1], ["||", "OR ELSE, only if the previous one failed.", 1], ["| (pipe)", "Output of the left command becomes the input of the right.", 1], ["&", "Run in the background; get the terminal back immediately.", 1]],
  examples: [
    { t: "Chaining (lecture)", b: "", code: "mkdir notes; cd notes      # runs cd notes regardless of whether mkdir succeeded\nmkdir notes && cd notes    # only enters the folder if it was created successfully\nls | grep py               # lists files, then keeps only names containing 'py'" },
    { t: "Background (lecture)", b: "", code: "python3 script1.py &\npython3 script2.py &\npython3 script3.py &\n# all three now run as separate processes, at the same time, each with its own PID\nps aux → would now show all three as separate rows" },
    { t: "Try it (from the PPT)", b: "", code: "mkdir t && cd t\necho hi > a.txt\ncat a.txt" }
  ],
  cmds: [["cmd1 ; cmd2", "Run cmd2 regardless."], ["cmd1 && cmd2", "Run cmd2 only if cmd1 succeeded."], ["cmd1 || cmd2", "Run cmd2 only if cmd1 failed."], ["cmd1 | cmd2", "Feed cmd1's output into cmd2."], ["cmd &", "Run cmd in the background."]],
  exam: ["Explain ; && || | & — one line each.", "`mkdir data && cd data`: if mkdir fails, `cd data` does NOT run (with `;` it WOULD run).", "`&` runs the command in the background so the shell doesn't wait for it to finish.", "Several scripts each followed by `&` = separate processes with their own PIDs = real multiprocessing."],
  traps: ["Thinking && ignores failure — it only continues if the previous command succeeded.", "Thinking `&` deletes the command or runs it twice as fast — it just backgrounds it.", "Mixing `&&` (and) with `||` (or else)."],
  tricks: ["; = 'then', always. && = 'AND THEN, only if it worked.' || = 'OR ELSE, only if it failed.' | = output of left becomes input of right."],

  link: { to: "#/terminal", label: "Open the terminal command reference" } }

{ n: 19, part: 3, title: "CLI, GUI & API — The Three Interfaces", slides: "SNAI_1C_3 · slides 5–7",
  simple: "An interface is the boundary where two things meet — a steering wheel between you and a car, a TV remote between you and a TV. Neither shows you the engine or circuitry, and that's the whole point. There are three interfaces: CLI (text), GUI (visual) and API (program talks to program).",

  concepts: [

    "**CLI** — text-based. You type commands into a shell (on macOS, that shell is **zsh**) and read text responses. Powerful, but you must know the exact commands.",
    "**GUI** — visual: windows, icons, buttons, menus. Born at **Xerox PARC in the 1970s**, made mainstream by the **1984 Macintosh** — which is also where the desktop metaphor came from: files look like paper, folders look like folders, deleting = dragging to a trash can.",
    "**API** — how two programs talk to each other, with no human, no buttons, no screen involved at all.",
    "**API = restaurant menu:** you (the customer/program) place a request through the menu, and the kitchen (the other program) returns a result — without you ever seeing how the kitchen actually works. One program sends a **request**, another sends back a **response**. That's it.",
    "The menu = the interface, the shared boundary between the customer and the kitchen. The request is the order; the cooking is hidden."

{ n: 21, part: 3, title: "Full CLI Reference", slides: "SNAI_1C_3 · slides 11–14",
  simple: "Every CLI exam question is really just asking 'which verb is this?' Find the action word in the question, match it to the command, and you're most of the way to the answer. This module also covers chmod permissions, find vs grep, wc/head/tail/sort and the four redirection symbols.",
  analogy: "Spot the action word (show, list, delete...) then match it to the command.",
  concepts: [
    "**Question says → command:** show current directory → `pwd` · list files → `ls` · enter directory / go up → `cd` / `cd ..` · create directory / empty file → `mkdir` / `touch` · display contents → `cat` · write (replace) / add (append) → `>` or `cat >` / `>>` or `cat >>` · copy / move / rename → `cp` / `mv` / `mv` · delete → `rm` · change permissions → `chmod` · search for a file / inside text → `find` / `grep` · count lines → `wc -l` · first / last lines → `head` / `tail` · sort → `sort`.",
    "**chmod:** each permission has a number: **read = 4, write = 2, execute = 1**. Add the ones you want: 4+2+1 = 7 means read+write+execute. A chmod command has three digits — `chmod 700 file` — one each for **owner, group, others** (in that order). 700 means the owner gets full access (7 = rwx), and everyone else gets nothing (0 = ---).",

  ["Waiting time vs burst time", "Burst = CPU time the process needs. Waiting = time sitting in the queue. Turnaround = Waiting + Burst.", 10],
  ["Starvation vs convoy effect", "Starvation = a long job (SJF) or low-priority task (Priority) may wait forever. Convoy effect = one long job at the front of FCFS makes all the short ones wait.", 10],
  ["Aging vs time quantum", "Aging = slowly raising priority while waiting (fixes starvation in Priority). Time quantum = fixed turn length in Round Robin.", 12],
  ["Embedded vs personal computer", "Embedded = small computer INSIDE a device, one job forever. Personal = one person's everyday use.", 18],

"use strict";
const FLASH = [];
(function () {

  F(1, "c", "What is the whole job of a computer in one line?", "Take input → follow steps → give output (and sometimes store).");

  F(2, "c", "CPU vs GPU?", "CPU: a few very powerful cores — general tasks and decision-making. GPU: a specialized processor with thousands of smaller cores — gaming, video editing, AI.");
  F(2, "c", "What is the motherboard?", "The main circuit board connecting all the parts — the physical 'table' the parts sit on and talk through.");
  F(2, "c", "RAM vs storage in one line?", "RAM = fast + forgets. Storage = slower + remembers.");
  F(3, "c", "What is software?", "A set of instructions or programs that tell the computer what to do and how to perform tasks.");
  F(3, "c", "What is system software? Give the five examples.", "Controls and manages hardware and system resources while providing a platform for applications. Operating Systems, Device Drivers, Programming Languages, Package Managers, System Utilities.");
  F(3, "c", "What is application software? Give the four examples.", "Lets users perform useful tasks; relies on system software to access hardware. Media Players, Browsers, Databases, Games.");
  F(3, "c", "Exam trap: are programming languages system or application software?", "System software (so are package managers).");
  F(3, "c", "Draw the software stack from the lecture.", "Applications (Chrome, Games, Word) ↓ Operating System (Windows, Linux) ↓ Hardware (CPU, RAM, Disk).");
  F(3, "c", "Why does system software exist as a middle layer?", "So every app doesn't have to handle raw hardware itself — one shared, standard doorway.");
  F(4, "c", "Define an Operating System (lecture).", "A software that acts as a bridge between the user and the computer hardware. It manages all the software and hardware on a computer or digital device.");
  F(4, "c", "What are the four core OS jobs (P-D-F-U)?", "Manage Process & Memory · Manage Devices · Manage Files & Storage · Provide User Interface.");
  F(4, "c", "How does a laptop 'run many apps at once' with one CPU core?", "The OS rapidly switches the CPU between apps, giving each a tiny time slice (thousands of times a second).");
  F(5, "c", "Kernel space vs user space?", "Kernel space: core of the OS, full unrestricted access to hardware. User space: where normal apps run, with restricted access.");
  F(5, "c", "What is a system call?", "A formal request an app makes to the kernel for something only the kernel can do (read a file, use the network, talk to the printer).");
  F(5, "c", "What is a driver?", "A small translator program between the kernel and a physical device (keyboard, disk, printer, GPU).");
  F(5, "c", "Flow to memorise for an app reading a file?", "app → system call → kernel → driver → physical disk.");
  F(5, "c", "Why can't an ordinary app talk directly to hardware?", "The kernel/user privilege split is enforced by the CPU itself, for safety — real hardware protection, not a policy.");
  F(6, "c", "What is a process?", "A program actively running — loaded into RAM with the CPU executing its instructions (running program in memory with CPU time).");
  F(6, "c", "What is a program?", "A dormant file sitting on disk, doing nothing.");
  F(6, "c", "Two Chrome windows — how many processes?", "Two separate Chrome processes, each with its own memory and resources.");
  F(6, "c", "Parent vs child process?", "Parent = the boss (main Chrome, or the shell). Child = its helper (each tab, or each command like pwd, ls). A crashed child doesn't crash the others.");
  F(6, "c", "What are the OS's four jobs for processes?", "Create them, give each one private memory, schedule CPU time, clean up after they finish.");
  F(7, "c", "GUI vs CLI?", "GUI: windows, icons, buttons, mouse. CLI: type exact text commands in the Terminal; no icons, no clicking. Harder to learn but more precise and powerful.");
  F(7, "c", "A GUI delete button vs a CLI delete command — what's underneath?", "Both eventually trigger the same underlying system call to the kernel.");
  F(8, "c", "Terminal vs Shell?", "Terminal = the display window. Shell (Bash, Zsh, PowerShell) = the program inside that reads, interprets and runs your commands.");
  F(8, "c", "What happens when you run `python script.py`?", "The shell asks the kernel to (1) create a new process, (2) load the 'python' program into it, (3) pass 'script.py' as an argument.");
  F(9, "c", "Command, argument, flag — explain with `ls -la ./notes`.", "ls = command (verb). -la = flags (l = long list, a = show hidden files). ./notes = argument (the folder to act on).");
  F(9, "c", "What is a package manager? Name three commands.", "Installs/removes software from the terminal. apt install (Linux), pip install (Python), npm install (JavaScript).");
  F(9, "k", "What does `pip install numpy` do?", "Fetches numpy AND everything numpy needs, so you don't download each piece by hand.");
  F(9, "k", "What is the flag in `ls -l`?", "-l: lists files in a detailed list view instead of a plain row. Flags start with - or --.");
  F(9, "k", "What does `mv` do?", "Move OR rename — mv does BOTH.");
  // ---- Part 2 ----
  F(10, "c", "What is scheduling?", "Deciding which process gets the CPU next.");
  F(10, "c", "Define arrival, burst, waiting and turnaround time.", "Arrival: when the process shows up and is ready. Burst: CPU time needed to finish. Waiting: time sitting in the queue. Turnaround: arrival to finish = Waiting + Burst.");
  F(10, "c", "What is FCFS?", "First Come First Served — whoever arrives first runs first, start to finish, no interruptions. Non-preemptive.");
  F(10, "c", "FCFS waiting time rule?", "Waiting time = the sum of every burst time that runs before it.");
  F(10, "c", "FCFS example P1=10, P2=8, P3=3 — waiting and turnaround?", "Waiting 0, 10, 18. Turnaround 10, 18, 21. Gantt: P1 (0–10), P2 (10–18), P3 (18–21).");
  F(10, "c", "P1 = 6, P2 = 4, P3 = 2 under FCFS: P3's waiting time?", "10 ms (6 + 4). P3's own 2 ms is burst, not waiting.");
  F(10, "c", "What is the convoy effect?", "One long job at the front makes all the short ones wait (FCFS).");
  F(10, "c", "Why is FCFS called non-preemptive?", "Once a process starts, nobody can interrupt it until it finishes.");
  F(11, "c", "What is SJF?", "Shortest Job First — whoever needs the least time goes first; arrival order is ignored.");
  F(11, "c", "SJF on P1=10, P2=8, P3=3: order and waiting times?", "P3 (0–3), P2 (3–11), P1 (11–21). Waiting: P3 = 0, P2 = 3, P1 = 11. Total waiting 14 (vs 28 in FCFS).");
  F(11, "c", "What is special about SJF's average waiting time?", "SJF is mathematically proven to give the lowest possible average waiting time of any scheduling rule.");
  F(11, "c", "What is starvation?", "A long job can wait forever if short jobs keep arriving (SJF); a low-priority task may wait forever (Priority).");
  F(12, "c", "What is Priority scheduling?", "Each process has a priority number; the highest priority runs first — arrival time and burst time don't matter.");
  F(12, "c", "What is aging?", "Slowly raising a task's priority the longer it waits — fixes starvation in priority scheduling.");
  F(12, "c", "Give the lecture example of why Priority scheduling is useful.", "A security alert should jump ahead of a random background download, even if the download arrived first and needs less time.");
  F(13, "c", "What is Round Robin?", "Everyone gets a small, fixed turn (a time quantum). If not done, they go to the back of the line and wait for their next turn.");
  F(13, "c", "Round Robin, quantum 4, P1=10, P2=8, P3=3 — the sequence?", "P1 | P2 | P3 | P1 | P2 | P1 at 0–4, 4–8, 8–11, 11–15, 15–19, 19–21.");
  F(13, "c", "Round Robin's trade-off?", "Best at fairness and feeling responsive; weak point: more switching = more overhead.");
  F(13, "c", "Compare the four algorithms: best at / weak point.", "FCFS: simplicity / convoy effect. SJF: lowest average wait / starvation. Priority: important tasks jump ahead / starvation (fixed by aging). Round Robin: fairness, responsive / more switching = more overhead.");
  F(14, "c", "What is a PCB?", "Process Control Block — a small record the OS keeps in RAM for every process it creates (the sticky note / ID card).");
  F(14, "c", "What four things are on a PCB?", "PID · where it stopped (exact instruction reached) · values the CPU was holding for it · its state (running, waiting for its turn, or ready).");
  F(14, "c", "What is a context switch?", "SAVE the current process's progress to its PCB, then LOAD the next process's PCB into the CPU. Pure admin, no real work.");
  F(14, "c", "Why does frequent context switching slow a system down?", "Each switch costs real CPU time saving/loading state — more time on admin, less on real work.");
  F(14, "c", "What does the OS write into a PCB right before pausing a process?", "Its current progress — exactly where it stopped, so it can resume from there. Not the whole program.");
  F(15, "c", "What is multiprocessing?", "Using more than one CPU core: a program creates multiple separate processes and the OS spreads them across cores so they run truly in parallel.");
  F(15, "k", "What does `ps aux` show?", "Every running process: owner (USER), PID, CPU usage, and the command that started it.");
  F(15, "c", "Terminal/shell and the new process it creates — relationship?", "The shell is the parent; the new process is its child. Closing a terminal can also close everything it started.");
  F(15, "k", "What does `kill -9 <PID>` do?", "Sends a 'stop immediately, no cleanup' signal to that PID. Emergency stop for a frozen process.");
  F(15, "c", "What happens to RAM the instant a process ends?", "The OS takes back all its RAM and its PCB slot and returns them to the free pool.");
  F(15, "k", "ps aux vs top/htop?", "ps aux = a plain snapshot list. top/htop = live, constantly updating, sorted by resource usage (biggest CPU users float to the top).");
  F(16, "c", "What are the four jobs of memory management?", "Hand out RAM fairly · track who has what · take it back when a process ends · stop one process touching another's memory.");
  F(16, "c", "What is paging?", "Splitting RAM into small, fixed-size blocks called pages (a common size is 4KB); a process's pages need not be next to each other.");
  F(16, "c", "Why fixed-size pages instead of custom chunks?", "Custom-sized chunks leave awkward unusable gaps (fragmentation). Fixed pages fit like uniform bricks, no odd gaps.");
  F(16, "c", "What is fragmentation?", "Awkward little gaps of unusable space left between custom-sized chunks over time.");
  F(16, "c", "What is virtual memory?", "The convenient lie: every process is told it has the whole memory to itself, starting from address 0. The OS + MMU secretly map fake addresses to real, scattered, protected RAM.");
  F(16, "c", "What is the MMU?", "Memory Management Unit — hardware that translates each process's fake address into a real physical location in RAM.");
  F(16, "c", "How can two processes both use 'address 1000'?", "Each is told a different 'lie'; both point to two completely separate real physical locations.");
  F(16, "c", "What is swapping and why is it slow?", "When RAM truly runs out, pages move to disk. Disk is far slower than RAM, so the computer feels laggy.");
  F(17, "k", "What does `;` do?", "Runs the next command no matter what happened with the one before it.");
  F(17, "k", "What does `&&` do?", "Runs the next command only if the previous one succeeded.");
  F(17, "k", "What does `||` do?", "Runs the next command only if the previous one failed.");
  F(17, "k", "What does `|` (pipe) do?", "Takes the output of one command and feeds it as the input to the next.");
  F(17, "k", "What does `&` at the end of a command do?", "Runs it in the background — start it, but give the terminal back right away.");
  F(17, "k", "What does `mkdir notes && cd notes` do?", "Creates the folder and ONLY if that succeeded, enters it.");
  F(17, "k", "If `mkdir data && cd data` and mkdir fails, does cd run?", "No — && only continues if the previous command succeeded. (With ; it would run.)");
  F(17, "k", "What does `ls | grep py` do?", "Lists files, then filters that output to only show names containing 'py'.");
  F(17, "c", "Three scripts each launched with `&` — what happens?", "Three separate processes, each with its own PID, that the OS can schedule across different cores (real multiprocessing).");
  // ---- Part 3 ----
  F(18, "c", "Name the five types of computers in order.", "Embedded, Personal, Server (data centers), Supercomputer, Quantum.");
  F(18, "c", "What is an embedded system? Examples?", "A small computer built into a device to control just that one thing, one job forever: washing machines, traffic lights, ATMs, a smart thermostat.");
  F(18, "c", "What is a server / data center?", "Computers that store and provide data/services to many other computers over a network at the same time (cloud services, AI training).");
  F(18, "c", "What is a quantum computer?", "A newer category that uses quantum physics to solve certain problems classical computers (even supercomputers) can't handle efficiently.");
  F(18, "c", "Smart thermostat — which type of computer?", "Embedded system.");
  F(19, "c", "What is an interface?", "The boundary where two things meet (steering wheel, TV remote); it hides the engine.");
  F(19, "c", "CLI vs GUI vs API?", "CLI: text commands (macOS shell = zsh). GUI: visual — windows, icons, buttons (Xerox PARC 1970s, mainstream with the 1984 Macintosh). API: how two programs talk to each other, no human or screen.");
  F(19, "c", "Restaurant-menu analogy for an API?", "You (program 1) order through the menu (the interface), the kitchen (program 2) returns a result (response). You never see the kitchen.");
  F(19, "c", "In the API restaurant analogy, what is the menu?", "The interface — the shared boundary between the customer and the kitchen.");
  F(19, "k", "What did `curl http://api.open-notify.org/iss-now.json` return?", "The International Space Station's position (longitude, latitude) and 'message: success'.");
  F(20, "c", "Windows vs macOS vs Linux — ease of use?", "Windows: user-friendly, low–moderate learning curve. macOS: very low learning curve. Linux: moderate–high, needs technical knowledge.");
  F(20, "c", "Windows vs macOS vs Linux — customization?", "Windows: limited but accessible. macOS: minimal, Apple-controlled. Linux: highly customizable.");
  F(20, "c", "Windows vs macOS vs Linux — hardware/software support?", "Windows: very wide. macOS: Apple ecosystem only. Linux: extensive but needs tuning.");
  F(20, "c", "Windows vs macOS vs Linux — typical users?", "Windows: everyday + business. macOS: professionals, creatives. Linux: developers, tech enthusiasts.");
  F(20, "c", "Why does Linux dominate servers more than desktops?", "Its deep customizability matters much more on servers nobody directly looks at than on everyday desktops.");
  F(20, "c", "Trick to remember the three OSes?", "Windows = wide, macOS = easy + locked, Linux = custom + technical.");
  F(21, "k", "What does `chmod 640 file.txt` mean?", "Owner 6 = rw- (read+write), group 4 = r-- (read only), others 0 = --- (no access).");
  F(21, "k", "What does `chmod 700 keyvault` mean?", "Owner 7 = rwx (full access); group 0 = ---; others 0 = ---. Everyone else gets nothing.");
  F(21, "k", "chmod numbers: read, write, execute?", "read = 4, write = 2, execute = 1. Add them (4+2+1 = 7 = rwx). Three digits: owner, group, others.");
  F(21, "k", "Difference between find and grep?", "find looks for FILES by name; grep looks for TEXT inside files.");
  F(21, "k", "What does `find . -name '*.txt'` do?", "Searches from the current directory (.) and finds every .txt file (wildcard).");
  F(21, "k", "What does `grep -i 'hello' file.txt` do?", "Finds lines containing 'hello' in file.txt, ignoring upper/lowercase.");
  F(21, "k", "wc -l, -w, -c?", "Count lines, words, characters (l, w, c in that order).");
  F(21, "k", "head vs tail?", "head = first lines of a file; tail = last lines (useful for checking the end of a log file).");
  F(21, "k", "sort and sort -r?", "sort = alphabetical; sort -r = reversed order.");
  F(21, "k", "The four redirection symbols?", "> replace · >> append · < feed a file in as input · | pipe (output of one → input of the next).");
  F(21, "k", "Which command: 'show current directory'?", "pwd.");
  F(21, "k", "Which command: 'create directory / empty file'?", "mkdir / touch.");
  F(21, "k", "Which command: 'copy / move / rename / delete'?", "cp / mv / mv / rm.");
  F(21, "k", "Which command: 'display contents'?", "cat.");
  F(21, "k", "Which command: 'change permissions'?", "chmod.");
  F(22, "k", "ps vs ps aux?", "ps = only processes tied to your current terminal session (a small slice). ps aux = every process on the system (USER, PID, %CPU, %MEM, COMMAND).");
  F(22, "k", "kill vs kill -9?", "kill <PID> = SIGTERM (15), polite: 'please stop, and clean up first'. kill -9 <PID> = SIGKILL (9), force, immediate, no cleanup.");
  F(22, "k", "A process ignores `kill 4821`. Next step?", "kill -9 4821 — escalate to SIGKILL since the polite SIGTERM request was ignored.");
  F(22, "c", "Why does Activity Monitor show far more processes than plain ps?", "Plain ps shows only your current terminal session; ps aux-style lists every process on the system.");

  L(1, "e", "Why do computers use binary (1s and 0s) instead of, say, 10 different digit levels?", ["Because two electrical states (on/off) are far more reliable to detect than many voltage levels", "Because ten levels would use too much RAM", "Because binary numbers are shorter to write for humans"], "Two states (on/off) are far more reliable to detect than many voltage levels. (Your slide showed only the correct option; the wrong options here are added for practice.)");

  L(2, "e", "RAM loses all its data when the power goes off. Why?", ["It stores data as an electrical charge that needs constant power to hold", "It's a software setting the OS controls", "It's designed to be wiped for security"], "RAM holds data as electrical charge. Power off = charge gone = data gone. That is what volatile means.");
  T(2, "e", "An SSD has moving parts such as spinning platters.", false, "False. The HDD has spinning platters and read/write heads. The SSD uses flash memory with no moving parts.");
  B(2, "e", "The CPU is usually placed in a special slot called a ______ on the motherboard.", ["socket"], "The CPU sits in a socket on the motherboard.");
  M(2, "e", "Which of these is volatile?", ["RAM", "SSD", "HDD"], "RAM is volatile — its contents are cleared when the power is turned off.");
  M(2, "m", "Which statement about CPU and GPU matches the lecture?", ["The CPU has a few very powerful cores; the GPU has thousands of smaller cores", "The CPU has thousands of small cores; the GPU has a few powerful cores", "Both have exactly the same number of cores"], "CPU = few powerful cores (general tasks and decisions). GPU = thousands of smaller cores (gaming, video editing, AI).");

  L(3, "m", "Why does system software exist as a 'middle layer' between apps and hardware?", ["So every app doesn't have to handle raw hardware itself — one shared, standard doorway", "Because hardware companies require it by law", "To make computers look more professional"], "Without it, every game and browser would need its own code for every keyboard, screen and disk.");
  T(3, "m", "Programming languages and package managers are application software.", false, "False. Your lecture lists them under SYSTEM software (exam trap).");
