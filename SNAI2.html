<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SNAI Study Dashboard</title>
<meta name="description" content="Interactive study dashboard for the SNAI course: all 28 modules, CPU scheduling calculator, chmod calculator, terminal reference, flashcards, quiz, exam mode, and a Command Match game.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F3F5FA;--surface:#FFFFFF;--surface2:#EAEEF7;--ink:#152036;--muted:#56637B;--line:#D9DFEC;
  --acc:#2453D6;--acc-ink:#FFFFFF;--acc-soft:#E3EAFD;
  --p1:#0B8A7E;--p1s:#DDF3F0;--p2:#5745D6;--p2s:#E7E4FB;--p3:#BF5F12;--p3s:#FBE9D9;--p4:#C23A7A;--p4s:#FBE3EE;--p5:#1B7FB5;--p5s:#DDEEF8;
  --ok:#13835A;--oks:#DDF3E9;--bad:#C23A3A;--bads:#FBE3E3;--warn:#8A5A00;--warns:#FFF1CC;
  --code-bg:#0C1322;--code-ink:#D8E3F7;--code-dim:#7F8EAB;--code-prompt:#5EE6A8;
  --pop:0 10px 30px rgba(15,25,50,.18);
  --fh:"Bricolage Grotesque","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --fb:"Figtree","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --fm:"JetBrains Mono","SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1424;--surface:#151D31;--surface2:#1D2740;--ink:#E6EBF6;--muted:#9BA8C1;--line:#2A3654;
    --acc:#7EA4FF;--acc-ink:#0E1424;--acc-soft:#1E2C52;
    --p1:#46D3C1;--p1s:#12332F;--p2:#9A8EFF;--p2s:#262250;--p3:#F3A25E;--p3s:#3B2716;--p4:#F178B6;--p4s:#3B1A2C;--p5:#5DC0F0;--p5s:#123043;
    --ok:#4CD39A;--oks:#123528;--bad:#FF8080;--bads:#3C1A1A;--warn:#F3C15B;--warns:#3A2E0F;
    --code-bg:#080D18;--pop:0 10px 30px rgba(0,0,0,.5);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1424;--surface:#151D31;--surface2:#1D2740;--ink:#E6EBF6;--muted:#9BA8C1;--line:#2A3654;
  --acc:#7EA4FF;--acc-ink:#0E1424;--acc-soft:#1E2C52;
  --p1:#46D3C1;--p1s:#12332F;--p2:#9A8EFF;--p2s:#262250;--p3:#F3A25E;--p3s:#3B2716;--p4:#F178B6;--p4s:#3B1A2C;--p5:#5DC0F0;--p5s:#123043;
  --ok:#4CD39A;--oks:#123528;--bad:#FF8080;--bads:#3C1A1A;--warn:#F3C15B;--warns:#3A2E0F;
  --code-bg:#080D18;--pop:0 10px 30px rgba(0,0,0,.5);color-scheme:dark;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.6;min-height:100%}
h1,h2,h3,h4{font-family:var(--fh);line-height:1.2;margin:0 0 .5em;letter-spacing:-.01em}
h1{font-size:clamp(1.9rem,4vw,2.7rem);font-weight:800}
h2{font-size:1.45rem;font-weight:700}
h3{font-size:1.12rem;font-weight:700}
h4{font-size:1rem;font-weight:700}
p{margin:0 0 .8em}
a{color:var(--acc)}
code{font-family:var(--fm);font-size:.88em;background:var(--surface2);padding:.1em .38em;border-radius:5px;border:1px solid var(--line)}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:.5em .7em;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
mark{background:var(--warns);color:var(--ink);border-radius:3px;padding:0 2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* layout */
.app{display:grid;grid-template-columns:288px minmax(0,1fr);min-height:100dvh}
.sidebar{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;background:var(--surface);border-right:1px solid var(--line);padding:18px 14px 28px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);padding:4px 6px 14px}
.brand-mark{font-family:var(--fm);font-weight:700;background:var(--code-bg);color:var(--code-prompt);border-radius:9px;padding:6px 9px;font-size:.9rem}
.brand b{font-family:var(--fh);font-size:1.15rem}
.brand small{display:block;color:var(--muted);font-size:.78rem;line-height:1.2}
.nav a{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:9px;color:var(--ink);text-decoration:none;font-size:.94rem}
.nav a:hover{background:var(--surface2)}
.nav a.on{background:var(--acc-soft);font-weight:700}
.nav details{margin:2px 0}
.nav summary{cursor:pointer;list-style:none;padding:8px 10px;font-weight:700;font-family:var(--fh);border-radius:9px;display:flex;justify-content:space-between;align-items:center}
.nav summary::-webkit-details-marker{display:none}
.nav summary::after{content:"+";color:var(--muted);font-weight:500}
.nav details[open]>summary::after{content:"–"}
.nav summary:hover{background:var(--surface2)}
.nav .grp{margin:14px 10px 4px;color:var(--muted);font-size:.82rem;font-weight:600}
.mnum{flex:0 0 auto;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:.76rem;font-weight:700;font-family:var(--fm)}
.p1 .mnum,.mnum.p1{background:var(--p1s);color:var(--p1)}
.p2 .mnum,.mnum.p2{background:var(--p2s);color:var(--p2)}
.p3 .mnum,.mnum.p3{background:var(--p3s);color:var(--p3)}
.p4 .mnum,.mnum.p4{background:var(--p4s);color:var(--p4)}
.p5 .mnum,.mnum.p5{background:var(--p5s);color:var(--p5)}
.nav a.done .mnum{background:var(--ok);color:var(--surface)}
.nav a.done .mnum::before{content:"✓"}
.nav a.done .mnum span{display:none}
.mt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.main{min-width:0}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;gap:10px;align-items:center;padding:10px clamp(12px,3vw,32px);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.search{flex:1;position:relative;max-width:640px}
.search input{width:100%;padding:.62em .9em .62em 2.3em;border-radius:12px}
.search svg{position:absolute;left:.75em;top:50%;transform:translateY(-50%);color:var(--muted)}
.search kbd{position:absolute;right:.6em;top:50%;transform:translateY(-50%);font-family:var(--fm);font-size:.75rem;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 .4em;background:var(--surface2)}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:40px;height:40px;display:grid;place-items:center;flex:0 0 auto}
.icon-btn:hover{background:var(--surface2)}
#menuBtn{display:none}
.view{max-width:1120px;margin:0 auto;padding:clamp(16px,3vw,34px) clamp(12px,3vw,32px) 80px}
.overlay{display:none}
@media (max-width:920px){
  .app{grid-template-columns:minmax(0,1fr)}
  .sidebar{position:fixed;z-index:40;top:0;bottom:0;left:0;width:min(86vw,320px);height:auto;padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-102%);transition:transform .22s ease;box-shadow:var(--pop)}
  .sidebar.open{transform:none}
  .overlay.show{display:block;position:fixed;inset:0;z-index:30;background:rgba(5,10,25,.5)}
  #menuBtn{display:grid}
  .search kbd{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* generic components */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:16px}
.card.flat{background:var(--surface2);border-color:transparent}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.btn{display:inline-flex;align-items:center;gap:.4em;padding:.55em 1em;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;text-decoration:none;color:var(--ink);line-height:1.2}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:.35em .7em;font-size:.88rem;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.3em .85em;font-size:.9rem;text-decoration:none;color:var(--ink);cursor:pointer}
.chip:hover{background:var(--surface2)}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.badge{display:inline-block;border-radius:7px;padding:.05em .55em;font-size:.8rem;font-weight:700;background:var(--surface2);color:var(--muted)}
.badge.p1{background:var(--p1s);color:var(--p1)}.badge.p2{background:var(--p2s);color:var(--p2)}.badge.p3{background:var(--p3s);color:var(--p3)}.badge.p4{background:var(--p4s);color:var(--p4)}
.badge.p5{background:var(--p5s);color:var(--p5)}
.badge.ok{background:var(--oks);color:var(--ok)}.badge.bad{background:var(--bads);color:var(--bad)}.badge.warn{background:var(--warns);color:var(--warn)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:16px}
.tab{border:0;background:none;padding:.6em 1em;border-radius:10px 10px 0 0;font-weight:600;color:var(--muted);border-bottom:3px solid transparent}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--acc)}
.progress{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.progress>i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .4s}
.progress.p1>i{background:var(--p1)}.progress.p2>i{background:var(--p2)}.progress.p3>i{background:var(--p3)}.progress.p4>i{background:var(--p4)}
.progress.p5>i{background:var(--p5)}
.np{border:1.5px dashed var(--warn);background:var(--warns);color:var(--ink);border-radius:12px;padding:12px 14px;margin:10px 0}
.np b{color:var(--warn)}
.tag-extra{display:inline-block;font-size:.72rem;font-weight:700;background:var(--warns);color:var(--warn);border-radius:6px;padding:0 .45em;margin-left:.4em;vertical-align:middle}
.tag-calc{display:inline-block;font-size:.72rem;font-weight:700;background:var(--acc-soft);color:var(--acc);border-radius:6px;padding:0 .45em;margin-left:.4em;vertical-align:middle}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:14px}
table{border-collapse:collapse;width:100%;font-size:.94rem}
th,td{padding:.6em .8em;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--surface2);font-family:var(--fh);font-weight:700;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.table-wrap table td:first-child{font-weight:600}
ul.clean{margin:0;padding:0;list-style:none}
ul.clean li{position:relative;padding:.35em 0 .35em 1.7em;border-bottom:1px dashed var(--line)}
ul.clean li:last-child{border-bottom:0}
ul.clean li::before{content:"";position:absolute;left:.25em;top:.95em;width:.6em;height:.6em;border-radius:3px;background:var(--acc)}
ul.trap li::before{background:var(--bad);border-radius:50%}
ul.trick li::before{background:var(--p3);transform:rotate(45deg)}
ul.exam li::before{background:var(--ok)}
ul.rev li::before{background:var(--p2)}
.code{background:var(--code-bg);color:var(--code-ink);border-radius:10px;margin:8px 0;overflow:hidden;border:1px solid color-mix(in srgb,var(--code-bg) 70%,#fff 8%)}
.code-h{font-family:var(--fm);font-size:.75rem;color:var(--code-dim);padding:6px 12px;border-bottom:1px solid rgba(255,255,255,.08)}
.code pre{margin:0;padding:12px 14px;overflow-x:auto;font-family:var(--fm);font-size:.86rem;line-height:1.55}
.code code{background:none;border:0;padding:0;font-size:inherit}
.code .pr{color:var(--code-prompt)}.code .cm{color:var(--code-dim)}
.kv{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:6px 14px}
.kv dt{font-weight:700}.kv dd{margin:0}
@media (max-width:620px){.kv{grid-template-columns:1fr}.kv dd{margin-bottom:8px}}
details.sec{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:14px}
details.sec>summary{cursor:pointer;list-style:none;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary h3{margin:0}
details.sec>summary::after{content:"+";font-size:1.3rem;color:var(--muted);font-family:var(--fm)}
details.sec[open]>summary::after{content:"–"}
details.sec>.sec-b{padding:2px 18px 16px}
.page-h{margin-bottom:22px}
.page-h p{max-width:70ch;color:var(--muted);font-size:1.05rem}
.stat{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 16px}
.stat b{display:block;font-family:var(--fh);font-size:1.9rem;line-height:1.1}
.stat span{color:var(--muted);font-size:.9rem}

/* hero + module map */
.hero{background:var(--code-bg);color:var(--code-ink);border-radius:18px;padding:clamp(18px,3vw,30px);margin-bottom:18px;border:1px solid color-mix(in srgb,var(--code-bg) 70%,#fff 8%)}
.hero .ln{font-family:var(--fm);font-size:.95rem;color:var(--code-dim);min-height:1.5em}
.hero .ln .pr{color:var(--code-prompt)}.hero .ln .cmd{color:var(--code-ink)}
.hero .cur{display:inline-block;width:.6em;height:1.05em;background:var(--code-prompt);vertical-align:-.18em;animation:blink 1.1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.hero h1{color:#fff;margin:.35em 0 .3em}
.hero p{color:#B4C0D8;max-width:62ch}
.hero .chip{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.18);color:#E6EBF6}
.hero .chip:hover{background:rgba(255,255,255,.16)}
.map-part{margin-bottom:16px}
.map-part h3{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,196px),1fr));gap:10px}
.tile{position:relative;display:block;text-decoration:none;color:var(--ink);border-radius:12px;padding:11px 12px 11px 12px;border:1px solid var(--line);background:var(--surface);min-height:74px}
.tile:hover{border-color:var(--ink)}
.tile .mnum{margin-bottom:6px;width:auto;padding:0 8px;height:22px}
.tile.p1 .mnum{background:var(--p1s);color:var(--p1)}.tile.p2 .mnum{background:var(--p2s);color:var(--p2)}.tile.p3 .mnum{background:var(--p3s);color:var(--p3)}.tile.p4 .mnum{background:var(--p4s);color:var(--p4)}
.tile.p5 .mnum{background:var(--p5s);color:var(--p5)}
.tile b{display:block;font-family:var(--fh);font-size:.95rem;line-height:1.25}
.tile.done{background:var(--oks);border-color:var(--ok)}
.tile.done .mnum{background:var(--ok);color:var(--surface)}
.tile.done .mnum::after{content:" ✓"}

/* module page */
.mod-h{border-radius:16px;padding:20px 22px;margin-bottom:16px;border:1px solid var(--line)}
.mod-h.p1{background:var(--p1s)}.mod-h.p2{background:var(--p2s)}.mod-h.p3{background:var(--p3s)}.mod-h.p4{background:var(--p4s)}
.mod-h.p5{background:var(--p5s)}
.mod-h h1{margin:.2em 0 .3em}
.think{border-left:4px solid var(--acc);padding:6px 0 6px 14px;margin:12px 0;color:var(--muted)}
.think b{color:var(--ink)}
.ex-card{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;background:var(--bg)}
.ex-card h4{margin-bottom:.25em}
.term-key{font-size:.7rem;font-weight:700;background:var(--acc-soft);color:var(--acc);border-radius:6px;padding:0 .4em;margin-left:.4em;vertical-align:middle}
.mod-nav{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}

/* gantt */
.gantt-wrap{overflow-x:auto;padding:6px 2px 4px}
.gantt{position:relative;height:52px;margin-top:4px}
.gb{position:absolute;top:0;height:44px;border-radius:6px;color:#fff;display:grid;place-items:center;font-weight:700;font-family:var(--fm);font-size:.85rem;border:2px solid var(--surface);overflow:hidden}
.gb.idle{background:repeating-linear-gradient(45deg,var(--surface2),var(--surface2) 6px,var(--bg) 6px,var(--bg) 12px);color:var(--muted);border-color:var(--line)}
.gb.cs{background:repeating-linear-gradient(45deg,#7A8399,#7A8399 4px,#5B6479 4px,#5B6479 8px);font-size:.7rem}
.gticks{position:relative;height:22px;font-family:var(--fm);font-size:.78rem;color:var(--muted)}
.gticks span{position:absolute;transform:translateX(-50%)}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.sched-inputs input[type=number]{width:5.2em;text-align:right}
.sched-inputs input.pid{width:5em}
.field{display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--muted)}
.field input,.field select{color:var(--ink)}
.err{color:var(--bad);font-weight:600}
.steps{margin:0;padding-left:1.2em}
.steps li{margin:.25em 0}

/* chmod */
.perm-grid{display:grid;grid-template-columns:110px repeat(3,1fr) 110px;gap:8px;align-items:center}
.perm-grid .h{font-weight:700;font-family:var(--fh);text-align:center}
.perm-cell{border:1.5px solid var(--line);border-radius:12px;padding:12px 6px;text-align:center;cursor:pointer;background:var(--surface);user-select:none}
.perm-cell.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.perm-cell b{display:block;font-family:var(--fm);font-size:1.3rem}
.perm-cell small{opacity:.85}
.big-num{font-family:var(--fm);font-size:2.4rem;font-weight:700;letter-spacing:.1em}
@media (max-width:620px){.perm-grid{grid-template-columns:74px repeat(3,1fr)}.perm-grid .sum{grid-column:1/-1;text-align:left}.perm-grid .sum:not(.h){padding-bottom:8px}}

/* diagrams */
.stack{display:flex;flex-direction:column;align-items:stretch;gap:0;max-width:560px;margin:8px auto}
.layer{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 16px;text-align:center;cursor:pointer;position:relative}
.layer:hover{border-color:var(--ink)}
.layer.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.layer.lit{box-shadow:0 0 0 3px var(--acc)}
.layer b{font-family:var(--fh)}
.layer small{display:block;opacity:.85}
.arrow{height:26px;position:relative;text-align:center;color:var(--muted);font-family:var(--fm)}
.arrow::before{content:"";position:absolute;left:50%;top:0;bottom:8px;width:2px;background:var(--line);transform:translateX(-50%)}
.arrow::after{content:"▼";position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);font-size:.7rem;color:var(--muted)}
.zone{border:2px dashed var(--line);border-radius:16px;padding:8px;position:relative;margin:4px 0}
.zone>.zl{position:absolute;top:-12px;left:14px;background:var(--bg);padding:0 8px;font-weight:700;font-size:.85rem;color:var(--muted);font-family:var(--fh)}
.flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}

/* ---------- persistent state (browser storage may be empty or blocked) ---------- */
const STORE_KEY = "snai-study-v1";
function defaultState() { return { done: {}, fc: {}, quiz: {}, exams: [], theme: "", xp: 0, badges: {}, streakBest: 0, sound: true, gameBest: null, daily: { date: "", goal: 1, modules: {} } }; }function loadState() {
  try { const r = localStorage.getItem(STORE_KEY); if (r) return Object.assign(defaultState(), JSON.parse(r)); } catch (e) { /* storage unavailable */ }
  return defaultState();
}
let S = loadState();
function saveState() { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) { /* ignore */ } }
function getDaily() {
  const today = new Date().toISOString().slice(0, 10);

  if (!S.daily || S.daily.date !== today) {
    S.daily = {
      date: today,
      goal: 1,
      modules: {}
    };
    saveState();
  }

  return S.daily;
}

function dailyProgress() {
  const d = getDaily();
  const completed = Object.keys(d.modules).length;
  const goal = Math.max(1, d.goal);
  return {
    completed,
    goal,
    pct: Math.min(100, Math.round((completed / goal) * 100))
  };
}
/* ---------- html builders ---------- */
function codeBlock(txt, label) {
  const lines = String(txt).split("\n").map(l => {
    const e = esc(l);
    if (/^guest@snai:~\$/.test(l)) return e.replace(/^(guest@snai:~\$)/, '<span class="pr">$1</span>');
    if (/^\s*#/.test(l)) return '<span class="cm">' + e + "</span>";
    return e;
  });
  return '<div class="code">' + (label ? '<div class="code-h">' + esc(label) + "</div>" : "") + "<pre><code>" + lines.join("\n") + "</code></pre></div>";
}
const ul = (arr, cls) => '<ul class="clean ' + (cls || "") + '">' + arr.map(x => "<li>" + md(x) + "</li>").join("") + "</ul>";
const np = (arr) => arr && arr.length ? '<div class="np"><b>' + NP_TEXT + ":</b><ul class=\"clean\">" + arr.map(x => "<li>" + md(x) + "</li>").join("") + "</ul></div>" : "";
const partBadge = n => '<span class="badge p' + partOf(n) + '">Module ' + n + "</span>";
function pct(a, b) { return b ? Math.round(100 * a / b) : 0; }
function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 1800);
}
function normText(s) { return String(s).toLowerCase().replace(/[‘’'"`]/g, "").replace(/\s+/g, " ").trim(); }
function bar(p, cls) { return '<div class="progress ' + (cls || "") + '" role="progressbar" aria-valuenow="' + p + '" aria-valuemin="0" aria-valuemax="100"><i style="width:' + p + '%"></i></div>'; }

/* ---------- action registry (click delegation) ---------- */
const ACTIONS = {};
function rerender() { if (typeof route === "function") route(true); }

{ n: 10, part: 2, title: "Scheduling: FCFS", slides: "SNAI_1C_2 · slides 2–5",

    "**The four numbers:** Arrival Time (when the process shows up and is ready to run) · Burst Time (how much CPU time it needs to finish — the 'execution time') · Waiting Time (time spent sitting in the queue, not running yet) · Turnaround Time (total time from arrival to finish = Waiting Time + Burst Time).",

    "**One rule underneath:** a process's waiting time = the sum of every burst time that runs before it. P1: nothing before → 0 ms. P2: waits for P1's 10 ms → 10 ms. P3: waits for P1 (10) and P2 (8) → 18 ms.",
    "Turnaround = Waiting + Burst: P1 0 + 10 = 10 ms · P2 10 + 8 = 18 ms · P3 18 + 3 = 21 ms.",

{ n: 11, part: 2, title: "Scheduling: Shortest Job First", slides: "SNAI_1C_2 · slides 6–7",

{ n: 12, part: 2, title: "Scheduling: Priority", slides: "SNAI_1C_2 · slides 8–9",

{ n: 14, part: 2, title: "PCB & Context Switching", slides: "SNAI_1C_2 · slides 13–15",
  simple: "The OS keeps a small record (the Process Control Block, PCB) in RAM for every process — like a sticky note saying exactly where that process stopped. Switching from one process to another means saving the old one's note and loading the new one's. That save-and-load is pure admin, so it costs real time.",
  analogy: "A teacher helping many students one at a time. Each time she leaves a student she jots down where that student stopped on a sticky note, so when she returns she doesn't ask 'where was I?'. The sticky note is the PCB. Writing and reading the note is the context switch — and it takes a few real seconds each time, on top of the actual helping.",
  concepts: [
    "The **Process Control Block (PCB)** is a small record the OS keeps in RAM for every process it creates.",
    "**It holds:** (1) **PID** (Process ID) — a number so the OS knows exactly which process this is. (2) **What it was doing** — the exact instruction it had reached, so it can resume from that exact spot, not from the start. (3) **What it needed** — the small values the CPU was actively holding for it at that moment. (4) **Its state** — whether it's currently running, waiting for its turn, or ready to go.",
    "The CPU runs one process at a time (Module 4), so the OS keeps swapping: pause P1, run P2, pause P2, run P3. Every swap is a **context switch** and forces two extra jobs: (1) **Save** — write P1's current progress onto its PCB. (2) **Load** — pick up P2's PCB and put its saved progress back into the CPU.",
    "Neither step is your actual program running — they're pure admin. That's why context switching has a real time cost: every switch 'steals' a small slice of time that could've gone to real work.",
    "The PCB is just the bookmark: where it stopped and what the CPU was holding. Not the whole program.",
    "Too many switches = slower: more time on admin, less on real work. (This is Round Robin's weak point.)"
  ],
  terms: [["PCB", "Process Control Block — the sticky note / ID card; a small record kept in RAM, one per process.", 1], ["PID", "Process ID — a number so the OS knows exactly which process this is.", 1], ["Context switch", "SAVE the current process's state to its PCB + LOAD the next process's state from its PCB.", 1], ["Process state", "Whether it's running, waiting for its turn, or ready to go.", 1]],
  examples: [
    { t: "Lecture code", b: "", code: "P1 running → OS pauses it → save P1's state to its PCB → load P2's state from its PCB → P2 running\n# the CPU did zero real 'work' during the save/load — pure overhead" },
    { t: "What's on the card", b: "PID · where it stopped (exact instruction reached) · values the CPU was holding · state (running / waiting for its turn / ready)." }
  ],
  cmds: [["P1 → save to PCB → load P2's PCB → P2", "Say 3 times."]],
  exam: ["Define PCB and list its four contents (PID, where it stopped, values the CPU held, state).", "Context switch = SAVE + LOAD.", "Why frequent context switching slows a system: each switch costs real CPU time on admin, not real work.", "What the OS writes into the PCB right before pausing a process: its current progress."],
  traps: ["Thinking the PCB stores a permanent copy of the entire program file — it holds just the bookmark.", "Thinking the PCB is only created when the process finishes — the OS keeps one for every process it creates.", "Thinking more switching is always faster — each switch is an admin tax."],
  tricks: ["PCB = sticky note / ID card. Context switch = writing and reading the sticky note.", "Four things on the PCB: PID, where it stopped, values held, state."],
  revise: ["PCB = record in RAM, one per process.", "Contents: PID, exact instruction reached, values CPU held, state.", "Context switch = Save + Load = overhead.", "Too many switches = more admin, less real work."],
  np: ["Which state changes happen between running, waiting and ready (a state diagram) is not described.", "How long a switch takes in real machines is not stated (the teacher analogy says 'a few real seconds')."],
  link: { to: "#/process", label: "Try the PCB / context-switch simulator" } },

{ n: 15, part: 2, title: "Real Terminal Toolkit", slides: "SNAI_1C_2 · slides 16–19",
  simple: "Everything in this module is a real, physical tool for something you already learned as theory. Nothing new to understand — just new places to see it happening: multiprocessing, ps aux, parent/child, kill -9, what happens to memory when a process ends, and top/htop.",
  analogy: "Theory you already know, now with real buttons to press.",
  concepts: [
    "**Multiprocessing** — using more than one CPU core. A single process (especially in Python) normally runs on just one CPU core, even if your computer has 8. To use several cores at once, a program creates multiple processes — separate, independent copies — and the OS spreads them across different cores so they genuinely run in parallel, not just switched quickly (Module 4).",
    "**ps aux** — lists every running process: who owns it, its PID, how much CPU it's using and the command that started it. This is the real tool for the PID that lives inside every process's PCB (Module 14). Example: `newtonuser 4821 92.5 python spike.py` (user, PID, %CPU).",
    "**Parent & child processes** — typing a command into your shell (Module 8) doesn't run it directly; the shell creates a new process for it. Shell = parent, new command = child. The OS keeps this family tree, e.g. so closing a terminal can also close everything it started.",
    "**kill -9** — sends a 'stop immediately, no cleanup' signal to a specific PID. The emergency-stop option for a process that's frozen and won't respond normally.",

    "**htop / top** — unlike ps aux (a plain list), these actively sort processes: the biggest CPU users float to the top, live and constantly updating. That is why the Python processes appeared near the top during the CPU spike demo."
  ],
  terms: [["Multiprocessing", "Using more than one CPU core by creating multiple separate processes that run truly in parallel.", 1], ["ps aux", "A list (snapshot) of every process: USER, PID, %CPU, COMMAND.", 1], ["kill -9", "Force-stop a process with no cleanup — last resort for a frozen process.", 1], ["top / htop", "Live, constantly updating view sorted by resource usage.", 1], ["Free pool", "Where the OS returns a finished process's RAM and PCB slot.", 0]],
  examples: [

  exam: ["Multiprocessing: multiple separate processes → different cores → truly parallel.", "ps aux = every process with USER, PID, %CPU, COMMAND. The PID is the same PID stored in the PCB.", "Shell = parent, command = child.", "After a process ends, the OS takes back its RAM and PCB slot.", "htop sorts by resource usage; ps aux is a plain list."],

  revise: ["Multiprocessing = several processes on several cores.", "ps aux = all processes (USER, PID, %CPU, COMMAND).", "kill -9 = force stop, last resort.", "Ended process → RAM + PCB slot back to the free pool.", "top/htop = live, sorted."],

{ n: 16, part: 2, title: "Memory Management", slides: "SNAI_1C_2 · slides 20–23",
  simple: "RAM is limited but many processes need it at once. The OS acts like a hostel warden: it hands out RAM fairly, tracks who has what, takes it back when a process ends and — most importantly — stops one process from touching another's memory. It does this with paging, virtual memory and, when RAM runs out, swapping.",

    "**Paging:** instead of giving each process one giant, continuous chunk of RAM (which wastes space when processes don't fit neatly), the OS splits all of RAM into small, fixed-size blocks called **pages** (a common size is **4KB**). A process's memory gets spread across however many pages it needs — not necessarily next to each other physically.",

    "**The filesystem** is the OS's organised structure for storage. Everything on your computer is stored somewhere under the **root location (/)**. Running `ls /` on macOS shows top-level folders like Applications, Library, Users, bin, opt, usr, cores, private, sbin, var, dev, System, tmp, home, Volumes.",
    "**Every place has a purpose (directory → purpose):** `/bin` → Programs · `/etc` → Configuration/Settings · `/dev` → Devices represented by files · `/tmp` → Temporary files · `/Users` → User data · `/Applications` → Graphical apps on macOS.",
    "This layout is **inspired by Unix**. Unix was built around one powerful idea: **'Everything is a file'** — one common way to interact with many system resources. Its ideas later influenced operating systems such as Linux and macOS.",
    "**'Everything is a file' in practice:** normal files (song.mp3, notes.txt, image.jpg) are obviously files. But Unix ALSO treats these as files: **Programs** (executable files/binaries, e.g. `/bin/ls` is the `ls` command's program file), **Configuration** (system settings, e.g. `/etc/hosts` contains network configuration), and **Devices** (hardware devices represented as files, e.g. `/dev/keyboard` — the keyboard is treated like a file).",
    "**Program on disk = file. Program in execution = process.** Running `ls /bin` lists dozens of command names (bash, cat, chmod, cp, cd, echo, kill, ln, ls, mkdir, mv, ps, pwd, rm, sh, zsh, and more) — these commands you run every day are themselves just files sitting in `/bin`.",
    "**What actually makes a file executable?** For a file to run, the OS checks TWO things: (1) Does the user have **permission** to run/execute it? (2) Does it contain **executable instructions**? A file like `hello.txt` created with `touch` and given text content via `echo \"...\" > hello.txt` will fail with `permission denied` when run as `./hello.txt` — because by default a new file is NOT executable.",
    "**chmod** (change mode) changes file or directory permissions. `chmod +x hello.txt` adds execute permission; afterwards `./hello.txt` actually runs.",
    "**The filename doesn't even matter.** Renaming the now-executable file with `mv hello.txt run_me.banana` and running `./run_me.banana` still works and prints the same output — because the OS runs files based on their **permission bit and content**, never their extension.",
    "**Not every file contains instructions.** `notes.txt` → stores text. `photo.jpg` → stores image data. `/bin/ls` → stores machine-runnable instructions. A file can store many kinds of data, but only some files contain instructions that can be executed.",
    "**Understanding file permissions:** each file has three types of permission — **Read (r)** (view/open contents), **Write (w)** (modify/edit), **Execute (x)** (run as a program). Permissions are assigned separately for **Owner, Group, and Others**.",
    "**Default permissions:** when a new file is created with `touch hello.txt`, the owner already has read and write permissions (`rw-`) — that's why it can be viewed/edited immediately. Execute permission is separate: by default a file is **not** executable (`-rw-r--r--`) to prevent accidental execution. Even if the file contains instructions, the OS will not run it unless the execute bit is set. This exists to ensure system security and prevent accidental or unsafe execution.",
    "**Permission flags, alphabetic and numeric:** for each of owner/group/others, `r=4, w=2, x=1` — add the ones that apply. Full `rwx` = 4+2+1 = **7**. Example: `drwxr-xr-x` (a directory, type `d`) breaks down as owner `rwx`(7), group `r-x`(5), others `r-x`(5) → numeric **755**.",
    "**`ls -l`** shows the long-form listing, including a permissions column like `-rw-r--r--` for each file.",
    "**Permission examples (from the lecture):** `chmod 755` → scripts, programs (owner full, others can read+execute). `chmod 644` → normal files (owner read+write, others read-only). `chmod 600` → private (owner only, nobody else can even read). `chmod 640` → e.g. `/etc/shadow`-style sensitive file (owner read+write, group read-only, others nothing).",
    "**File Permissions & Owners (worked example):** Owner: Shreyas, Owner's Group: Teachers. Owner can **R W**, Group can **R**, Others: **R**. Alphabetic form: `RW-R--R--`. Numeric form: **644**.",
    "**chown** transfers file ownership: `sudo chown elliot file.txt` makes `elliot` the new owner of `file.txt` (shown afterwards in `ls -l`'s owner column). Useful when another user needs to own or manage a file.",
    "**PATH — the shell's search list:** `PATH` is an **environment variable** containing a list of directories, e.g. `PATH=\"/usr/local/bin:/usr/bin:/bin\"`. Directories inside PATH are separated by a **colon (:)**. When you type a command like `ls`, the shell searches these directories **from left to right** until it finds the command. `echo $PATH` prints your current PATH, e.g. `/usr/bin:/bin:/usr/sbin:/sbin`.",
    "**If the command exists in one of these directories, it runs; otherwise, you get `command not found`.**",
    "**What happens if PATH is empty?** Setting `PATH=\"\"` and then typing `ls` or `cat` gives `command not found` for both — the shell has nowhere left to search. But `/bin/ls` (the full, exact path) still works, because its exact location was given directly and no searching was needed.",
    "**`which`** traces how the shell finds a command: `which ls` → `/bin/ls`. `which python3` → `/opt/homebrew/bin/python3`. `which cat` → `/bin/cat`. `which` relies on searching the directories in PATH."
  ],

{ n: 24, part: 4, title: "Number Representation & Data Encoding", slides: "Number_System_RU (Lecture 8) · 34 slides",
  simple: "Long before computers, living things needed to count: fish judge group size, lions count roars, frogs count calls. Humans moved from piling up stones (one-to-one correspondence) to tally marks, to Roman numerals, to the positional decimal system we use today — and computers use exactly the same idea, just with only two symbols: 0 and 1.",
  analogy: "A shepherd with no number words still needs to know if all his goats came back. His solution: one stone per goat (one-to-one correspondence). A pile of stones IS a count, even without a word for the number.",
  concepts: [
    "**Why humans needed numbers:** a shepherd counted his goats using **one-to-one correspondence** — one stone laid down per goat. A 40,000-year-old bone with tally marks is real evidence of this kind of early counting.",
    "**Unary number system (one symbol):** the most basic form of counting, where **each symbol represents one quantity**. To represent 3 cows, use 3 symbols: `III`. It becomes tedious for larger quantities — representing 20 needs 20 symbols.",
    "**Creating new symbols:** humans developed more complex symbols to represent larger quantities more efficiently. If a different symbol is used for 5 (grouping), 20 can be shown with just 4 symbols instead of 20. This grouping idea led to systems like **tally marks, Roman numerals, and Egyptian hieroglyphics**.",
    "**Roman number system:** **non-positional and additive.** Basic symbols: I=1, V=5, X=10, L=50, C=100, D=500, M=1000. These symbols can be combined and arranged to represent other numbers — e.g. IV = 4 (one before five), XI = 11 (one after ten).",
    "**Examples table (lecture):** 6 items = unary `IIIIII` = Roman `VI` = Decimal `6`. 12 items = unary `IIIIIIIIIIII` = Roman `XII` = Decimal `12`. 50 items = unary (50 marks) = Roman `L` = Decimal `50`.",
    "**Decimal number system (base-10):** uses **ten digits (0–9)** to represent all numbers. It is a **positional system** — the SAME digit means a different quantity depending on where it sits — and it introduced the concept of **zero**.",
    "**Positional number system, explained:** when the value of a digit depends on its position within the number, it is called a positional number system. For `3423`: 3×1000 + 4×100 + 2×10 + 3×1, i.e. 3×10³ + 4×10² + 2×10¹ + 3×10⁰. Each time you move one place left, the value is multiplied by **10 times** the previous place's value (because the base is 10).",
    "**Grouping & place value:** counting 0 through 9 is 'zero ones' through 'nine ones'; reaching 10 becomes 'one tens, zero ones'. For `3255`: 3 thousands, 2 hundreds, 5 tens, 5 ones.",
    "**Is quantity changing, or just representation?** The actual quantity never changes between unary, Roman, or decimal — only how it's WRITTEN DOWN changes. 'VI', 'IIIIII', and '6' all represent the exact same six things.",
    "**Limitations of Roman numerals:** being non-positional and additive makes them clumsy for arithmetic and for representing very large or complex numbers compared to a positional system.",
    "**Binary number system (two symbols):** as the most basic electronic devices can have 2 states — **on or off** — they can be represented very easily using binary numbers **0 and 1**. Hence binary numbers play a critical role in the design of digital electronic systems.",
    "**Counting in binary:** zero=0₁₀=0₂, one=1₁₀=1₂, two=2₁₀=10₂, three=3₁₀=11₂, four=4₁₀=100₂, five=5₁₀=101₂.",
    "**Binary → Decimal conversion:** multiply each binary digit by its positional power of 2 (from the right, starting at 2⁰) and add. Example: `1001₂` = 1×2³ + 0×2² + 0×2¹ + 1×2⁰ = 1×8 + 0×4 + 0×2 + 1×1 = 8+0+0+1 = **9₁₀**.",
    "**Decimal → Binary conversion:** Step 1 — divide the number repeatedly by 2 until the quotient is 0, noting each remainder. Step 2 — write the remainders in REVERSE order. Example: 13÷2=6 r1, 6÷2=3 r0, 3÷2=1 r1, 1÷2=0 r1 → reverse the remainders (1,1,0,1) → **13₁₀ = 1101₂**.",
    "**The general theorem:** every positive integer can be written uniquely as a sum of powers of any base b≥2, with coefficients from 0 to b−1. This is **not a convention** — this theorem is a property of numbers themselves, true for base 10, base 2, base 5, or any other base."
  ],
  terms: [
    ["One-to-one correspondence", "Matching each item counted to exactly one symbol or token, e.g. one stone per goat.", 1],

    ["Positional number system", "A system where a digit's value depends on its position (place value), e.g. decimal, binary.", 1],
    ["Decimal (base-10)", "Positional system using ten digits 0–9; introduced the concept of zero.", 1],
    ["Binary (base-2)", "Positional system using only two digits, 0 and 1, matching a device's on/off states.", 1],
    ["Base/radix", "The number of unique digits a positional system uses (10 for decimal, 2 for binary, 5 for a base-5 system).", 0]
  ],
  examples: [
    { t: "Unary vs Roman vs Decimal (lecture table)", b: "", table: { head: ["Items", "Unary", "Roman", "Decimal"], rows: [["6 apples", "IIIIII", "VI", "6"], ["12 bananas", "IIIIIIIIIIII", "XII", "12"], ["50 matchsticks", "(50 marks)", "L", "50"]] } },
    { t: "Positional breakdown of 3423 (lecture)", b: "", code: "3 4 2 3\n3*1000  4*100  2*10  3*1\n3*10^3  4*10^2 2*10^1 3*10^0\n= 3000 + 400 + 20 + 3 = 3423" },
    { t: "Binary to decimal: 1001₂ (lecture)", b: "", code: "1001(base 2)\n1*2^3 + 0*2^2 + 0*2^1 + 1*2^0\n= 8 + 0 + 0 + 1 = 9(base 10)" },
    { t: "Decimal to binary: 13 (lecture)", b: "Divide by 2 repeatedly, then reverse the remainders.", code: "13 / 2 = 6  remainder 1\n 6 / 2 = 3  remainder 0\n 3 / 2 = 1  remainder 1\n 1 / 2 = 0  remainder 1\nread remainders bottom-to-top: 1 1 0 1\n13(base 10) = 1101(base 2)" },
    { t: "Base-5 exercise (lecture)", b: "Allowed symbols: 0,1,2,3,4. First 15 numbers.", code: "0-0  1-1  2-2  3-3  4-4\n5-10  6-11  7-12  8-13  9-14\n10-20 11-21 12-22 13-23 14-24" }

  exam: [
    "Unary = one symbol per unit (tedious for large numbers). Roman = non-positional, additive (I,V,X,L,C,D,M). Decimal = positional, base-10, uses 0-9, has zero.",
    "Positional system: a digit's value depends on its POSITION (place value) — moving one place left in decimal multiplies the value by 10.",
    "Binary = base-2, positional, uses only 0 and 1 — matches a device's two electrical states (on/off).",
    "Binary→Decimal: multiply each bit by its power of 2 and sum. Decimal→Binary: repeatedly divide by 2, then reverse the remainders.",

  traps: [
    "Reading binary-to-decimal remainders in the order they were computed instead of REVERSED — decimal-to-binary conversion requires reversing the remainder order.",
    "Thinking Roman numerals are positional like decimal — they are NOT; they are additive (IV is a special subtraction-like exception, not a place-value rule).",
    "Thinking a bigger base means a 'better' or 'more real' quantity — the quantity represented is identical; only the symbols and grouping change.",
    "Forgetting that decimal place value multiplies by 10 per step left, while binary multiplies by 2 per step left — the same POSITIONAL idea, different base."
  ],
  tricks: ["Binary→Decimal: write the powers of 2 under each bit (8,4,2,1,...) and add up the ones with a 1 under them.", "Decimal→Binary: divide by 2, keep remainders, read bottom-to-top.", "Unary = one mark each. Roman = letters added together. Decimal/Binary = position decides the value."],
  revise: ["One-to-one correspondence → unary → grouped symbols (tally, Roman, hieroglyphics) → positional decimal (with zero) → positional binary.", "Positional system = digit value depends on position; decimal ×10 per place, binary ×2 per place.", "Binary↔Decimal conversion: Σ(bit×2^n) one way, repeated ÷2 + reverse remainders the other way.", "Any base b≥2 can uniquely represent every positive integer — a mathematical fact, not a convention."],
  np: ["Octal and hexadecimal are not covered in this lecture — only unary, Roman, decimal, and binary.", "Negative numbers and fractional (non-integer) representation in binary are not covered."],

{ n: 25, part: 4, title: "How Software Runs: Compiled vs Interpreted", slides: "SVYASA_Lec7_S_AI (Lecture 7) · 38 slides",
  simple: "The CPU only ever understands machine code — raw binary patterns like 'add these', 'move this there'. Every program you've ever run becomes binary eventually, with no exceptions. The real question is never whether that translation happens, but WHEN it happens and WHO does it: all at once before running (compiled), or line-by-line while running (interpreted).",
  analogy: "A compiler is like translating an entire book into another language once, then handing out the finished translation forever after. An interpreter is like a live interpreter translating a speech sentence by sentence, in real time, every single time the speech is given.",
  concepts: [
    "**What the CPU actually understands:** only **machine code**. Not Python, not JavaScript — specific binary patterns the chip recognises (add these, move this there, jump to that address). The question is never WHETHER translation happens — it always does — only WHEN, and WHO does it.",
    "**The idea of translation wasn't obvious.** Grace Hopper asked: 'What if you wrote something closer to English, and a program translated it into machine code for you?' — when she proposed this, the industry told her she was wrong.",
    "**Compilation:** translating an ENTIRE source code file into machine code BEFORE the program is executed. The compiled path: (1) you write source code, (2) a compiler translates the whole source file, (3) this produces an output (binary) file, (4) the CPU executes that binary directly.",
    "**Interpretation:** translating and executing source code into machine code ONE LINE (or statement) at a time, AS the program runs. The interpreted path: (1) source file, (2) the interpreter reads one line and translates it, (3) the CPU executes it immediately, (4) repeat for the next line, and so on.",
    "**Why interpreted languages exist — the historical trade-off:** in 1972, computer time was expensive and programmers were comparatively cheap, so languages were optimised for machine time — that's the origin of **C** (compiled). By 1989 that had flipped: hardware was getting cheaper every year, but programmers were not — that's the origin of **Python** (interpreted).",
    "**Where the time goes:** an interpreter translates while your program runs — every line, every run, every time. A compiler translates ONCE, and never again after that. Neither approach is wrong; they're different answers to one question: **what's expensive?**",
    "**Speed difference (lecture numbers):** a similar program took C about 0.001s and Python about 0.1s — a difference of 100,000,000 nanoseconds. Using Grace Hopper's 'nanosecond wire' (how far electricity travels in a billionth of a second, roughly 30cm, set by the speed of light, not an engineering problem but a hard physical constraint), that gap is about 100 million wires — roughly 30,000 km, about ¾ of the way around the Earth.",
    "**The Bootstrap Problem:** Python cannot interpret itself before it exists — something has to already be running on the machine that compiles straight to machine code with no interpreter in the loop, and C does that. The Python interpreter is literally called **CPython** — the 'C' is in the name. The bootstrap problem: to build a tool that runs a language, you need a language that already runs.",
    "**How do you even read a binary file?** The lecture notes that a compiled binary has parts that aren't human-readable, and shows two different tools for peeking at one: one that **displays the file without unrecognised symbols**, and one that **prints the first lines**. The exact command names shown weren't captured in the text extraction — but functionally these match tools like `strings` (filters a binary down to its readable text) and `head` (shows just the first lines of any file).",
    "**The software stack has C at the bottom** — not because C is perfect, but because it solved the right problem at the right time, and everything else was built on top of it.",
    "**Just-in-Time (JIT) compilation:** JavaScript's **V8 engine** (used in Chrome and Node.js) starts by interpreting JavaScript, but compiles frequently-run code to native binary ON THE FLY. This is why JavaScript is fast enough for complex web apps despite being interpreted — the compiler runs WHILE the program is already running.",
    "**Static vs Dynamic Linking:** static linking produces a larger, self-contained binary with nothing to break later. Dynamic linking produces a smaller binary that shares a library used by most programs on the machine — which is why deleting a shared library can break several programs at once.",
    "**CPython & PyPy:** CPython is the reference Python interpreter, written in C. PyPy is an alternative interpreter written in Python itself, using JIT compilation to outrun CPython in many cases. The existence of multiple implementations of the same language shows that the LANGUAGE and the INTERPRETER are separate things — Python is a specification, and CPython and PyPy are just two ways to run it."
  ],
  terms: [
    ["Machine code", "The binary patterns the CPU directly understands — the only thing it ever actually runs.", 1],
    ["Compilation", "Translating an entire source file into machine code before the program runs.", 1],
    ["Interpretation", "Translating and executing source code one line at a time, as the program runs.", 1],
    ["Bootstrap problem", "To build a tool that runs a language, you need a language that already runs (why Python's interpreter, CPython, is written in C).", 1],
    ["JIT (Just-in-Time) compilation", "Compiling frequently-run code to native binary while the program is already running (e.g. V8 for JavaScript).", 1],
    ["Static linking", "Bundling a library directly into the binary — larger, self-contained, nothing to break later.", 1],
    ["Dynamic linking", "Sharing one copy of a library across many programs — smaller binaries, but a missing/broken shared library can break several programs at once.", 1],
    ["CPython", "The reference Python interpreter, itself written in C.", 1],
    ["PyPy", "An alternative Python interpreter, written in Python, using JIT compilation.", 0]

    { t: "The compiled path (lecture, 4 steps)", b: "", code: "1. Source File\n2. Compiler translates the source file\n3. → Output File (binary)\n4. CPU executes it directly" },

{ n: 26, part: 4, title: "Version Control with Git", slides: "S_AI_Git-2026 (Lecture 9) · 79 slides",
  simple: "Just saving a file over and over only ever keeps the LATEST version — the earlier, maybe-correct version is gone the moment you hit save. Keeping extra copies like notes-final.txt and notes-final2.txt doesn't really solve this either, because nothing tells you what changed, why, or who did it, or which copy is actually the latest. Git solves this by saving labelled snapshots of your whole project, on purpose, whenever you ask it to.",
  analogy: "Saving a file is like erasing a whiteboard and writing the new version — the old version is just gone. Git is like taking a labelled photo of the whiteboard every time you make a meaningful change, so you can always go back and see exactly what it looked like at any point, and read a note explaining why it changed.",
  concepts: [
    "**The problem, step by step:** you update `notes.txt`, save the file, and later realise the earlier version had the correct answer. But **saving keeps only the latest version** — the earlier version is not automatically preserved.",

    "**What if we just save extra copies?** (`notes.txt`, `notes-old.txt`, `notes-final.txt`, `notes-final2.txt`) — this raises a new problem: which file actually contains the latest version? Nothing tells you.",
    "**What makes project history actually useful?** Being able to answer: What did it look like before? What changed? Why was it changed? Who changed it?",
    "**Version control** preserves meaningful project versions as **snapshots**. A snapshot shows what the project looked like at a particular moment. Project history helps us understand what changed and who changed it.",
    "**Git** is a version control system that runs on your computer. It tracks and manages changes in project files over time. Conceptually: Files on your computer → (version control system) → History of your project. Git was created in **2005 by Linus Torvalds** (creator of the Linux kernel), built in about two weeks to support Linux development.",
    "**Setting up Git:** install it (e.g. via Homebrew on macOS), then set your Git identity — **Git uses your name and email to identify who made a change**, so the project history shows who made each change.",
    "**`git init`** creates a hidden `.git` folder inside the project. `.git` stores all the data Git needs to manage the project history — it is effectively **Git's memory**. A folder initialised with Git is called a **Git repository**. ⚠️ Do not edit or delete `.git` manually.",
    "**Untracked** means a file is inside the project folder, but Git has not started following its changes yet — Git can see the file, but it is not included in the project's history.",
    "**`git add`** selects the CURRENT changes in a file for the next snapshot. Because an untracked file was selected, Git now begins tracking it.",
    "**Staging:** after `git add notes.txt`, the file moves from the **Working Directory** into the **Staging Area** — 'changes selected for the next snapshot.' Checking status shows the file under 'Changes to be committed', shown in green as a new file. Git calls this state **staging**.",
    "**Commit:** a commit is a SAVED SNAPSHOT of the staged changes. Git adds this snapshot to the project's history. Each commit has a **message** describing the saved changes.",

    "**Repeating the cycle:** change the file again (e.g. add a new line) → Git marks it as **modified** (changed since the last commit) → `git add` stages the new change → `git commit -m \"...\"` creates a second commit. The project now has TWO saved snapshots, both part of the project history.",
    "**`git log`** shows the commits in the project. Each entry includes a **commit ID, author, date, and message**.",
    "**The full workflow, rebuilt step by step (lecture's own recap):** Change (make a change to the file) → Check (`git status`) → Select (`git add`) → Record (`git commit -m \"<msg>\"`) → Read History (`git log`).",
    "**Writing clear commit messages:** a useful commit message starts with an action and names the specific change (vague messages like 'update' or 'fix' are discouraged in favour of specific ones)."

{ n: 28, part: 5, title: "The Network & the Internet", slides: "Network (Lecture 11) · 48 slides",
  simple: "When you push code to GitHub, it travels across real cables to another computer. This lecture explains how computers are connected (networks), how each one is found (IP address and DNS), which 'door' on it you knock on (port), what travels (packets) and which rules they follow (protocols such as HTTP and HTTPS).",
  analogy: "An IP address is a postal address, DNS is the contact list that turns a name into that address, a port is the particular door of the house you knock on, and a packet is one small parcel — a big message is sent as many small parcels.",
  concepts: [
    "**Where did your code go?** You pushed code to GitHub — but where is GitHub, how did the code reach it, and how did someone else's code reach your machine when you cloned a repository? Modern software depends on computers communicating with other computers. The lecture's answer starts with GitHub's servers.",
    "**Connecting many computers is costly:** joining every device to every other device needs n(n−1)/2 cables. 3 devices need 3(3−1)/2 = **3** cables and 10 devices need 10(10−1)/2 = **45** cables. For 100 devices the slide leaves the answer blank ('......').",
    "**A better idea — connect everyone to ONE device.** Networking devices named in the lecture: **Hub, Switch, Wireless Router, Access Point.**",
    "**Computer network:** a group of interconnected devices that can communicate and share resources, such as data and hardware, through wired or wireless connections.",
    "**The internet is physical.** Despite being called 'the cloud', the internet relies on massive physical infrastructure spanning the globe (the lecture points to a cable atlas).",
    "**Types of network by scale:** **LAN** (Local Area Network) connects devices in a limited area such as a home, school or office, sharing resources like files and printers. **MAN** (Metropolitan Area Network) spans a larger area than a LAN, typically a city or a large campus, connecting multiple LANs. **WAN** (Wide Area Network) covers a broad area, connecting multiple LANs and MANs across cities, countries or even globally (the slide's example: Pune, New York and Delhi).",
    "**The Internet:** essentially a vast **network of networks**, where multiple LANs, MANs and WANs are interconnected globally.",
    "**IP address:** a unique identifier assigned to each device connected to the internet or a local network. 'IP' stands for **Internet Protocol**, the set of rules for sending data between devices on networks.",
    "**Internet Protocol (IP):** a set of rules that governs how data packets are addressed, sent and received across a network. It assigns unique numerical addresses to each device, ensuring that data is routed correctly from the sender to the recipient.",
    "**IPv4 addressing:** think of it as a four-part postal code: [Country Code].[State Code].[City Code].[Street Number]. IPv4 is the first major version and still powers most of the internet today. It is a **32-bit number**, written as **four 8-bit numbers (octets) separated by dots**, e.g. `192.168.1.1`. Each of the four numbers can range from **0 to 255**.",
    "**Server name vs its IP address — who converts github.com into an IP address?** The **Domain Name System (DNS)**. DNS translates human-readable domain names (like www.example.com) into IP addresses (like 192.0.2.1) that computers use to identify each other. **DNS is like a contact list for the Internet** — it helps your computer find the destination.",
    "**Is an IP address enough?** No. **Ports** are like different doors on your house; each door lets people into a different room where you do different things. In `https://github.com:443/newton-school/project` the port is 443. Your browser connecting to Google looks like: Your Laptop `IP:Random Port` ↔ Google `IP:443`.",
    "**`ping`** is the simple command for talking to a server (the lecture uses GitHub). Ping checks basic reachability. **No reply does not always mean the website is down** — some servers block ping requests.",
    "**Packets:** small units of data transmitted over a network. Packets allow large amounts of data to be sent efficiently and reliably.",
    "**Protocols:** standardized rules and procedures that define how data is transmitted and processed over a network. They standardize communication methods, error handling and data formatting so different devices and systems can interact. Protocols named in the lecture: **TCP, IP, UDP, HTTP, FTP, SMTP.**",
    "**HTTP (Hypertext Transfer Protocol):** a protocol for transferring web pages and other resources over the internet. It defines how messages are formatted and transmitted between web servers and browsers, so users can request and receive web content.",
    "**HTTP vs HTTPS:** HTTPS secures web communication by **encrypting data and verifying the server's identity** to protect privacy and integrity.",
    "**URL (Uniform Resource Locator):** the web address you type into a browser to reach a specific webpage or resource, like a map guiding you to a particular spot on the internet. Example: `https://www.newton.com/dogs/cat.jpg?size=64#new`. For `https://github.com/newton-school/project` the parts are **Protocol** (https), **Domain** (github.com) and **Path** (/newton-school/project).",
    "**A webpage is made of many pieces:** HTML, CSS, JavaScript, images, fonts and data from APIs. The browser requests these pieces from one or more servers.",
    "**A packet's journey:** GitHub may be in another city, country or data centre, so a packet may pass through **many routers** before it reaches GitHub. Each router sends it to the next possible step.",
    "**ARPANET:** the precursor to the modern internet, developed by the U.S. Department of Defense's Advanced Research Projects Agency (ARPA, later DARPA) in the late 1960s, to let multiple computers communicate over a long distance — a revolutionary concept at the time.",
    "**World Wide Web (WWW):** a system for accessing, sharing and linking information over the internet, created in **1989** by British scientist **Tim Berners-Lee at CERN**. Unlike the internet (the global network of interconnected computers), the Web is a **service that runs on the internet**, letting users reach web pages through a browser."

function levelInfo(xp) {
  const level = 1 + Math.floor(xp / 100);
  const into = xp % 100;
  return { level, into, pct: into };
}
let curStreak = 0; // transient, resets on page reload — the running streak for THIS session
function awardXP(amount, opts) {
  opts = opts || {};
  const before = levelInfo(S.xp).level;
  S.xp = Math.max(0, S.xp + amount);
  const after = levelInfo(S.xp).level;
  saveState();
  if (!opts.silent && amount > 0) toast("+" + amount + " XP" + (opts.reason ? " — " + opts.reason : ""));
  if (after > before) { toast("🎉 Level " + after + "!"); spawnConfetti(50); playTone([659, 831, 988], 0.09); }
  checkAchievements();
}
function registerAnswer(correct) {
  if (correct) {
    curStreak++;
    if (curStreak > S.streakBest) { S.streakBest = curStreak; saveState(); }

    playTone([523], 0.08);
    if (curStreak > 0 && curStreak % 5 === 0) toast("🔥 " + curStreak + " in a row!");
  } else {
    curStreak = 0;

}

const CONFETTI_COLORS = ["#2453D6", "#0B8A7E", "#BF5F12", "#5745D6", "#C23A3A", "#13835A", "#C23A7A"];
function spawnConfetti(n) {
  n = n || 40;
  const host = document.createElement("div");
  host.className = "confetti-host";
  host.setAttribute("aria-hidden", "true");
  for (let i = 0; i < n; i++) {
    const p = document.createElement("i");
    p.className = "confetti-piece";
    const x = Math.random() * 100;
    const delay = Math.random() * 0.25;
    const dur = 1.6 + Math.random() * 1.1;
    const rot = Math.random() * 360;
    const drift = (Math.random() - 0.5) * 140;
    const color = CONFETTI_COLORS[i % CONFETTI_COLORS.length];
    p.style.cssText = "left:" + x + "%;background:" + color + ";animation-delay:" + delay + "s;animation-duration:" + dur + "s;--rot:" + rot + "deg;--drift:" + drift + "px;";
    host.appendChild(p);
  }
  document.body.appendChild(host);
  setTimeout(() => host.remove(), 3200);
}

/* ================= SOUND (WebAudio, no files) ================= */
let AC = null;
function audioCtx() {
  if (!S.sound) return null;
  try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === "suspended") AC.resume(); return AC; } catch (e) { return null; }
}
function playTone(freqs, dur, type, vol) {
  const ctx = audioCtx(); if (!ctx) return;
  try {
    freqs.forEach((f, i) => {
      const t0 = ctx.currentTime + i * (dur * 0.9);
      const osc = ctx.createOscillator(); const gain = ctx.createGain();
      osc.type = type || "triangle"; osc.frequency.value = f;
      gain.gain.setValueAtTime(0, t0);
      gain.gain.linearRampToValueAtTime((vol || 0.25), t0 + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t0); osc.stop(t0 + dur + 0.02);
    });
  } catch (e) { /* ignore audio errors */ }
}
function toggleSound() { S.sound = !S.sound; saveState(); if (S.sound) playTone([523], 0.08); rerender(); }

"use strict";
let GAME = null; // null until started

function gamePickPool(n) {
  const pool = COMMANDS.filter(c => c.does && c.does !== "Not provided in the source material.");
  return shuffle(pool).slice(0, n);
}
function gameNew(n) {
  n = n || 8;
  const picks = gamePickPool(n);
  const cards = [];
  picks.forEach((c, i) => {
    const def = c.does.split(".")[0].split(" — ")[0];
    cards.push({ idx: 0, pairId: i, type: "cmd", text: c.n, flipped: false, matched: false });
    cards.push({ idx: 0, pairId: i, type: "def", text: def.length > 70 ? def.slice(0, 68) + "…" : def, flipped: false, matched: false });
  });
  const ordered = shuffle(cards).map((c, i) => Object.assign(c, { idx: i }));
  GAME = { cards: ordered, firstPick: null, lock: false, moves: 0, matchedPairs: 0, totalPairs: picks.length, won: false, startedAt: Date.now() };
}
Object.assign(ACTIONS, {
  gameStart: () => { gameNew(8); rerender(); },
  gameRestart: () => { GAME = null; rerender(); },
  gameFlip: (idx) => {
    idx = +idx;
    if (!GAME || GAME.lock || GAME.won) return;
    const card = GAME.cards[idx];
    if (!card || card.flipped || card.matched) return;
    card.flipped = true;
    if (GAME.firstPick == null) { GAME.firstPick = idx; rerender(); return; }
    GAME.moves++;
    const a = GAME.cards[GAME.firstPick], b = card;
    if (a.pairId === b.pairId) {
      a.matched = true; b.matched = true; GAME.matchedPairs++;
      GAME.firstPick = null;
      playTone([659, 988], 0.09);
      if (GAME.matchedPairs === GAME.totalPairs) {
        GAME.won = true;
        const elapsed = Math.round((Date.now() - GAME.startedAt) / 1000);
        GAME.elapsed = elapsed;
        const isBest = !S.gameBest || GAME.moves < S.gameBest.moves;
        if (isBest) S.gameBest = { moves: GAME.moves, seconds: elapsed };
        saveState();
        awardXP(25, { reason: "Command Match won" });
        spawnConfetti(80);
        checkAchievements();
      }
      rerender();
    } else {
      GAME.lock = true;
      playTone([220], 0.1, "sine", 0.4);
      rerender();
      setTimeout(() => {
        a.flipped = false; b.flipped = false; GAME.firstPick = null; GAME.lock = false;
        rerender();
      }, 700);
    }
  }
});

function viewGame() {
  if (!GAME) {
    return '<div class="page-h"><h1>Command Match</h1><p>Flip two cards at a time and pair each terminal command with its meaning. Fewer moves = a better score.</p></div>' +
      '<div class="card">' +
      (S.gameBest ? '<p class="muted">Your best so far: <b>' + S.gameBest.moves + " moves</b> in " + S.gameBest.seconds + "s.</p>" : '<p class="muted">No run yet — let\'s see how you do.</p>') +
      '<button class="btn pri" data-act="gameStart">Start a new game (8 pairs)</button></div>';
  }
  if (GAME.won) {
    const isBest = S.gameBest && S.gameBest.moves === GAME.moves && S.gameBest.seconds === GAME.elapsed;
    return '<div class="page-h"><h1>Command Match</h1></div>' +
      '<div class="card game-win"><div class="big-emoji">🎉</div><h2>Solved it!</h2>' +
      '<p>' + GAME.moves + " moves · " + GAME.elapsed + "s" + (isBest ? ' · <span class="badge ok">New best!</span>' : "") + "</p>" +
      '<div class="row" style="justify-content:center;margin-top:12px"><button class="btn pri" data-act="gameStart">Play again</button><a class="btn" href="#/flashcards">Review flashcards instead</a></div></div>';
  }
  const cards = GAME.cards.map(c => {
    const cls = "mcard" + (c.flipped || c.matched ? " flip" : "") + (c.matched ? " matched" : "") + (c.type === "cmd" ? " cmdtype" : "");
    return '<div class="' + cls + '" data-act="gameFlip" data-arg="' + c.idx + '" role="button" tabindex="0" aria-label="card"><div class="mcard-in">' +
      '<div class="mface back">?</div><div class="mface front">' + esc(c.text) + "</div>" +
      "</div></div>";
  }).join("");
  return '<div class="page-h"><h1>Command Match</h1><p>Match each command to its meaning.</p></div>' +
    '<div class="game-head"><div class="game-stats"><div><b>' + GAME.moves + '</b><span class="muted small">moves</span></div><div><b>' + GAME.matchedPairs + "/" + GAME.totalPairs + '</b><span class="muted small">pairs</span></div></div>' +
    '<button class="btn sm" data-act="gameRestart">Give up / new game</button></div>' +
    '<div class="match-grid">' + cards + "</div>";
}

  F(2, "c", "RAM vs storage in one line?", "RAM = fast + forgets. Storage = slower + remembers.");

  F(3, "c", "Draw the software stack from the lecture.", "Applications (Chrome, Games, Word) ↓ Operating System (Windows, Linux) ↓ Hardware (CPU, RAM, Disk).");
  F(3, "c", "Why does system software exist as a middle layer?", "So every app doesn't have to handle raw hardware itself — one shared, standard doorway.");
  F(4, "c", "Define an Operating System (lecture).", "A software that acts as a bridge between the user and the computer hardware. It manages all the software and hardware on a computer or digital device.");
  F(4, "c", "What are the four core OS jobs (P-D-F-U)?", "Manage Process & Memory · Manage Devices · Manage Files & Storage · Provide User Interface.");
  F(4, "c", "How does a laptop 'run many apps at once' with one CPU core?", "The OS rapidly switches the CPU between apps, giving each a tiny time slice (thousands of times a second).");
  F(5, "c", "Kernel space vs user space?", "Kernel space: core of the OS, full unrestricted access to hardware. User space: where normal apps run, with restricted access.");
  F(5, "c", "What is a system call?", "A formal request an app makes to the kernel for something only the kernel can do (read a file, use the network, talk to the printer).");
  F(5, "c", "What is a driver?", "A small translator program between the kernel and a physical device (keyboard, disk, printer, GPU).");
  F(5, "c", "Flow to memorise for an app reading a file?", "app → system call → kernel → driver → physical disk.");
  F(5, "c", "Why can't an ordinary app talk directly to hardware?", "The kernel/user privilege split is enforced by the CPU itself, for safety — real hardware protection, not a policy.");

  F(10, "c", "What is scheduling?", "Deciding which process gets the CPU next.");

  F(10, "c", "FCFS example P1=10, P2=8, P3=3 — waiting and turnaround?", "Waiting 0, 10, 18. Turnaround 10, 18, 21. Gantt: P1 (0–10), P2 (10–18), P3 (18–21).");
