  F(12, "c", "Give the lecture example of why Priority scheduling is useful.", "A security alert should jump ahead of a random background download, even if the download arrived first and needs less time.");
  F(13, "c", "What is Round Robin?", "Everyone gets a small, fixed turn (a time quantum). If not done, they go to the back of the line and wait for their next turn.");
  F(13, "c", "Round Robin, quantum 4, P1=10, P2=8, P3=3 — the sequence?", "P1 | P2 | P3 | P1 | P2 | P1 at 0–4, 4–8, 8–11, 11–15, 15–19, 19–21.");
  F(13, "c", "Round Robin's trade-off?", "Best at fairness and feeling responsive; weak point: more switching = more overhead.");
  F(13, "c", "Compare the four algorithms: best at / weak point.", "FCFS: simplicity / convoy effect. SJF: lowest average wait / starvation. Priority: important tasks jump ahead / starvation (fixed by aging). Round Robin: fairness, responsive / more switching = more overhead.");
  F(14, "c", "What is a PCB?", "Process Control Block — a small record the OS keeps in RAM for every process it creates (the sticky note / ID card).");
  F(14, "c", "What four things are on a PCB?", "PID · where it stopped (exact instruction reached) · values the CPU was holding for it · its state (running, waiting for its turn, or ready).");
  F(14, "c", "What is a context switch?", "SAVE the current process's progress to its PCB, then LOAD the next process's PCB into the CPU. Pure admin, no real work.");
  F(14, "c", "Why does frequent context switching slow a system down?", "Each switch costs real CPU time saving/loading state — more time on admin, less on real work.");
  F(14, "c", "What does the OS write into a PCB right before pausing a process?", "Its current progress — exactly where it stopped, so it can resume from there. Not the whole program.");
  F(15, "c", "What is multiprocessing?", "Using more than one CPU core: a program creates multiple separate processes and the OS spreads them across cores so they run truly in parallel.");
  F(15, "k", "What does `ps aux` show?", "Every running process: owner (USER), PID, CPU usage, and the command that started it.");
  F(15, "c", "Terminal/shell and the new process it creates — relationship?", "The shell is the parent; the new process is its child. Closing a terminal can also close everything it started.");
  F(15, "k", "What does `kill -9 <PID>` do?", "Sends a 'stop immediately, no cleanup' signal to that PID. Emergency stop for a frozen process.");
  F(15, "c", "What happens to RAM the instant a process ends?", "The OS takes back all its RAM and its PCB slot and returns them to the free pool.");
  F(15, "k", "ps aux vs top/htop?", "ps aux = a plain snapshot list. top/htop = live, constantly updating, sorted by resource usage (biggest CPU users float to the top).");
  F(16, "c", "What are the four jobs of memory management?", "Hand out RAM fairly · track who has what · take it back when a process ends · stop one process touching another's memory.");
  F(16, "c", "What is paging?", "Splitting RAM into small, fixed-size blocks called pages (a common size is 4KB); a process's pages need not be next to each other.");
  F(16, "c", "Why fixed-size pages instead of custom chunks?", "Custom-sized chunks leave awkward unusable gaps (fragmentation). Fixed pages fit like uniform bricks, no odd gaps.");
  F(16, "c", "What is fragmentation?", "Awkward little gaps of unusable space left between custom-sized chunks over time.");
  F(16, "c", "What is virtual memory?", "The convenient lie: every process is told it has the whole memory to itself, starting from address 0. The OS + MMU secretly map fake addresses to real, scattered, protected RAM.");
  F(16, "c", "What is the MMU?", "Memory Management Unit — hardware that translates each process's fake address into a real physical location in RAM.");
  F(16, "c", "How can two processes both use 'address 1000'?", "Each is told a different 'lie'; both point to two completely separate real physical locations.");
  F(16, "c", "What is swapping and why is it slow?", "When RAM truly runs out, pages move to disk. Disk is far slower than RAM, so the computer feels laggy.");
  F(17, "k", "What does `;` do?", "Runs the next command no matter what happened with the one before it.");
  F(17, "k", "What does `&&` do?", "Runs the next command only if the previous one succeeded.");
  F(17, "k", "What does `||` do?", "Runs the next command only if the previous one failed.");
  F(17, "k", "What does `|` (pipe) do?", "Takes the output of one command and feeds it as the input to the next.");
  F(17, "k", "What does `&` at the end of a command do?", "Runs it in the background — start it, but give the terminal back right away.");
  F(17, "k", "What does `mkdir notes && cd notes` do?", "Creates the folder and ONLY if that succeeded, enters it.");
  F(17, "k", "If `mkdir data && cd data` and mkdir fails, does cd run?", "No — && only continues if the previous command succeeded. (With ; it would run.)");
  F(17, "k", "What does `ls | grep py` do?", "Lists files, then filters that output to only show names containing 'py'.");
  F(17, "c", "Three scripts each launched with `&` — what happens?", "Three separate processes, each with its own PID, that the OS can schedule across different cores (real multiprocessing).");
  // ---- Part 3 ----
  F(18, "c", "Name the five types of computers in order.", "Embedded, Personal, Server (data centers), Supercomputer, Quantum.");
  F(18, "c", "What is an embedded system? Examples?", "A small computer built into a device to control just that one thing, one job forever: washing machines, traffic lights, ATMs, a smart thermostat.");
  F(18, "c", "What is a server / data center?", "Computers that store and provide data/services to many other computers over a network at the same time (cloud services, AI training).");
  F(18, "c", "What is a quantum computer?", "A newer category that uses quantum physics to solve certain problems classical computers (even supercomputers) can't handle efficiently.");
  F(18, "c", "Smart thermostat — which type of computer?", "Embedded system.");
  F(19, "c", "What is an interface?", "The boundary where two things meet (steering wheel, TV remote); it hides the engine.");
  F(19, "c", "CLI vs GUI vs API?", "CLI: text commands (macOS shell = zsh). GUI: visual — windows, icons, buttons (Xerox PARC 1970s, mainstream with the 1984 Macintosh). API: how two programs talk to each other, no human or screen.");
  F(19, "c", "Restaurant-menu analogy for an API?", "You (program 1) order through the menu (the interface), the kitchen (program 2) returns a result (response). You never see the kitchen.");
  F(19, "c", "In the API restaurant analogy, what is the menu?", "The interface — the shared boundary between the customer and the kitchen.");
  F(19, "k", "What did `curl http://api.open-notify.org/iss-now.json` return?", "The International Space Station's position (longitude, latitude) and 'message: success'.");
  F(20, "c", "Windows vs macOS vs Linux — ease of use?", "Windows: user-friendly, low–moderate learning curve. macOS: very low learning curve. Linux: moderate–high, needs technical knowledge.");
  F(20, "c", "Windows vs macOS vs Linux — customization?", "Windows: limited but accessible. macOS: minimal, Apple-controlled. Linux: highly customizable.");
  F(20, "c", "Windows vs macOS vs Linux — hardware/software support?", "Windows: very wide. macOS: Apple ecosystem only. Linux: extensive but needs tuning.");
  F(20, "c", "Windows vs macOS vs Linux — typical users?", "Windows: everyday + business. macOS: professionals, creatives. Linux: developers, tech enthusiasts.");
  F(20, "c", "Why does Linux dominate servers more than desktops?", "Its deep customizability matters much more on servers nobody directly looks at than on everyday desktops.");
  F(20, "c", "Trick to remember the three OSes?", "Windows = wide, macOS = easy + locked, Linux = custom + technical.");
  F(21, "k", "What does `chmod 640 file.txt` mean?", "Owner 6 = rw- (read+write), group 4 = r-- (read only), others 0 = --- (no access).");
  F(21, "k", "What does `chmod 700 keyvault` mean?", "Owner 7 = rwx (full access); group 0 = ---; others 0 = ---. Everyone else gets nothing.");
  F(21, "k", "chmod numbers: read, write, execute?", "read = 4, write = 2, execute = 1. Add them (4+2+1 = 7 = rwx). Three digits: owner, group, others.");
  F(21, "k", "Difference between find and grep?", "find looks for FILES by name; grep looks for TEXT inside files.");
  F(21, "k", "What does `find . -name '*.txt'` do?", "Searches from the current directory (.) and finds every .txt file (wildcard).");
  F(21, "k", "What does `grep -i 'hello' file.txt` do?", "Finds lines containing 'hello' in file.txt, ignoring upper/lowercase.");
  F(21, "k", "wc -l, -w, -c?", "Count lines, words, characters (l, w, c in that order).");
  F(21, "k", "head vs tail?", "head = first lines of a file; tail = last lines (useful for checking the end of a log file).");
  F(21, "k", "sort and sort -r?", "sort = alphabetical; sort -r = reversed order.");
  F(21, "k", "The four redirection symbols?", "> replace · >> append · < feed a file in as input · | pipe (output of one → input of the next).");
  F(21, "k", "Which command: 'show current directory'?", "pwd.");
  F(21, "k", "Which command: 'create directory / empty file'?", "mkdir / touch.");
  F(21, "k", "Which command: 'copy / move / rename / delete'?", "cp / mv / mv / rm.");
  F(21, "k", "Which command: 'display contents'?", "cat.");
  F(21, "k", "Which command: 'change permissions'?", "chmod.");
  F(22, "k", "ps vs ps aux?", "ps = only processes tied to your current terminal session (a small slice). ps aux = every process on the system (USER, PID, %CPU, %MEM, COMMAND).");
  F(22, "k", "kill vs kill -9?", "kill <PID> = SIGTERM (15), polite: 'please stop, and clean up first'. kill -9 <PID> = SIGKILL (9), force, immediate, no cleanup.");
  F(22, "k", "A process ignores `kill 4821`. Next step?", "kill -9 4821 — escalate to SIGKILL since the polite SIGTERM request was ignored.");
  F(22, "c", "Why does Activity Monitor show far more processes than plain ps?", "Plain ps shows only your current terminal session; ps aux-style lists every process on the system.");
  // ---- Part 4 ----
  F(23, "c", "What is the filesystem?", "The OS's organised structure for storage — everything on the computer is stored somewhere under the root location (/).");
  F(23, "c", "What does 'Everything is a file' mean in Unix?", "Programs (e.g. /bin/ls), configuration (e.g. /etc/hosts) and even devices (e.g. /dev/keyboard) are all accessed the same way, as files.");
  F(23, "c", "What TWO things does the OS check before running a file?", "(1) Does the user have permission to execute it? (2) Does it contain executable instructions?");
  F(23, "c", "Why does ./hello.txt give 'permission denied' right after touch + echo?", "A newly created file is readable and writable by its owner (rw-) but NOT executable by default — this prevents accidental execution.");
  F(23, "c", "Does renaming an executable file (e.g. to run_me.banana) stop it from running?", "No — the filename/extension is irrelevant. Only the execute permission bit and the file's actual content decide whether it runs.");
  F(23, "c", "chmod 755 vs chmod 600 — what do they mean?", "755 = owner rwx, group r-x, others r-x (scripts/programs). 600 = owner rw-, group none, others none (private).");
  F(23, "k", "What does chown do?", "Transfers ownership of a file to another user, e.g. sudo chown elliot file.txt.");
  F(23, "c", "What is PATH?", "An environment variable: a colon-separated list of directories the shell searches, left to right, to find a command.");
  F(23, "c", "What happens if PATH is set to empty?", "Plain command names like ls or cat fail with 'command not found'; only a full path like /bin/ls still works.");
  F(23, "k", "What does which do?", "Shows exactly which file in PATH the shell would run for a given command, e.g. which ls → /bin/ls.");
  F(24, "c", "How did a shepherd count goats with no number words?", "One-to-one correspondence: one stone laid down per goat.");
  F(24, "c", "What is the unary number system?", "Each symbol represents one quantity, e.g. III = 3. Becomes tedious for large numbers (20 needs 20 symbols).");
  F(24, "c", "Is the Roman number system positional?", "No — it is non-positional and additive (I=1, V=5, X=10, L=50, C=100, D=500, M=1000, combined and added).");
  F(24, "c", "What is a positional number system?", "A system where a digit's value depends on its POSITION in the number — e.g. in 3423, each place is a different power of 10.");
  F(24, "c", "What two things does the decimal system introduce that unary/Roman didn't have?", "It is positional (base-10, digits 0-9) AND it introduces the concept of zero.");
  F(24, "c", "Why do computers use binary specifically?", "The most basic electronic devices have 2 states (on/off), which map directly onto the two binary digits 0 and 1.");
  F(24, "c", "Convert 1001 (binary) to decimal.", "1*2^3 + 0*2^2 + 0*2^1 + 1*2^0 = 8+0+0+1 = 9.");
  F(24, "c", "Convert 13 (decimal) to binary.", "Divide by 2 repeatedly (13→6 r1, 6→3 r0, 3→1 r1, 1→0 r1), then reverse the remainders: 1101.");
  F(24, "c", "Does the quantity change between unary, Roman, decimal and binary?", "No — only the written representation changes; VI, IIIIII, and 6 are the exact same quantity.");
  F(25, "c", "What does the CPU actually understand?", "Only machine code — specific binary patterns. Not Python, not JavaScript. Every program eventually becomes binary.");
  F(25, "c", "What is compilation?", "Translating an entire source code file into machine code BEFORE the program is executed.");
  F(25, "c", "What is interpretation?", "Translating and executing source code into machine code ONE LINE at a time, AS the program runs.");
  F(25, "c", "Why was C built in 1972 and Python in 1989?", "1972: machine time was expensive, programmers cheap → C optimises for machine time. 1989: hardware had gotten cheap, programmer time was now expensive → Python optimises for programmer time.");
  F(25, "c", "What is the Bootstrap Problem?", "To build a tool that runs a language, you need a language that already runs — Python can't interpret itself before an interpreter exists, so CPython (Python's interpreter) is written in C.");
  F(25, "c", "What is JIT (Just-in-Time) compilation?", "Starting by interpreting code, but compiling frequently-run code to native binary WHILE the program is running — e.g. V8 for JavaScript.");
  F(25, "c", "Static vs dynamic linking?", "Static = larger, self-contained binary, nothing to break later. Dynamic = smaller binary sharing a library, so a broken shared library can break several programs at once.");
  F(25, "c", "What's the relationship between Python, CPython and PyPy?", "Python is a specification (the language); CPython (written in C) and PyPy (written in Python, JIT-based) are two separate ways to run it.");
  F(26, "c", "Why isn't just saving a file enough to track its history?", "Saving only keeps the LATEST version; the earlier version is gone, with no explanation of what changed or why.");
  F(26, "c", "Why isn't Undo a reliable project history?", "It depends on the editor/session, doesn't explain what changed or why, and doesn't create named versions you can revisit.");
  F(26, "c", "What is version control?", "Preserving meaningful project versions as snapshots, so you can see what changed, why, and who changed it.");
  F(26, "c", "What is Git, and who created it?", "A version control system that runs on your computer and tracks file changes over time; created by Linus Torvalds in 2005.");
  F(26, "k", "What does git init do?", "Creates a hidden .git folder, turning the current folder into a Git repository — Git's memory for that project.");
  F(26, "c", "What does 'untracked' mean in Git?", "Git can see the file in the project folder, but has not started following its changes — it isn't part of the history yet.");
  F(26, "k", "What does git add do?", "Selects (stages) a file's current changes, moving them into the staging area, ready for the next commit.");
  F(26, "k", "What does git commit -m \"message\" do?", "Records the staged changes as a saved snapshot in the project's history, labelled with the given message.");
  F(26, "c", "What does 'working tree clean' mean?", "The project currently matches the latest commit exactly — there are no new changes to save.");
  F(26, "k", "What does git log show?", "The commits in the project's history, each with a commit ID, author, date, and message.");
  F(26, "c", "What is the five-step Git workflow from the lecture?", "Change (edit the file) → Check (git status) → Select (git add) → Record (git commit -m) → Read History (git log).");
  // ---- Part 5 ----
  F(27, "c", "Why isn't a local Git repository enough on its own?", "All history lives in the hidden .git folder on one laptop. If the laptop is lost or damaged, everything is gone: no backup, no copies. Teams also need a shared place to combine work.");
  F(27, "c", "What is a remote repository?", "A central place, such as GitHub, where developers store and share their code.");
  F(27, "c", "Git vs GitHub?", "Git is a version control tool. GitHub is a platform for hosting Git repositories.");
  F(27, "c", "What does public vs private mean for a GitHub repo?", "Public = anyone can see it. Private = only you and people you invite.");
  F(27, "k", "What does git remote add do?", "Registers a new remote address under a local nickname (alias), so Git knows where to send your commits.");
  F(27, "k", "Explain git push -u origin main.", "Upload the local main branch to the remote named origin, and remember the connection (-u sets the upstream, a tracking relationship).");
  F(27, "k", "Why can later pushes be just git push?", "-u created a tracking relationship: Git remembers Remote = origin and Branch = main, so future pushes automatically use origin/main.");
  F(27, "c", "What is origin?", "The local nickname (alias) you give the remote repository.");
  F(27, "k", "What does git pull do?", "Downloads the latest changes from the remote repository (GitHub) and updates your local code.");
  F(27, "k", "What does git clone do?", "Downloads a repository from GitHub as a local copy, including all files, branches and commit history.");
  F(27, "c", "git pull vs git clone?", "pull updates a repo you already have; clone downloads a repo for the first time, with its complete history.");
  F(27, "c", "Why do commit messages matter?", "They explain what and why a change was made, help teammates understand changes without reading code, help you remember context, and help trace bugs quickly.");
  F(27, "c", "Give a bad and a good commit message from the lecture.", "Bad: 'updated file'. Good: 'Add student registration form validation'.");
  F(27, "c", "How do teams use GitHub without chaos?", "Each developer works on their own feature branch (not main), pushes it, opens a Pull Request, teammates review, then it is merged into main and everyone pulls the latest.");
  F(27, "c", "What is a Pull Request?", "A request to merge a pushed branch into main, which teammates review and approve before it is merged.");
  F(27, "c", "What is GitHub's 'single source of truth' role?", "One developer pushes, others pull the latest code, and everyone works from the same project repository on GitHub.");
  F(27, "c", "When was GitHub founded and acquired?", "Founded in 2008 by 4 developers; acquired by Microsoft in 2018; today 100M+ repositories.");
  F(28, "c", "How many cables join n devices directly to each other?", "n(n-1)/2. For 3 devices: 3; for 10 devices: 45.");
  F(28, "c", "What is a computer network?", "A group of interconnected devices that can communicate and share resources, such as data and hardware, through wired or wireless connections.");
  F(28, "c", "LAN, MAN and WAN?", "LAN: a limited area (home, school, office). MAN: a city or large campus connecting LANs. WAN: connects LANs and MANs across cities, countries or the globe.");
  F(28, "c", "What is the Internet?", "A vast network of networks, where many LANs, MANs and WANs are interconnected globally.");
  F(28, "c", "What is an IP address?", "A unique identifier assigned to each device connected to the internet or a local network. IP = Internet Protocol.");
  F(28, "c", "Describe the structure of an IPv4 address.", "A 32-bit number written as four 8-bit octets separated by dots, each from 0 to 255, e.g. 192.168.1.1.");
  F(28, "c", "What does DNS do?", "The Domain Name System translates human-readable domain names (github.com) into IP addresses. It is like a contact list for the Internet.");
  F(28, "c", "What is a port?", "A numbered 'door' on a device. An IP address alone is not enough; e.g. HTTPS on a server uses port 443.");
  F(28, "k", "What does ping do, and what does 'no reply' mean?", "ping checks basic reachability. No reply does not always mean the site is down: some servers block ping requests.");
  F(28, "c", "What is a packet?", "A small unit of data transmitted over a network; packets let large amounts of data be sent efficiently and reliably.");
  F(28, "c", "What is a protocol? Name some.", "Standardized rules for how data is transmitted and processed over a network. Named in the lecture: TCP, IP, UDP, HTTP, FTP, SMTP.");
  F(28, "c", "HTTP vs HTTPS?", "HTTP transfers web pages and resources. HTTPS also encrypts the data and verifies the server's identity.");
  F(28, "c", "Name the three parts of the URL https://github.com/newton-school/project.", "Protocol (https), Domain (github.com), Path (/newton-school/project).");
  F(28, "c", "Why may a packet pass through many routers?", "The destination (e.g. GitHub) may be in another city, country or data centre; each router sends the packet to the next possible step.");
  F(28, "c", "What is ARPANET?", "The late-1960s precursor to the modern internet, developed by the U.S. Department of Defense's ARPA (later DARPA) so computers could communicate over long distances.");
  F(28, "c", "Internet vs World Wide Web?", "The Internet is the global network of computers. The Web is a service that runs on the internet, created in 1989 by Tim Berners-Lee at CERN.");
})();


/* ---- 40_data_quiz.js ---- */
"use strict";
const QUESTIONS = [];
(function () {
  const add = o => { o.id = QUESTIONS.length + 1; QUESTIONS.push(o); };
  // correct option FIRST in opts; the app shuffles the order each time
  const M = (m, d, q, o, x, src) => add({ m, d, t: "mcq", q, o, x, src: src || "derived" });
  const L = (m, d, q, o, x) => add({ m, d, t: "mcq", q, o, x, src: "lecture" });
  const T = (m, d, q, a, x) => add({ m, d, t: "tf", q, a, x, src: "derived" });
  const B = (m, d, q, acc, x) => add({ m, d, t: "fill", q, acc, x, src: "derived" });
  const C = (m, d, q, o, x, code) => add({ m, d, t: "cmd", q, o, x, code, src: "derived" });
  const P = (m, d, q, n, x, code) => add({ m, d, t: "cpu", q, n, x, code, src: "derived" });
  const PM = (m, d, q, o, x, code) => add({ m, d, t: "cpu", q, o, x, code, src: "derived" });
  const S = (m, d, q, o, x) => add({ m, d, t: "scn", q, o, x, src: "derived" });

  /* ---- Module 1 ---- */
  L(1, "e", "Why do computers use binary (1s and 0s) instead of, say, 10 different digit levels?", ["Because two electrical states (on/off) are far more reliable to detect than many voltage levels", "Because ten levels would use too much RAM", "Because binary numbers are shorter to write for humans"], "Two states (on/off) are far more reliable to detect than many voltage levels. (Your slide showed only the correct option; the wrong options here are added for practice.)");
  T(1, "e", "A juicer is a computer because it takes input, processes it and gives output.", false, "False. A juicer can only do one job; computers can be reprogrammed to do many different tasks.");
  B(1, "e", "Computers can be ______ to do many different tasks; non-computer devices do one specific job.", ["reprogrammed", "re-programmed", "programmed again"], "The keyword is reprogrammed.");
  M(1, "m", "Which one-line description matches the lecture's plain version of a computer?", ["Take input → follow a set of steps → give output", "Store files forever without any power", "Connect two programs over a network"], "The whole job of a computer: input → steps → output (and sometimes store).");

  /* ---- Module 2 ---- */
  L(2, "e", "RAM loses all its data when the power goes off. Why?", ["It stores data as an electrical charge that needs constant power to hold", "It's a software setting the OS controls", "It's designed to be wiped for security"], "RAM holds data as electrical charge. Power off = charge gone = data gone. That is what volatile means.");
  T(2, "e", "An SSD has moving parts such as spinning platters.", false, "False. The HDD has spinning platters and read/write heads. The SSD uses flash memory with no moving parts.");
  B(2, "e", "The CPU is usually placed in a special slot called a ______ on the motherboard.", ["socket"], "The CPU sits in a socket on the motherboard.");
  M(2, "e", "Which of these is volatile?", ["RAM", "SSD", "HDD"], "RAM is volatile — its contents are cleared when the power is turned off.");
  M(2, "m", "Which statement about CPU and GPU matches the lecture?", ["The CPU has a few very powerful cores; the GPU has thousands of smaller cores", "The CPU has thousands of small cores; the GPU has a few powerful cores", "Both have exactly the same number of cores"], "CPU = few powerful cores (general tasks and decisions). GPU = thousands of smaller cores (gaming, video editing, AI).");
  M(2, "m", "Which pair best describes RAM and storage?", ["RAM = fast + forgets; storage = slower + remembers", "RAM = slow + remembers; storage = fast + forgets", "Both are volatile"], "RAM is fast but forgets when power is off. Storage (SSD/HDD) is slower but keeps everything.");
  S(2, "m", "Your laptop is switched off overnight. Which part still holds your saved files in the morning?", ["Storage (SSD/HDD)", "RAM", "The GPU"], "Storage keeps files permanently. RAM is volatile and is cleared when power is off.");

  /* ---- Module 3 ---- */
  L(3, "m", "Why does system software exist as a 'middle layer' between apps and hardware?", ["So every app doesn't have to handle raw hardware itself — one shared, standard doorway", "Because hardware companies require it by law", "To make computers look more professional"], "Without it, every game and browser would need its own code for every keyboard, screen and disk.");
  T(3, "m", "Programming languages and package managers are application software.", false, "False. Your lecture lists them under SYSTEM software (exam trap).");
  B(3, "e", "In the software stack, the Operating System sits between applications and ______.", ["hardware"], "Applications → Operating System → Hardware.");
  M(3, "e", "Which of these is APPLICATION software?", ["A web browser", "A device driver", "A package manager"], "Browsers, media players, databases and games are application software.");
  M(3, "m", "Which list contains only SYSTEM software examples from the lecture?", ["Operating Systems, Device Drivers, Programming Languages, Package Managers, System Utilities", "Media Players, Browsers, Databases, Games", "Chrome, Games, Word"], "Those five are system software. Media Players, Browsers, Databases and Games are application software.");

  /* ---- Module 4 ---- */
  L(4, "m", "Your laptop 'runs many apps at once' even with one CPU core. What's really happening?", ["The OS rapidly switches the CPU between apps, giving each a tiny time slice", "The CPU genuinely executes multiple instructions simultaneously", "Only one app is actually running; the rest are frozen images"], "One core does one thing at a time, but the OS swaps apps thousands of times a second. Keyword: time slice.");
  M(4, "e", "Which is one of the four core OS jobs?", ["Manage Files & Storage", "Design new CPUs", "Write application code"], "The four jobs: Process & Memory, Devices, Files & Storage, User Interface (P-D-F-U).");
  B(4, "e", "The four OS jobs are Process & Memory, Devices, Files & Storage and User ______.", ["interface"], "P-D-F-U: Process & Memory, Devices, Files & Storage, User Interface.");
  M(4, "e", "The lecture defines an OS as software that acts as a ______ between the user and the computer hardware.", ["bridge", "wall", "replacement"], "'A software that acts as a bridge between the user and the computer hardware.'");
  S(4, "m", "In the hotel analogy, what do the guests, rooms and staff stand for?", ["Guests = apps, rooms = RAM, staff = CPU", "Guests = files, rooms = CPU, staff = RAM", "Guests = drivers, rooms = disks, staff = apps"], "Guests (apps) ask the manager (OS); the manager gives rooms (RAM) and staff (CPU).");

  /* ---- Module 5 ---- */
  L(5, "m", "Why can't an ordinary app talk directly to your printer's hardware?", ["The kernel/user privilege split (enforced by the CPU) forces it through a system call and a driver, for safety", "Printers are too old-fashioned for direct access", "It's only a company policy, not something the hardware enforces"], "The CPU itself blocks apps from touching hardware. It is real hardware protection, not a policy.");
  B(5, "e", "The core of the OS, with full unrestricted access to hardware, runs in ______ space.", ["kernel"], "Kernel space = full access. User space = restricted.");
  T(5, "e", "A driver is a small translator program between the kernel and a device.", true, "True — that is the lecture's description of a driver.");
  M(5, "m", "Which is the correct flow when an app wants to read notes.txt?", ["app → system call → kernel → driver → physical disk", "app → driver → system call → kernel → physical disk", "app → physical disk → kernel → system call → driver"], "Flow to memorise: app → system call → kernel → driver → physical disk.");
  M(5, "h", "Which statement about kernel and user space is correct?", ["Normal apps run in user space with restricted access; they must make a system call to use kernel services", "Normal apps run in kernel space so they can reach hardware quickly", "User space has full unrestricted access to hardware"], "Apps live in user space (restricted) and knock on the kernel's door with system calls.");

  /* ---- Module 6 ---- */
  L(6, "e", "What's the actual difference between a program and a process?", ["A program is a dormant file on disk; a process is that program actively running in memory with CPU time", "They're the same thing, just two names", "A process is the installer; a program is what gets installed"], "Recipe versus cooking. The recipe stays in the book; each time someone cooks it, that is a new process.");
  T(6, "e", "Opening two Chrome windows creates two separate Chrome processes, each with its own memory and resources.", true, "True — that is the lecture's own example.");
  B(6, "e", "A program is a ______ file on disk, doing nothing.", ["dormant"], "Program = dormant file on disk.");
  S(6, "m", "One Chrome tab crashes but the other tabs keep running. Which idea from the lecture explains this?", ["Each tab runs as its own child process", "All tabs share one process, so nothing can crash", "The OS restarts the whole browser instantly"], "The main process is the parent; each tab is a child process. A crashed child doesn't crash the others.");
  M(6, "m", "Which is NOT one of the OS's jobs for processes according to the lecture?", ["Compile the program into binary", "Create processes", "Schedule CPU time for them"], "The four: create them, give each private memory, schedule CPU time, clean up after they finish.");

  /* ---- Module 7 ---- */
  L(7, "m", "A GUI's delete button and a CLI's delete command — underneath, what's really happening?", ["Both eventually trigger the same underlying system call to the kernel", "They use two completely separate, unrelated systems", "The GUI deletes files differently at a hardware level"], "Two doors into one room. The button and the command end at the same system call.");
  T(7, "e", "A CLI is harder to learn than a GUI but is more precise and powerful.", true, "True, per the lecture.");
  M(7, "e", "Which is a GUI feature?", ["Windows, icons, buttons and a mouse", "Typing exact text commands in the Terminal", "Two programs talking with no screen"], "GUI = windows, icons, buttons, mouse. CLI = typed commands. API = program to program.");

  /* ---- Module 8 ---- */
  L(8, "e", "What's the real difference between 'Terminal' and 'Shell'?", ["Terminal is the display window; Shell is the program that interprets and runs your commands", "They're always the exact same single program", "Terminal only works with a mouse, Shell only with a keyboard"], "Terminal shows text (the booth). Shell understands and runs it (the person).");
  B(8, "e", "Bash, Zsh and PowerShell are examples of a ______.", ["shell"], "They are shells — the program inside the terminal window.");
  M(8, "m", "When you run `python script.py`, what does the shell ask the kernel to do?", ["Create a new process, load 'python' into it, pass 'script.py' as an argument", "Delete script.py after running it", "Copy script.py into RAM permanently"], "1. create a new process 2. load the 'python' program into it 3. pass 'script.py' as an argument.");
  T(8, "m", "The prompt guest@snai:~$ is the shell waiting for you.", true, "True.");

  /* ---- Module 9 ---- */
  L(9, "e", "In `ls -la ./notes`, what is `-la`?", ["Flags — extra options that change how the base command ls behaves", "The name of the folder being opened", "A separate command running after ls"], "Anything starting with - is a flag. The folder is ./notes.");
  M(9, "e", "Which command installs Python packages?", ["pip install", "apt install", "npm install"], "pip = Python, apt = Linux, npm = JavaScript.");
  B(9, "e", "Flags usually start with a single dash or two dashes: - or ______.", ["--"], "Flags start with - or --.");
  C(9, "m", "In `ls -la ./notes`, what is `./notes`?", ["The argument — the folder ls acts on", "A flag", "The command"], "ls = command (verb), -la = flags, ./notes = argument (object).", "guest@snai:~$ ls -la ./notes\n↑cmd ↑flags ↑argument");
  C(9, "m", "In `ls -la`, what does the `a` flag do?", ["Shows hidden files", "Sorts alphabetically", "Deletes all files"], "l = long list, a = show hidden files.", "guest@snai:~$ ls -la");
  M(9, "m", "Which command both moves AND renames files?", ["mv", "cp", "rm"], "mv does BOTH move and rename.");

  /* ---- Module 10 ---- */
  L(10, "m", "P1 = 6 ms, P2 = 4 ms, P3 = 2 ms, arriving in that order, FCFS. What is P3's waiting time?", ["10 ms — the sum of P1 (6) and P2 (4) ahead of it", "6 ms", "2 ms"], "Add the bursts ahead of P3: 6 + 4 = 10 ms. P3's own 2 ms is burst, not waiting.");
  L(10, "m", "Why does a long P1 badly hurt every process behind it in FCFS specifically?", ["FCFS is non-preemptive — once a process starts, it holds the CPU until it's fully done", "Because P1 is always given priority by the OS", "Because longer processes use more RAM, not more CPU time"], "Non-preemptive means no interrupting. P1 keeps the CPU to the very end (convoy effect).");
  B(10, "e", "FCFS stands for First Come First ______.", ["served"], "First Come First Served.");
  M(10, "e", "Turnaround Time equals:", ["Waiting Time + Burst Time", "Arrival Time + Burst Time", "Burst Time − Waiting Time"], "Turnaround = Waiting + Burst (total time from arrival to finish).");
  M(10, "e", "The convoy effect means:", ["One long job at the front makes all the short ones wait", "Short jobs are always run first", "Every process gets the same small turn"], "Convoy effect (FCFS): one long job at the front makes all the short ones wait.");
  P(10, "e", "FCFS, all arrive at 0: P1 = 10, P2 = 8, P3 = 3. What is P2's waiting time (ms)?", 10, "P2 waits for P1's 10 ms → 10 ms.");
  P(10, "m", "Same FCFS example (10, 8, 3): what is P3's turnaround time (ms)?", 21, "Waiting 18 + burst 3 = 21 ms.");
  P(10, "m", "Same FCFS example (10, 8, 3): what is the average waiting time (ms)? Give two decimals.", 9.33, "(0 + 10 + 18) / 3 = 28 / 3 ≈ 9.33 ms.");
  P(10, "h", "FCFS with arrival times: P1 (AT 0, BT 4), P2 (AT 1, BT 3), P3 (AT 2, BT 1). What is P3's waiting time (ms)?", 5, "Order P1 (0–4), P2 (4–7), P3 (7–8). Turnaround = 8 − 2 = 6; waiting = 6 − 1 = 5 ms.");

  /* ---- Module 11 ---- */
  L(11, "e", "P1 = 6 ms, P2 = 4 ms, P3 = 2 ms (arrival order P1, P2, P3). Under SJF, what order do they run in?", ["P3, P2, P1", "P1, P2, P3", "P2, P3, P1"], "Sort by burst, smallest first: 2 (P3), 4 (P2), 6 (P1). Arrival order doesn't matter.");
  T(11, "e", "SJF is mathematically proven to give the lowest possible average waiting time of any scheduling rule.", true, "True — that is stated in your lecture.");
  P(11, "m", "SJF on P1 = 10, P2 = 8, P3 = 3 (all arrive at 0): what is the TOTAL waiting time (ms)?", 14, "Waiting: P3 0 + P2 3 + P1 11 = 14 (vs 28 in FCFS).");
  P(11, "m", "SJF with P1 = 6, P2 = 4, P3 = 2 (all arrive at 0): what is P1's waiting time (ms)?", 6, "Order P3 (0–2), P2 (2–6), P1 (6–12). P1 waits 2 + 4 = 6 ms.");
  S(11, "m", "Short jobs keep arriving, so a long job never gets to run. What is this problem called?", ["Starvation", "Convoy effect", "Fragmentation"], "Starvation — the catch of SJF.");
  P(11, "h", "Non-preemptive SJF with arrivals: P1 (AT 0, BT 4), P2 (AT 1, BT 3), P3 (AT 2, BT 1). What is P2's waiting time (ms)?", 4, "t=0: only P1 → runs 0–4. At t=4, P3 (1) is shorter than P2 (3): P3 runs 4–5, P2 runs 5–8. P2: turnaround 8 − 1 = 7, waiting 7 − 3 = 4 ms.");

  /* ---- Module 12 ---- */
  L(12, "e", "What problem does 'aging' specifically fix in priority scheduling?", ["It stops a low-priority task from waiting forever by slowly raising its priority over time", "It speeds up the CPU itself", "It deletes tasks that wait too long"], "Old low-priority tasks get 'promoted' a little as they wait, until they finally run.");
  T(12, "e", "In Priority scheduling, a process's arrival time and burst time decide who runs first.", false, "False — arrival time and burst time don't matter; the highest priority runs first.");
  S(12, "e", "A security alert and a background download are both waiting. Under Priority scheduling which runs first?", ["The security alert (higher priority), even if the download arrived first", "The download, because it arrived first", "Whichever needs less time"], "Priority lets the OS express 'this matters more' directly.");
  B(12, "e", "Slowly raising the priority of a task the longer it waits is called ______.", ["aging"], "Aging fixes starvation.");
  PM(12, "h", "Priority scheduling (this question says: higher number = higher priority). All arrive at 0: P1 (BT 4, priority 2), P2 (BT 3, priority 5), P3 (BT 2, priority 1). What is P3's waiting time (ms)?", ["7", "3", "0"], "Order by priority: P2 (0–3), P1 (3–7), P3 (7–9). P3 waits 7 ms.");

  /* ---- Module 13 ---- */
  L(13, "m", "In Round Robin, why doesn't P3 get frozen out the way it did under FCFS?", ["Every process gets a turn in rotation, so nobody waits for others to fully finish first", "P3 always gets top priority", "Round Robin skips shorter processes entirely"], "Turns rotate. P3 gets its slot early instead of waiting behind P1 and P2.");
  B(13, "e", "In Round Robin each process gets a small fixed turn called the time ______.", ["quantum"], "Time quantum.");
  M(13, "m", "What is Round Robin's weak point?", ["More switching = more overhead", "Convoy effect", "Starvation"], "FCFS: convoy effect. SJF/Priority: starvation. Round Robin: more switching = more overhead.");
  P(13, "m", "Round Robin, quantum = 4, all arrive at 0: P1 = 10, P2 = 8, P3 = 3. At what time does P3 finish?", 11, "P1 0–4, P2 4–8, P3 8–11 (needs only 3).");
  P(13, "m", "Same Round Robin example (quantum 4; 10, 8, 3): at what time does P1 finish?", 21, "P1 finishes with its third turn, 19–21.");
  P(13, "h", "Same Round Robin example: what is P2's waiting time (ms)? (waiting = turnaround − burst)", 11, "P2 completes at 19 → turnaround 19; waiting 19 − 8 = 11 ms.");
  P(13, "h", "Same Round Robin example: what is the average waiting time (ms)?", 10, "Waiting: P1 21−10 = 11, P2 19−8 = 11, P3 11−3 = 8. Average = 30 / 3 = 10.");
  P(13, "h", "Round Robin, quantum = 2, all arrive at 0: P1 = 5, P2 = 3. At what time does P2 finish?", 7, "P1 0–2, P2 2–4, P1 4–6, P2 6–7 (done), P1 7–8 (done). P2 finishes at 7.");
  S(13, "h", "The time quantum is made extremely tiny. What is the most likely result according to the lecture?", ["More context switching, so more time is spent on admin and less on real work", "The convoy effect gets worse", "Every process starves"], "Round Robin's weak point: more switching = more overhead (Module 14).");

  /* ---- Module 14 ---- */
  L(14, "m", "What does the OS write into a process's PCB right before pausing it?", ["Its current progress — exactly where it stopped, so it can resume from there later", "A permanent copy of the entire program file", "Nothing — the PCB is only created once the process finishes"], "Just the bookmark: where it stopped and what the CPU was holding.");
  L(14, "m", "Why can very frequent context switching actually slow a system down?", ["Each switch costs real CPU time on saving/loading state — more switches means more time spent on admin, not real work", "It doesn't — more switching is always faster", "Because PIDs run out quickly"], "Every switch is a small tax of pure admin. Many switches = a big tax.");
  T(14, "e", "A PCB is kept in RAM, one for every process the OS creates.", true, "True.");
  B(14, "e", "A context switch is Save + ______.", ["load"], "Save the old process's state to its PCB, then Load the next process's state.");
  M(14, "m", "Which of these is NOT on a PCB according to the lecture?", ["The entire program file", "The PID", "The process state"], "PCB holds PID, where it stopped, values the CPU was holding, and state.");
  M(14, "e", "What does PCB stand for?", ["Process Control Block", "Program Control Buffer", "Processor Cache Bank"], "PCB = Process Control Block.");

  /* ---- Module 15 ---- */
  L(15, "e", "You type a command in your terminal. What relationship does the terminal now have with the new process it created?", ["The terminal is the parent; the new process is its child", "They become identical, indistinguishable processes", "The terminal is destroyed and replaced by the new process"], "The shell creates the new process, so shell = parent and command = child.");
  L(15, "m", "Why do Python processes doing heavy work show up near the top of htop?", ["htop sorts by resource usage — the biggest CPU users float to the top", "htop always lists Python processes first", "Python processes always have the lowest PID numbers"], "htop sorts by how much CPU/memory each process uses.");
  M(15, "e", "Which command force-stops a frozen process?", ["kill -9 <PID>", "ps aux", "ls -la"], "kill -9 sends 'stop immediately, no cleanup'.");
  C(15, "e", "In this ps aux row, what is the PID?", ["4821", "92.5", "newtonuser"], "Columns here: user, PID, %CPU, command. So PID = 4821, 92.5% CPU.", "newtonuser 4821 92.5 python spike.py");
  T(15, "m", "When a process ends, the OS takes back its RAM and its PCB slot and returns them to the free pool.", true, "True. Without this, RAM would slowly fill up forever.");
  M(15, "m", "What does multiprocessing let a Python program do?", ["Use several CPU cores at once by creating multiple separate processes", "Make one process run faster on one core", "Turn RAM into storage"], "A single process normally uses one core; several processes can run truly in parallel across cores.");
  S(15, "h", "You want a live view of processes, sorted so the biggest CPU users are on top. Which tool?", ["top / htop", "ps", "ps aux"], "ps aux is a plain snapshot list. top/htop are live and sorted by usage.");

  /* ---- Module 16 ---- */
  L(16, "m", "Why does the OS split RAM into fixed-size pages instead of giving each process one custom-sized chunk?", ["Custom-sized chunks leave awkward unusable gaps over time (fragmentation); fixed pages fit together with no gaps", "Fixed sizes are required by law", "Pages make the CPU run faster"], "Equal blocks stack like bricks without leftover holes.");
  L(16, "m", "Why does a computer feel slow/laggy when it's low on RAM and swapping heavily?", ["It's constantly moving pages between slow disk and RAM, and disk is far slower than RAM", "The CPU physically overheats when RAM is full", "Swapping deletes files permanently, causing errors"], "Swapping means shuffling pages to and from the disk. Disk is much slower than RAM.");
  T(16, "e", "Virtual memory means every process is told it owns memory starting from address 0.", true, "True — a convenient lie.");
  B(16, "e", "The hardware that translates a process's fake address into a real RAM location is the Memory Management ______ (MMU).", ["unit"], "MMU = Memory Management Unit.");
  M(16, "e", "A common page size mentioned in the lecture is:", ["4KB", "4GB", "4 bytes"], "Pages are small fixed-size blocks; a common size is 4KB.");
  S(16, "m", "Two processes both use 'address 1000' at the same time with no conflict. Why?", ["Each fake address is translated to a different real physical location", "They overwrite each other but the OS repairs it", "Only one is really running"], "Two different lies pointing to two completely separate, protected physical locations.");
  M(16, "h", "Which statement about a process's pages is true?", ["They can be spread across RAM, not necessarily next to each other", "They must be one continuous block", "They are always kept on the disk"], "Paging spreads a process across as many pages as it needs — not necessarily next to each other.");
  M(16, "m", "Which is NOT one of the four jobs of memory management?", ["Speed up the CPU clock", "Hand out RAM fairly", "Stop one process touching another's memory"], "Jobs: hand out RAM fairly, track who has what, take it back when a process ends, protect.");

  /* ---- Module 17 ---- */
  L(17, "m", "You run `mkdir data && cd data`. What happens if the folder already exists and mkdir fails?", ["cd data does NOT run, because && only continues if the previous command succeeded", "cd data still runs normally, since && ignores failure", "The terminal shows an error and closes"], "&& means 'only if the previous one worked'. (With ; it WOULD run.)");
  L(17, "e", "Why does adding & after a command let you keep typing immediately?", ["It runs the command in the background, so the shell doesn't wait for it to finish", "It deletes the command after running it once", "It runs the command twice as fast"], "& starts it in the background and hands the terminal back at once.");
  C(17, "m", "What does this command do?", ["Lists files, then keeps only names containing 'py'", "Deletes files containing 'py'", "Runs grep and ls at the same time in the background"], "| feeds the output of ls into grep py.", "ls | grep py");
  M(17, "e", "`cmd1 || cmd2` runs cmd2:", ["only if cmd1 failed", "only if cmd1 succeeded", "always"], "|| = OR ELSE, only if it failed.");
  M(17, "m", "Which operator guarantees the second command runs even if the first one fails?", [";", "&&", "||"], "; = 'then', always runs next.");
  S(17, "m", "You want to start three Python scripts at once and still keep using the terminal. What do you do?", ["Put & after each script, e.g. python3 script1.py &", "Separate them with && and press Enter", "Pipe them together with |"], "Each script with & becomes its own background process with its own PID.");
  C(17, "h", "What is the effect of this line if mkdir fails?", ["cd notes still runs", "cd notes is skipped", "The terminal closes"], "; runs the next command no matter what happened with the one before it.", "mkdir notes; cd notes");
  M(17, "e", "In `cmd1 | cmd2`, what becomes the input of cmd2?", ["The output of cmd1", "The file cmd1", "The exit status of cmd1"], "Pipe: output of the left becomes input of the right.");

  /* ---- Module 18 ---- */
  L(18, "e", "A smart thermostat is best classified as which type of computer?", ["Embedded system", "Personal computer", "Server"], "A small computer inside one device doing one job forever = embedded system.");
  M(18, "e", "Which type of computer serves many other computers over a network at the same time?", ["Server / data center", "Embedded system", "Personal computer"], "Servers & data centers store and provide data/services to many computers at once.");
  B(18, "e", "A washing machine or an ATM contains a small computer built for one job. It is called an ______ system.", ["embedded"], "Embedded systems: washing machines, traffic lights, ATMs, smart thermostats.");
  T(18, "e", "Quantum computers use quantum physics to solve certain problems that classical computers can't handle efficiently.", true, "True, per the lecture.");
  M(18, "m", "Which is the correct order of the tiers in the lecture?", ["Embedded, Personal, Server, Supercomputer, Quantum", "Personal, Embedded, Supercomputer, Server, Quantum", "Quantum, Supercomputer, Server, Personal, Embedded"], "Order to memorise: Embedded, Personal, Server, Supercomputer, Quantum.");
  S(18, "m", "A laptop, a desktop and a smartphone are built for one person's everyday use. Which tier?", ["Personal computers", "Servers", "Embedded systems"], "Personal computers: desktops, laptops, smartphones.");

  /* ---- Module 19 ---- */
  L(19, "m", "In the API-as-restaurant analogy, what does the 'menu' represent?", ["The interface — the shared boundary between the customer and the kitchen", "The customer's request itself", "The kitchen's internal cooking process"], "The menu is the agreed way to ask. The request is the order; the cooking is hidden.");
  M(19, "e", "An API is:", ["How two programs talk to each other, with no human or screen", "A window with icons and buttons", "A text window where you type commands"], "API = program talks to program.");
  B(19, "m", "On macOS, the CLI shell mentioned in the lecture is ______.", ["zsh"], "On macOS the shell is zsh.");
  T(19, "e", "An API always needs a human clicking buttons on a screen.", false, "False — no human, no buttons, no screen involved at all.");
  M(19, "m", "The GUI was made mainstream by which 1984 product?", ["The Macintosh", "Windows 95", "The first smartphone"], "Born at Xerox PARC in the 1970s, mainstream with the 1984 Macintosh.");
  C(19, "m", "What does the response of this curl command tell you?", ["The International Space Station's position (longitude, latitude) with message: success", "A list of files in your current folder", "The number of processes running"], "curl asked an API for data; the response is the ISS position and 'message: success'.", "curl http://api.open-notify.org/iss-now.json");

  /* ---- Module 20 ---- */
  L(20, "m", "Why does Linux dominate servers far more than desktop computers?", ["Its deep customizability matters much more on servers nobody directly looks at than on everyday desktops", "Linux can't run any desktop applications", "Servers are physically unable to run Windows or macOS"], "Server admins want full control and tuning. Everyday users prefer easy, so desktops lean to Windows/macOS.");
  M(20, "e", "Which OS is described as 'Apple ecosystem only' for hardware/software support?", ["macOS", "Windows", "Linux"], "macOS: Apple ecosystem only.");
  M(20, "e", "Typical users: 'developers, tech enthusiasts' describes which OS?", ["Linux", "Windows", "macOS"], "Linux: developers, tech enthusiasts.");
  B(20, "m", "Memory trick: Windows = wide, macOS = easy + ______, Linux = custom + technical.", ["locked"], "macOS = easy + locked.");
  T(20, "e", "Linux is highly customizable but needs technical knowledge.", true, "True.");
  M(20, "m", "Customization: which is correct?", ["Windows limited but accessible; macOS minimal, Apple-controlled; Linux highly customizable", "Windows highly customizable; macOS limited; Linux minimal", "All three are equally customizable"], "From the comparison table.");

  /* ---- Module 21 ---- */
  L(21, "m", "chmod 640 file.txt — what access does the group get?", ["Read only (r--), since 4 = read", "Full access (rwx)", "No access at all"], "640 = owner 6 (rw-), group 4 (r--), others 0. The middle digit is the group.");
  L(21, "e", "What's the difference between find and grep?", ["find searches for files by name; grep searches for text inside files", "They do exactly the same thing", "find only works on directories, grep only on single files"], "find = look for a FILE by name. grep = look for WORDS inside a file.");
  C(21, "m", "What does this command give the owner, group and others?", ["Owner rwx, group none, others none", "Everyone rwx", "Owner none, group rwx, others none"], "7 = rwx for the owner; 0 = --- for group and others.", "chmod 700 keyvault");
  B(21, "m", "chmod 640: the owner's permission is (write it like rwx):", ["rw-", "rw"], "6 = 4 + 2 = read + write = rw-.");
  B(21, "e", "wc -l counts ______.", ["lines"], "wc -l lines, -w words, -c characters.");
  M(21, "e", "Which symbol REPLACES a file's contents with a command's output?", [">", ">>", "<"], "> replaces; >> appends; < feeds input.");
  C(21, "m", "What does this command do?", ["Finds every .txt file starting from the current directory", "Finds text 'txt' inside files", "Deletes all .txt files"], "find looks for files by name; '*.txt' is a wildcard; '.' = start here.", "find . -name '*.txt'");
  C(21, "m", "What does this command do?", ["Finds lines containing hello in file.txt, ignoring uppercase/lowercase", "Finds files named hello", "Counts how many times hello appears"], "grep searches inside a file; -i ignores case.", "grep -i 'hello' file.txt");
  M(21, "e", "Which command shows the LAST lines of a file (useful for logs)?", ["tail", "head", "sort"], "head = first lines; tail = last lines.");
  M(21, "e", "Which command sorts lines in reverse alphabetical order?", ["sort -r", "sort", "wc -l"], "sort = alphabetical; -r reverses.");
  M(21, "e", "The question says 'change permissions'. Which command?", ["chmod", "cd", "cp"], "change permissions → chmod.");
  M(21, "h", "chmod 754 gives:", ["Owner rwx, group r-x, others r--", "Owner r-x, group rwx, others r--", "Owner rwx, group r--, others r-x"], "7 = rwx, 5 = 4+1 = r-x, 4 = r--. Digits are owner, group, others.");
  S(21, "h", "You want every line of names.txt in reverse alphabetical order, saved into sorted.txt (replacing any old content). Which line?", ["sort -r names.txt > sorted.txt", "sort names.txt >> sorted.txt", "sort -r names.txt | sorted.txt"], "sort -r reverses the order; > replaces the file's content. >> would append instead.");
  S(21, "h", "You need to check the last lines of a long log file. Which command?", ["tail", "head", "wc -c"], "tail shows the last lines — useful for the end of a log file.");
  C(21, "h", "What is the result of this?", ["a.txt contains only 'two' (the file was replaced)", "a.txt contains 'one' and 'two'", "a.txt is empty"], "> replaces the file's content each time, so the second command overwrites the first.", "echo one > a.txt\necho two > a.txt");

  /* ---- Module 22 ---- */
  L(22, "m", "A process ignores `kill 4821` and keeps running. What's the correct next step, and why?", ["kill -9 4821 — escalate to SIGKILL since the polite SIGTERM request was ignored", "Run kill 4821 again with the exact same command", "rm 4821 to delete the process file"], "Plain kill = polite SIGTERM (15) and it was ignored. Escalate to kill -9 = SIGKILL (9).");
  M(22, "e", "Which command shows every process on the whole system?", ["ps aux", "ps", "ls"], "ps shows only your current terminal session; ps aux shows everything.");
  T(22, "m", "kill <PID> sends SIGKILL (signal 9).", false, "False — plain kill sends SIGTERM (15), a polite request. kill -9 sends SIGKILL.");
  B(22, "e", "kill -9 sends signal number ______.", ["9"], "kill -9 = SIGKILL (9).");
  M(22, "m", "SIGTERM is signal number:", ["15", "9", "1"], "kill <PID> = SIGTERM (15) — polite. kill -9 = SIGKILL (9).");
  S(22, "m", "Why does Activity Monitor show far more processes than plain ps?", ["Plain ps only shows processes tied to your current terminal session; ps aux-style lists everything", "Activity Monitor invents extra processes", "ps hides processes to save memory"], "That is the answer your lecture gives.");
  M(22, "e", "Which columns does ps aux show (lecture list)?", ["USER, PID, %CPU, %MEM, COMMAND", "NAME, SIZE, DATE, TYPE", "FILE, OWNER, GROUP, MODE"], "Columns: USER, PID, %CPU, %MEM, COMMAND.");
  S(22, "h", "A frozen program: which is the correct escalation order?", ["Try kill <PID> first; if ignored, use kill -9 <PID>", "Use kill -9 <PID> first, then kill <PID>", "Delete the program file with rm"], "Escalation ladder: kill first (polite). If ignored, kill -9 (force).");

"use strict";
/* ================= SCHEDULING ENGINE =================
   All four algorithms follow the PPT's own rule:
   Turnaround Time = Waiting Time + Burst Time
   Waiting Time = Turnaround Time - Burst Time
   Processes here are plain objects: {id, at, bt, prio}
================================================================ */

function schedFCFS(procs) {
  const ps = procs.slice().sort((a, b) => a.at - b.at || a.id.localeCompare(b.id));
  let t = 0; const seg = []; const res = [];
  ps.forEach(p => {
    if (p.at > t) { seg.push({ id: null, start: t, end: p.at, idle: true }); t = p.at; }
    const start = t, end = t + p.bt;
    seg.push({ id: p.id, start, end });
    t = end;
    const tat = end - p.at, wt = tat - p.bt;
    res.push({ id: p.id, at: p.at, bt: p.bt, ct: end, tat, wt });
  });
  return { seg, res };
}

function schedSJF(procs) {
  const ps = procs.map(p => ({ ...p, rem: p.bt, done: false }));
  let t = Math.min(...ps.map(p => p.at));
  const seg = []; const res = [];
  let doneCount = 0;
  while (doneCount < ps.length) {
    const avail = ps.filter(p => !p.done && p.at <= t);
    if (!avail.length) {
      const nextAt = Math.min(...ps.filter(p => !p.done).map(p => p.at));
      seg.push({ id: null, start: t, end: nextAt, idle: true });
      t = nextAt; continue;
    }
    avail.sort((a, b) => a.bt - b.bt || a.at - b.at || a.id.localeCompare(b.id));
    const p = avail[0];
    const start = t, end = t + p.bt;
    seg.push({ id: p.id, start, end });
    t = end; p.done = true; doneCount++;
    const tat = end - p.at, wt = tat - p.bt;
    res.push({ id: p.id, at: p.at, bt: p.bt, ct: end, tat, wt });
  }
  res.sort((a, b) => procs.findIndex(p => p.id === a.id) - procs.findIndex(p => p.id === b.id));
  return { seg, res };
}

function schedPriority(procs, higherIsMore, agingEnabled, agingEvery, agingStep) {
  const ps = procs.map(p => ({ ...p, done: false, curPrio: p.prio, waitSince: null }));
  let t = Math.min(...ps.map(p => p.at));
  const seg = []; const res = []; let doneCount = 0;
  const better = (a, b) => higherIsMore ? a.curPrio > b.curPrio : a.curPrio < b.curPrio;
  while (doneCount < ps.length) {
    const avail = ps.filter(p => !p.done && p.at <= t);
    if (!avail.length) {
      const nextAt = Math.min(...ps.filter(p => !p.done).map(p => p.at));
      seg.push({ id: null, start: t, end: nextAt, idle: true });
      t = nextAt; continue;
    }
    // aging: while any process waits, its priority creeps toward "more urgent"
    if (agingEnabled) {
      avail.forEach(p => {
        if (p.waitSince == null) p.waitSince = t;
        const waited = t - p.waitSince;
        const steps = Math.floor(waited / Math.max(1, agingEvery));
        p.curPrio = higherIsMore ? p.prio + steps * agingStep : Math.max(0, p.prio - steps * agingStep);
      });
    }
    let best = avail[0];
    avail.forEach(p => { if (better(p, best)) best = p; });
    const start = t, end = t + best.bt;
    seg.push({ id: best.id, start, end });
    t = end; best.done = true; doneCount++;
    const tat = end - best.at, wt = tat - best.bt;
    res.push({ id: best.id, at: best.at, bt: best.bt, ct: end, tat, wt, prio: best.prio });
  }
  res.sort((a, b) => procs.findIndex(p => p.id === a.id) - procs.findIndex(p => p.id === b.id));
  return { seg, res };
}

function schedRR(procs, quantum) {
  const ps = procs.map(p => ({ ...p, rem: p.bt }));
  const order = ps.slice().sort((a, b) => a.at - b.at || a.id.localeCompare(b.id));
  let t = order[0] ? order[0].at : 0;
  const queue = [];
  const arrived = new Set();
  const seg = []; const finish = {};
  const admit = () => { order.forEach(p => { if (!arrived.has(p.id) && p.at <= t) { queue.push(p); arrived.add(p.id); } }); };
  admit();
  let guard = 0;
  while (queue.length && guard++ < 100000) {
    const p = queue.shift();
    if (p.at > t) { seg.push({ id: null, start: t, end: p.at, idle: true }); t = p.at; }
    const run = Math.min(quantum, p.rem);
    const start = t, end = t + run;
    seg.push({ id: p.id, start, end });
    t = end; p.rem -= run;
    admit();
    if (p.rem > 0) queue.push(p); else finish[p.id] = end;
    if (!queue.length) admit();
  }
  // merge back-to-back identical-id segments (process runs its whole remaining quantum uninterrupted, nothing to merge normally)
  const res = order.map(p => {
    const ct = finish[p.id] != null ? finish[p.id] : t;
    const tat = ct - p.at, wt = tat - p.bt;
    return { id: p.id, at: p.at, bt: p.bt, ct, tat, wt };
  });
  return { seg, res };
}

function schedAverages(res) {
  const n = res.length || 1;
  const aw = res.reduce((s, r) => s + r.wt, 0) / n;
  const at = res.reduce((s, r) => s + r.tat, 0) / n;
  return { aw, at };
}

const PCOLORS = ["#2453D6", "#0B8A7E", "#BF5F12", "#5745D6", "#C23A3A", "#13835A", "#8A5A00", "#B04AD6"];
function colorFor(id, ids) { const i = ids.indexOf(id); return PCOLORS[i % PCOLORS.length]; }

function renderGantt(seg, ids) {
  const maxT = seg.length ? seg[seg.length - 1].end : 1;
  const scale = Math.max(1, Math.min(56, 640 / Math.max(1, maxT)));
  let x = 0; const blocks = []; const ticks = [];
  seg.forEach(s => {
    const w = Math.max(2, (s.end - s.start) * scale);
    const cls = s.idle ? "gb idle" : "gb";
    const style = s.idle ? "" : "background:" + colorFor(s.id, ids) + ";";
    blocks.push('<div class="' + cls + '" style="left:' + x + 'px;width:' + w + 'px;' + style + '">' + (s.idle ? "idle" : esc(s.id)) + "</div>");
    ticks.push('<span style="left:' + x + 'px">' + s.start + "</span>");
    x += w;
  });
  ticks.push('<span style="left:' + x + 'px">' + maxT + "</span>");
  const legend = ids.map(id => '<span class="small"><i style="background:' + colorFor(id, ids) + '"></i>' + esc(id) + "</span>").join("");
  return '<div class="gantt-wrap"><div class="legend">' + legend + '</div><div class="gantt" style="width:' + (x + 4) + 'px">' + blocks.join("") +
    '</div><div class="gticks" style="width:' + (x + 30) + 'px">' + ticks.join("") + "</div></div>";
}

function renderResultTable(res, extraCol) {
  const rows = res.map(r => "<tr><td>" + esc(r.id) + '</td><td class="num">' + r.at + '</td><td class="num">' + r.bt + '</td>' +
    (extraCol ? '<td class="num">' + (r.prio != null ? r.prio : "–") + "</td>" : "") +
    '<td class="num">' + r.ct + '</td><td class="num">' + r.wt + '</td><td class="num">' + r.tat + "</td></tr>").join("");
  return '<div class="table-wrap"><table><thead><tr><th>Process</th><th class="num">Arrival</th><th class="num">Burst</th>' +
    (extraCol ? '<th class="num">Priority</th>' : "") +
    '<th class="num">Completion</th><th class="num">Waiting</th><th class="num">Turnaround</th></tr></thead><tbody>' + rows + "</tbody></table></div>";
}

function symFor(v) { return CHBITS.map(([bit, ch]) => (v & bit) ? ch : "-").join(""); }
function chmodDigits() { return "" + CHMOD.o + CHMOD.g + CHMOD.u; }

Object.assign(ACTIONS, {

    "<dt>Group</dt><dd>" + symFor(CHMOD.g) + " — " + chmodDescribe(CHMOD.g) + "</dd>" +
    "<dt>Others</dt><dd>" + symFor(CHMOD.u) + " — " + chmodDescribe(CHMOD.u) + "</dd>" +
    "</div>" +
    "</div>" +
    '<div class="card flat"><h3>Worked examples from the PPT</h3>' +
    '<div class="grid g2">' +
    '<div><code>chmod 700 keyvault</code><p class="small muted">Owner rwx (7), group --- (0), others --- (0). Everyone else gets nothing.</p></div>' +

}
function chmodDescribe(v) {
  const parts = [];
  if (v & 4) parts.push("read");
  if (v & 2) parts.push("write");
  if (v & 1) parts.push("execute");
  return parts.length ? parts.join(" + ") : "no access";
}
function bindChmodInputs(root) {
  const inp = $("#chmodInput", root);
  if (inp) inp.addEventListener("change", () => {
    const v = inp.value.replace(/\D/g, "").slice(0, 3).padEnd(3, "0");
    ACTIONS.chmodSet(v.split("").map(d => Math.min(7, +d)).join(""));
  });
}

function partTiles(part) {

function modulePracticeStats() {
  const stats = {};

  QUESTIONS.forEach(q => {
    const prefix = q.id + "-";
    const answers = Object.keys(S.quiz)
      .filter(key => key.startsWith(prefix));

    if (!answers.length) return;

    if (!stats[q.m]) {
      stats[q.m] = { total: 0, correct: 0 };
    }

    stats[q.m].total += answers.length;
    stats[q.m].correct +=
      answers.filter(key => S.quiz[key]).length;
  });

  return Object.entries(stats)
    .map(([module, s]) => ({
      module: +module,
      total: s.total,
      correct: s.correct,
      accuracy: Math.round((s.correct / s.total) * 100)
    }))
    .sort((a, b) =>
      b.accuracy - a.accuracy || b.total - a.total
    );
}

function difficultyPracticeStats() {
  const levels = {
    e: { label: "Easy", total: 0, correct: 0 },
    m: { label: "Medium", total: 0, correct: 0 },
    h: { label: "Hard", total: 0, correct: 0 }
  };

  QUESTIONS.forEach(q => {
    const level = levels[q.d];
    if (!level) return;

    const prefix = q.id + "-";
    const answers = Object.keys(S.quiz)
      .filter(key => key.startsWith(prefix));

    level.total += answers.length;
    level.correct +=
      answers.filter(key => S.quiz[key]).length;
  });

  return Object.values(levels).map(level => ({
    label: level.label,
    total: level.total,
    correct: level.correct,
    accuracy: level.total
      ? Math.round((level.correct / level.total) * 100)
      : 0
  }));
}


function quizTrendStats() {
  const dayKey = date =>
    date.getFullYear() + "-" +
    String(date.getMonth() + 1).padStart(2, "0") + "-" +
    String(date.getDate()).padStart(2, "0");

  const days = [];
  const today = new Date();

  for (let i = 6; i >= 0; i--) {
    const date = new Date(
      today.getFullYear(),
      today.getMonth(),
      today.getDate() - i
    );

    days.push({
      key: dayKey(date),
      label: date.toLocaleDateString(undefined, {
        weekday: "short"
      }),
      total: 0,
      correct: 0,
      accuracy: 0
    });
  }

  const byDay = {};
  days.forEach(day => {
    byDay[day.key] = day;
  });

  Object.entries(S.quiz).forEach(([key, correct]) => {
    const match = key.match(/-(\d{13})$/);
    if (!match) return;

    const date = new Date(Number(match[1]));
    if (isNaN(date.getTime())) return;

    const day = byDay[dayKey(date)];
    if (!day) return;

    day.total++;
    if (correct) day.correct++;
  });

  days.forEach(day => {
    day.accuracy = day.total
      ? Math.round((day.correct / day.total) * 100)
      : 0;
  });

  return days;
}


function weakModules() {
  const stats = {};

  QUESTIONS.forEach(q => {
    const prefix = q.id + "-";

    const answers = Object.keys(S.quiz)
      .filter(key => key.startsWith(prefix));

    if (!answers.length) return;

    if (!stats[q.m]) {
      stats[q.m] = {
        total: 0,
        correct: 0
      };
    }

    answers.forEach(key => {
      stats[q.m].total++;

      if (S.quiz[key]) {
        stats[q.m].correct++;
      }
    });
  });

  return Object.entries(stats)
    .filter(([m, s]) =>
      s.total >= 2 &&
      (s.correct / s.total) < 0.6
    )
    .map(([m, s]) => ({
      module: +m,
      total: s.total,
      correct: s.correct,
      accuracy: Math.round((s.correct / s.total) * 100)
    }))
    .sort((a, b) => a.accuracy - b.accuracy);
}

function weakQuestions() {
  return QUESTIONS
    .map(q => {
      const answers = Object.keys(S.quiz)
        .filter(key => key.startsWith(q.id + "-"));

      if (!answers.length) return null;

      const total = answers.length;
      const correct = answers.filter(key => S.quiz[key]).length;
      const accuracy = Math.round((correct / total) * 100);

      return {
        id: q.id,
        module: q.m,
        type: q.t,
        question: q.q,
        total,
        correct,
        accuracy
      };
    })
    .filter(q => q && q.total >= 2 && q.accuracy < 60)
    .sort((a, b) => a.accuracy - b.accuracy || b.total - a.total);
}


function dailyStudyRecommendation(daily) {
  const weak = weakQuestions();

  const ranked = MODULES.map(module => {
    const topics = weak.filter(w => w.module === module.n);

    const weaknessPoints = topics.reduce(
      (sum, w) => sum + 25 + Math.max(0, 60 - w.accuracy),
      0
    );

    const unfinishedBonus = S.done[module.n] ? 0 : 15;
    const dailyGoalBonus =
      daily.completed < daily.goal && !S.done[module.n] ? 10 : 0;

    const score = Math.min(
      100,
      weaknessPoints + unfinishedBonus + dailyGoalBonus
    );

    return { module, topics, score };
  }).sort((a, b) =>
    b.score - a.score ||
    b.topics.length - a.topics.length ||
    a.module.n - b.module.n
  );

  const best = ranked[0];

  if (best && best.score > 0) {
    if (best.topics.length) {
      const lowestAccuracy = Math.min(
        ...best.topics.map(w => w.accuracy)
      );

      return {
        title: "Priority: revise Module " + best.module.n,
        message: best.topics.length + " weak question" +
          (best.topics.length === 1 ? "" : "s") +
          " found here. Lowest recorded accuracy: " +
          lowestAccuracy + "%. Review this module first.",
        button: "Review Module " + best.module.n + " →",
        href: "#/module/" + best.module.n,
        score: best.score
      };
    }

    return {
      title: "Recommended: continue learning",
      message: "Module " + best.module.n + " — " +
        best.module.title +
        " is your highest-priority unfinished module.",
      button: "Continue learning →",
      href: "#/module/" + best.module.n,
      score: best.score
    };
  }

  return {
    title: "Course complete — keep revising",
    message: "All modules are complete and no weak questions are currently recorded. Try a mixed quiz.",
    button: "Start a mixed quiz →",
    href: "#/quiz",
    score: 10
  };
}

"use strict";
/* Build a stable per-question shuffled option order, memoized by attempt object */
function qOptions(q) {
  if (q.t === "mcq" || q.t === "cmd" || q.t === "scn" || (q.t === "cpu" && q.o)) {
    const opts = q.o.map((text, i) => ({ key: String.fromCharCode(97 + i), text, correct: i === 0 }));
    return shuffle(opts);
  }
  return null;
}
function qLabel(q) {

}

      '<button class="opt" style="width:auto" data-act="qPick" data-arg="' + name + '|' + v + '"><span class="k">' + l[0] + "</span>" + l + "</button>").join("") + "</div>";
  }

  }

  if (q.t === "cpu" && !q.o) {

  }

  return opts.map(o => '<button class="opt" data-act="qPick" data-arg="' + name + '|' + o.key + '"><span class="k">' + o.key.toUpperCase() + "</span>" + md(o.text) + "</button>").join("");

/* Render the answered state with correctness highlighting */
function qRenderAnswered(q, attempt, name) {
  let body = "";

    body = '<div class="row" style="gap:10px">' + [["true", "True"], ["false", "False"]].map(([v, l]) => {
      const isRight = v === String(q.a);
      const isGiven = attempt.given === v;
      const cls = isRight ? "right" : (isGiven ? "wrong" : "");
      return '<button class="opt ' + cls + '" style="width:auto" disabled><span class="k">' + l[0] + "</span>" + l + "</button>";
    }).join("") + "</div>";
  } else if (q.t === "fill") {
    const ok = attempt.correct;
    body = '<div class="opt ' + (ok ? "right" : "wrong") + '" style="cursor:default">Your answer: ' + esc(attempt.given || "(blank)") + "</div>" +
      (ok ? "" : '<div class="opt right" style="cursor:default">Accepted: ' + q.acc.map(esc).join(" / ") + "</div>");
  } else if (q.t === "cpu" && !q.o) {

  } else {

    }).join("");
  }
