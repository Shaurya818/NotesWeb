const NAV_STATIC = [
  ["#/", "home", "Dashboard"],
  ["#/sched", "cpu", "CPU Scheduling Calc"],
  ["#/chmod", "lock", "chmod Calculator"],
  ["#/terminal", "term", "Terminal Reference"],
  ["#/process", "proc", "Process & PCB Lab"],
  ["#/memory", "mem", "Memory Lab"],
  ["#/interfaces", "layers", "GUI / CLI / API"],
  ["#/hardware", "chip", "Hardware"],
  ["#/compare", "scale", "Windows/macOS/Linux"],
  ["#/computers", "layers", "Types of Computers"],
  ["#/flashcards", "cards", "Flashcards"],
  ["#/quiz", "quiz", "Quiz Mode"],
  ["#/exam", "exam", "Exam Mode"],
  ["#/play", "game", "Command Match 🎮"],
  ["#/revision", "rev", "Last-Minute Revision"]
];

function sidebarHtml(hash) {
  const navItem = ([href, icon, label]) => '<a href="' + href + '" class="' + (hash === href ? "on" : "") + '">' + ICONS[icon] + "<span>" + label + "</span></a>";
  const partGroup = (part) => {
    const [lo, hi] = PART_RANGE[part];
    let items = "";
    for (let n = lo; n <= hi; n++) {
      const m = MODULES.find(x => x.n === n);
      const href = "#/module/" + n;
      items += '<a href="' + href + '" class="' + (hash === href ? "on" : "") + (S.done[n] ? " done" : "") + '"><span class="mnum p' + part + '"><span>' + n + "</span></span><span class=\"mt\">" + (m ? esc(m.title) : "Module " + n) + "</span></a>";
    }
    const isOpen = hash.startsWith("#/module/") && partOf(+hash.split("/")[2]) === part;
    return "<details" + (isOpen ? " open" : "") + '><summary><span class="badge p' + part + '">' + PART_TITLE[part] + "</span></summary>" + items + "</details>";
  };
  return '<a class="brand" href="#/"><span class="brand-mark">$_</span><span><b>SNAI Study</b><small>Modules 1–28</small></span></a>' +
    '<nav class="nav">' + navItem(NAV_STATIC[0]) +
    '<div class="grp">Notes by module</div>' + partGroup(1) + partGroup(2) + partGroup(3) + partGroup(4) + partGroup(5) +
    '<div class="grp">Tools</div>' + NAV_STATIC.slice(1, 10).map(navItem).join("") +
    '<div class="grp">Practice</div>' + NAV_STATIC.slice(10).map(navItem).join("") +
    "</nav>";
}

function topbarHtml() {
  const theme = document.documentElement.getAttribute("data-theme");
  const isDark = theme === "dark" || (!theme && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
  return '<button class="icon-btn" id="menuBtn" aria-label="Open menu">' + ICONS.menu + "</button>" +
    '<div class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>' +
    '<input id="topSearch" placeholder="Search SNAI…" aria-label="Search"><kbd>Enter ↵</kbd></div>' +
    xpWidgetHtml() +
    '<button class="icon-btn" id="soundBtn" aria-label="' + (S.sound ? "Mute sound effects" : "Unmute sound effects") + '" data-act="toggleSound">' + (S.sound ? ICONS.volOn : ICONS.volOff) + "</button>" +
    '<button class="icon-btn" id="themeBtn" aria-label="Toggle dark mode">' + (isDark ? ICONS.sun : ICONS.moon) + "</button>";
}

function applyTheme(next) {
  document.documentElement.setAttribute("data-theme", next);
  S.theme = next; saveState();
}
function initTheme() {
  if (S.theme === "dark" || S.theme === "light") document.documentElement.setAttribute("data-theme", S.theme);
}

/* ---------- ROUTER ---------- */
function parseHash() {
  const h = location.hash || "#/";
  const parts = h.replace(/^#\//, "").split("/").filter(Boolean);
  return { h, parts };
}
function route(skipScroll) {
  const { h, parts } = parseHash();
  let html = "";
  let after = null;
  if (!parts.length) html = viewHome();
  else if (parts[0] === "module") html = viewModule(+parts[1]);
  else if (parts[0] === "sched") { html = viewScheduling(); after = () => bindSchedInputs($("#app")); }
  else if (parts[0] === "chmod") { html = viewChmod(); after = () => bindChmodInputs($("#app")); }
  else if (parts[0] === "terminal") { html = viewTerminal(); after = () => bindTermInputs($("#app")); }
  else if (parts[0] === "process") html = viewProcess();
  else if (parts[0] === "memory") html = viewMemory();
  else if (parts[0] === "interfaces") html = viewInterfaces();
  else if (parts[0] === "hardware") html = viewHardware();
  else if (parts[0] === "compare") html = viewCompare();
  else if (parts[0] === "computers") html = viewComputerTypes();
  else if (parts[0] === "os") html = viewOS();
  else if (parts[0] === "flashcards") html = viewFlashcards();
  else if (parts[0] === "quiz") html = viewQuiz();
  else if (parts[0] === "exam") html = viewExam();
  else if (parts[0] === "play") html = viewGame();
  else if (parts[0] === "revision") html = viewRevision();
  else if (parts[0] === "search") { html = viewSearch(decodeURIComponent(parts[1] || "")); after = () => bindSearchInputs($("#app")); }
  else html = viewHome();

  $("#app").innerHTML = '<div class="view">' + html + "</div>";
  $("#sidebarSlot").innerHTML = sidebarHtml(h);
  $("#topbarSlot").innerHTML = topbarHtml();
  bindTopbar();
  bindSearchInputs($("#app")); // wires #homeSearch / #globalSearch when present on this page
  if (after) after();
  if (!skipScroll) window.scrollTo({ top: 0 });
  closeSidebar();
}

function bindTopbar() {
  const menuBtn = $("#menuBtn"); if (menuBtn) menuBtn.addEventListener("click", openSidebar);
  const themeBtn = $("#themeBtn");
  if (themeBtn) themeBtn.addEventListener("click", () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const curDark = cur === "dark" || (!cur && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
    applyTheme(curDark ? "light" : "dark");
    $("#themeBtn").innerHTML = curDark ? ICONS.moon : ICONS.sun;
  });
  const topSearch = $("#topSearch");
  if (topSearch) topSearch.addEventListener("keydown", (e) => { if (e.key === "Enter" && topSearch.value.trim()) location.hash = "#/search/" + encodeURIComponent(topSearch.value.trim()); });
}
function openSidebar() { $(".sidebar").classList.add("open"); $("#overlay").classList.add("show"); }
function closeSidebar() { const sb = $(".sidebar"); if (sb) sb.classList.remove("open"); const ov = $("#overlay"); if (ov) ov.classList.remove("show"); }

/* ---------- GLOBAL CLICK DELEGATION ---------- */
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (el) {
    const fn = ACTIONS[el.dataset.act];
    if (fn) { e.preventDefault(); fn(el.dataset.arg); }
    return;
  }
  if (e.target.id === "overlay") closeSidebar();
});
document.addEventListener("keydown", (e) => {
  const typing = document.activeElement && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if (e.key === "Enter" || e.key === " ") {
    const el = e.target.closest && e.target.closest('[role="button"][data-act]');
    if (el && document.activeElement === el) { e.preventDefault(); const fn = ACTIONS[el.dataset.act]; if (fn) fn(el.dataset.arg); }
  }
  if (e.key === "Escape") closeSidebar();
  if (typing) {
    if (e.key === "Enter") {
      const fillBtn = $('[data-act="qSubmitFill"]'); const numBtn = $('[data-act="qSubmitNum"]');
      if (document.activeElement.id.startsWith("fillInput") && fillBtn) { e.preventDefault(); fillBtn.click(); }
      else if (document.activeElement.id.startsWith("numInput") && numBtn) { e.preventDefault(); numBtn.click(); }
    }
    return;
  }
  const { parts } = parseHash();
  if ((parts[0] === "quiz" || parts[0] === "exam") && /^[1-4]$/.test(e.key)) {
    const opts = $$('.opt[data-act="qPick"]:not([disabled])');
    const btn = opts[+e.key - 1];
    if (btn) { e.preventDefault(); btn.click(); }
  }
  if (parts[0] === "flashcards") {
    if (e.key === "ArrowRight") { e.preventDefault(); const b = $('[data-act="fcNext"]'); if (b) b.click(); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); const b = $('[data-act="fcPrev"]'); if (b) b.click(); }
    else if (e.key === " " || e.key === "Enter") { e.preventDefault(); const b = $('[data-act="fcFlip"]'); if (b) b.click(); }
    else if (e.key === "1") { e.preventDefault(); const b = $('[data-act="fcKnow"][data-arg="0"]'); if (b) b.click(); }
    else if (e.key === "2") { e.preventDefault(); const b = $('[data-act="fcKnow"][data-arg="1"]'); if (b) b.click(); }
  }
});

window.addEventListener("hashchange", () => route(false));
window.addEventListener("DOMContentLoaded", () => {
  initTheme();
  route(false);
});


// ===== CURSOR SPOTLIGHT =====

document.addEventListener("mousemove", (e) => {
    document.body.style.setProperty(
        "--mouse-x",
        `${e.clientX}px`
    );

    document.body.style.setProperty(
        "--mouse-y",
        `${e.clientY}px`
    );
});

// ===== 3D CARD TILT =====

document.querySelectorAll(".card, .tile, .stat").forEach((card) => {

    card.addEventListener("mousemove", (e) => {

        const rect = card.getBoundingClientRect();

        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        const centerX = rect.width / 2;
        const centerY = rect.height / 2;

        const rotateX = ((y - centerY) / centerY) * -5;
        const rotateY = ((x - centerX) / centerX) * 5;

        card.style.transform =
            `perspective(800px)
             rotateX(${rotateX}deg)
             rotateY(${rotateY}deg)
             scale(1.02)`;
    });

    card.addEventListener("mouseleave", () => {

        card.style.transform =
            "perspective(800px) rotateX(0deg) rotateY(0deg) scale(1)";

    });

});
// ===== 3D CARD TILT =====

function enableCardTilt() {

    document.querySelectorAll(".card, .tile, .stat").forEach((card) => {

        if (card.dataset.tiltEnabled) return;

        card.dataset.tiltEnabled = "true";

        card.addEventListener("mousemove", (e) => {

            const rect = card.getBoundingClientRect();

            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const centerX = rect.width / 2;
            const centerY = rect.height / 2;

            const rotateX = ((y - centerY) / centerY) * -5;
            const rotateY = ((x - centerX) / centerX) * 5;

            card.style.transform =
                `perspective(800px)
                 rotateX(${rotateX}deg)
                 rotateY(${rotateY}deg)
                 scale(1.02)`;
        });

        card.addEventListener("mouseleave", () => {

            card.style.transform =
                "perspective(800px) rotateX(0deg) rotateY(0deg) scale(1)";

        });

    });
}

enableCardTilt();

window.addEventListener("hashchange", () => {
    setTimeout(enableCardTilt, 50);
});

// ===== END 3D CARD TILT =====

// ===== FLOATING PARTICLES =====

function createParticles() {

    const particleCount = 18;

    for (let i = 0; i < particleCount; i++) {

        const particle = document.createElement("div");

        particle.className = "particle";

        particle.style.left = `${Math.random() * 100}vw`;
        particle.style.top = `${Math.random() * 100}vh`;

        particle.style.animationDuration =
            `${8 + Math.random() * 12}s`;

        particle.style.animationDelay =
            `${Math.random() * 8}s`;

        document.body.appendChild(particle);
    }
}

createParticles();

// ===== END FLOATING PARTICLES =====

// ===== SCROLL REVEAL =====

function enableScrollReveal() {

    const elements = document.querySelectorAll(
        ".card, .tile, .stat"
    );

    elements.forEach((element) => {

        if (element.dataset.revealEnabled) return;

        element.dataset.revealEnabled = "true";
        element.classList.add("reveal");

    });

    const observer = new IntersectionObserver(
        (entries) => {

            entries.forEach((entry) => {

                if (entry.isIntersecting) {
                    entry.target.classList.add("visible");
                    observer.unobserve(entry.target);
                }

            });

        },
        {
            threshold: 0.12
        }
    );

    document.querySelectorAll(".reveal").forEach((element) => {
        observer.observe(element);
    });
}

enableScrollReveal();

window.addEventListener("hashchange", () => {

    setTimeout(enableScrollReveal, 100);

});

// ===== END SCROLL REVEAL =====
// ===== MAGNETIC BUTTONS =====

function enableMagneticButtons() {

    document.querySelectorAll(".btn").forEach((button) => {

        if (button.dataset.magneticEnabled) return;

        button.dataset.magneticEnabled = "true";

        button.addEventListener("mousemove", (e) => {

            const rect = button.getBoundingClientRect();

            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const moveX = (x - rect.width / 2) * 0.15;
            const moveY = (y - rect.height / 2) * 0.15;

            button.style.transform =
                `translate(${moveX}px, ${moveY}px)`;
        });

        button.addEventListener("mouseleave", () => {

            button.style.transform = "translate(0, 0)";

        });

    });
}

enableMagneticButtons();

window.addEventListener("hashchange", () => {

    setTimeout(enableMagneticButtons, 100);

});

// ===== END MAGNETIC BUTTONS =====
// ===== BUTTON RIPPLE =====

function enableButtonRipple() {

    document.querySelectorAll(".btn").forEach((button) => {

        if (button.dataset.rippleEnabled) return;

        button.dataset.rippleEnabled = "true";
        button.classList.add("ripple-btn");

        button.addEventListener("click", (e) => {

            const rect = button.getBoundingClientRect();

            const ripple = document.createElement("span");

            ripple.className = "ripple";

            ripple.style.left =
                `${e.clientX - rect.left}px`;

            ripple.style.top =
                `${e.clientY - rect.top}px`;

            button.appendChild(ripple);

            setTimeout(() => {
                ripple.remove();
            }, 600);

        });

    });
}

enableButtonRipple();

window.addEventListener("hashchange", () => {

    setTimeout(enableButtonRipple, 100);

});

// ===== END BUTTON RIPPLE =====
// ===== CARD SPOTLIGHT =====

function enableCardSpotlight() {

    document.querySelectorAll(".card, .tile, .stat").forEach((card) => {

        if (card.dataset.spotlightEnabled) return;

        card.dataset.spotlightEnabled = "true";

        card.addEventListener("mousemove", (e) => {

            const rect = card.getBoundingClientRect();

            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            card.style.setProperty(
                "--card-x",
                `${x}px`
            );

            card.style.setProperty(
                "--card-y",
                `${y}px`
            );

        });

    });
}

enableCardSpotlight();

window.addEventListener("hashchange", () => {

    setTimeout(enableCardSpotlight, 100);

});

// ===== END CARD SPOTLIGHT =====
// ===== COMPLETION ANIMATION =====

function watchCompletionAnimations() {

    const observer = new MutationObserver((mutations) => {

        mutations.forEach((mutation) => {

            if (
                mutation.type === "attributes" &&
                mutation.attributeName === "class"
            ) {

                const element = mutation.target;

                if (element.classList.contains("done")) {

                    element.style.animation = "none";

                    void element.offsetWidth;

                    element.style.animation =
                        "completionPop 0.5s ease-out";
                }
            }

        });

    });

    document.querySelectorAll(".tile").forEach((tile) => {

        observer.observe(tile, {
            attributes: true,
            attributeFilter: ["class"]
        });

    });
}

watchCompletionAnimations();

// ===== END COMPLETION ANIMATION =====

</script>
